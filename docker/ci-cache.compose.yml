name: kithara-ci-cache

# The whole stack is one container: the store, the setup it is served with,
# and the evictor that keeps each scope under its quota start and stop
# together, so the setup always runs the code the store is served with.
services:
  cache:
    image: kithara-ci-cache:local
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/ci-cache.Dockerfile
      args:
        CACHE_SERVER_IMAGE: ${KITHARA_CACHE_SERVER_IMAGE:?use just ci cache to load ci-pins.toml}
        CACHE_CLIENT_IMAGE: ${KITHARA_CACHE_CLIENT_IMAGE:?use just ci cache to load ci-pins.toml}
        RUST_VERSION: ${KITHARA_RUST_VERSION:?use just ci cache to load ci-pins.toml}
        RUST_BASE_DIGEST: ${KITHARA_RUST_DIGEST:?use just ci cache to load ci-pins.toml}
        CI_IMAGE: ${KITHARA_CI_IMAGE:?use just ci cache to load ci-pins.toml}
      secrets: [cache_env, kache_host]
    container_name: kithara-ci-cache
    # The host's environment whole: a scope sized apart names its quota as
    # CACHE_BUCKET_QUOTA_<SCOPE>, a name this file cannot list.
    env_file: ${CACHE_ENV_FILE:?use just ci cache}
    # What the evictor has not taken yet waits in memory: a request it misses
    # only ages an entry, and the queue must not take the store's disk.
    tmpfs:
      - /audit:size=128m
    # Directories on the host's disk, never named volumes: the store has to
    # outlive every rebuild of the image and container serving it.
    volumes:
      - ${CACHE_CONFIG_VOLUME:?set the host directory for the cache credentials}:/config
      - ${CACHE_DATA_VOLUME:?set the host directory for the cached objects}:/data
      - ${CACHE_CLIENTS_VOLUME:?set the host directory for the client credentials}:/clients
    ports:
      - "127.0.0.1:${CACHE_PORT:-19000}:9000"
    networks: [ci]
    # Docker's init hands the stack the signal that stops it; the stack
    # passes it to the store and waits for the store's last writes.
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

networks:
  ci:
    external: true
    name: ${CACHE_NETWORK:?set existing CI network}

secrets:
  cache_env:
    file: ${KITHARA_BUILD_CACHE_ENV:-/dev/null}
  kache_host:
    file: ${KITHARA_BUILD_KACHE_HOST:-/dev/null}
