[package]
name = "kithara-download"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol-agnostic HTTP download scheduling and request lifecycle."
autotests = false
keywords = ["http", "download", "streaming", "scheduling"]
categories = ["multimedia::audio", "asynchronous"]

[package.metadata.cargo-machete]
# `serde` is reached only through `#[derive(Patch)]`, whose expansion names
# `::serde::Deserialize`; no source line in this crate spells the crate out.
ignored = ["serde"]

[features]
default = ["client-reqwest", "tls-rustls"]
usdt = ["kithara-test-utils/usdt"]
flash = ["kithara-platform/flash", "kithara-test-utils/flash"]
no-block = ["kithara-platform/no-block", "kithara-test-utils/no-block"]
# HTTP backend forwarding to every kithara-net-reaching dep.
client-reqwest = ["kithara-net/client-reqwest", "kithara-abr/client-reqwest"]
client-wreq = ["kithara-net/client-wreq", "kithara-abr/client-wreq"]
client-apple = ["kithara-net/client-apple"]
tls-rustls = ["kithara-net/tls-rustls", "kithara-abr/tls-rustls"]
tls-native = ["kithara-net/tls-native", "kithara-abr/tls-native"]

[dependencies]
kithara-abr = { workspace = true, default-features = false }
kithara-derive = { workspace = true }
kithara-events = { workspace = true }
kithara-net = { workspace = true, default-features = false }
kithara-platform = { workspace = true }
kithara-test-utils = { workspace = true }

bon = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
humantime-serde = { workspace = true }
serde = { workspace = true }
thunderdome = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-test-utils = { path = "../kithara-test-utils", features = ["mock", "hang"] }

serde_yaml_ng = { workspace = true }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-platform = { workspace = true, features = ["tokio-net"] }

axum = { workspace = true }

[lints]
workspace = true
