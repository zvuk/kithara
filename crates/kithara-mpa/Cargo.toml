[package]
name = "kithara-mpa"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "MPEG audio (MP1/MP2/MP3) demuxer with transactional packet reads over non-blocking sources."
keywords = ["audio", "mp3", "mpeg", "demuxer", "streaming"]
categories = ["multimedia::audio"]

[dependencies]
num-traits = { workspace = true }
symphonia-core = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { workspace = true }

[lints]
workspace = true
