kithara-bufpool = { workspace = true, optional = true }
kithara-decode = { workspace = true, optional = true, default-features = false }
kithara-drm = { workspace = true, optional = true }
kithara-encode = { workspace = true, optional = true, default-features = false }
kithara-events = { workspace = true, optional = true }
kithara-file = { workspace = true, optional = true, default-features = false }
kithara-hls = { workspace = true, optional = true, default-features = false }
kithara-host = { workspace = true, optional = true, default-features = false }
kithara-net = { workspace = true, optional = true, default-features = false }
kithara-output = { workspace = true, optional = true }
kithara-platform = { workspace = true, optional = true }
kithara-play = { workspace = true, optional = true, default-features = false }
kithara-queue = { workspace = true, optional = true, default-features = false }
kithara-record = { workspace = true, optional = true }
kithara-resampler = { workspace = true, optional = true, default-features = false }
kithara-signal = { workspace = true, optional = true }
kithara-storage = { workspace = true, optional = true }
kithara-stream = { workspace = true, optional = true, default-features = false }
kithara-stretch = { workspace = true, optional = true, default-features = false }
kithara-test-utils = { workspace = true, optional = true }
kithara-ui = { workspace = true, optional = true }
kithara-warp = { workspace = true, optional = true, default-features = false }
kithara-worker = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
