[package]
name = "kithara-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform primitives (sync, time, thread) for native and wasm32."
keywords = ["platform", "wasm", "sync", "audio", "primitives"]
categories = ["wasm", "concurrency"]

[features]
# Virtual monotonic clock for fast, deterministic offline playback tests.
# OFF by default and referenced by no shipping crate, so production builds are
# unchanged. See src/flash/ and the README. Turn on in the test build to
# run warm-cache offline tests at CPU speed (compared against the real-time run
# as ground truth).
flash = []
# Concurrency model backend. Independent from `flash`: the two features form
# the system/loom x real/virtual execution matrix.
loom = ["dep:loom"]
# Async blocking detection (poll context + budgets). OFF by default and
# referenced by no shipping crate; the inert twin keeps prod byte-identical.
no-block = []
signal = ["tokio/signal"]
# Native socket surface for test/server plumbing. Keep this out of the default
# production platform dependency so non-network consumers do not pull tokio net
# or the async IO extension traits.
tokio-net = ["tokio/net", "tokio/io-util"]
# Native child-process plumbing for build-time media preparation.
tokio-process = ["tokio/process"]
tokio-rt-multi-thread = ["tokio/rt-multi-thread"]

[dependencies]
arc-swap = { workspace = true }
delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
futures = { workspace = true }
loom = { workspace = true, optional = true }
portable-atomic = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpu-time = { workspace = true }
parking_lot = { workspace = true }
pin-project-lite = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }
js-sys = { workspace = true }
parking_lot_core = { workspace = true, features = ["nightly"] }
tokio_with_wasm = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm_safe_thread = { workspace = true }
web-sys = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
kithara-platform = { path = ".", default-features = false }
kithara-test-utils = { path = "../kithara-test-utils", features = ["usdt", "mock", "hang", "subscriber"] }

assert_no_alloc = { workspace = true }
# Which sink a census line reaches is only observable through a subscriber; the
# `no_block` tests install one to pin that a configured log is the only sink.
tracing-subscriber = { workspace = true }
wasm-bindgen-test = { workspace = true }

# Native-only: criterion pulls a native-only toolchain, never wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true

# Micro-benchmarks for the propagate-down cancel primitives (`CancelToken` /
# `CancelGroup`). `cargo bench -p kithara-platform`.
[[bench]]
name = "cancel"
harness = false
