[package]
name = "kithara-abr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol-agnostic adaptive bitrate algorithm for audio streaming."
keywords = ["abr", "streaming", "hls", "audio", "bitrate"]
categories = ["multimedia::audio", "network-programming"]

[package.metadata.cargo-machete]
# `serde` is reached only through `#[derive(Patch)]`, whose expansion names
# `::serde::Deserialize`; no source line in this crate spells the crate out.
ignored = ["serde", "unimock"]

[features]
default = ["client-reqwest", "tls-rustls"]
# Enables the crate's USDT probe points.
usdt = ["kithara-test-utils/usdt"]
mock = ["dep:unimock"]
# HTTP backend forwarding (kithara-net reached via kithara-events).
client-reqwest = []
client-wreq = []
tls-rustls = []
tls-native = []

[dependencies]
kithara-derive = { workspace = true }
kithara-events = { workspace = true }
kithara-platform = { workspace = true }
kithara-test-utils = { workspace = true }

bitflags = { workspace = true }
bon = { workspace = true }
dashmap = { workspace = true }
delegate = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
humantime-serde = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unimock = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { path = "../kithara-test-utils", features = ["mock", "hang"] }
proptest = { workspace = true }
serde_yaml_ng = { workspace = true }
unimock = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
