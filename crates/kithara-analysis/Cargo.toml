[package]
name = "kithara-analysis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Progressive waveform and beat-grid analysis for Kithara."
keywords = ["audio", "beatgrid", "dsp", "waveform", "analysis"]
categories = ["multimedia::audio"]

[features]
default = ["symphonia", "client-reqwest", "tls-rustls"]
analysis-beat = []
analysis-waveform = ["dep:realfft"]
beat-nn = ["analysis-beat", "dep:kithara-beat", "kithara-beat/embed-small-model"]
beat-dsp = ["analysis-beat", "dep:kithara-beat", "kithara-beat/dsp"]
mock = ["dep:unimock"]
probe = ["kithara-worker/probe"]
client-reqwest = ["kithara-audio/client-reqwest", "kithara-test-utils/client-reqwest"]
client-wreq = ["kithara-audio/client-wreq", "kithara-test-utils/client-wreq"]
tls-rustls = ["kithara-audio/tls-rustls", "kithara-test-utils/tls-rustls"]
tls-native = ["kithara-audio/tls-native", "kithara-test-utils/tls-native"]
apple = ["kithara-audio/apple"]
android = ["kithara-audio/android"]
symphonia = ["kithara-audio/symphonia"]
webcodecs = ["kithara-audio/webcodecs"]
fdk-aac = ["kithara-audio/fdk-aac"]

[dependencies]
kithara-bufpool = { workspace = true }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }

bon = { workspace = true }
bytes = { workspace = true }
delegate = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-audio = { workspace = true, default-features = false }
kithara-beat = { workspace = true, optional = true }
kithara-resampler = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true }
kithara-worker = { workspace = true }

derive_more = { workspace = true }
realfft = { workspace = true, optional = true }
ringbuf = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
unimock = { workspace = true, optional = true }

[dev-dependencies]
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-decode = { workspace = true, features = ["symphonia"] }
kithara-events = { workspace = true }
kithara-resampler = { workspace = true, features = ["resample-rubato"] }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["hang", "mock", "probe"] }

unimock = { workspace = true }

[lints]
workspace = true
