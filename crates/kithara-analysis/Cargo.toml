[package]
name = "kithara-analysis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Progressive waveform and beat-grid analysis for Kithara."
keywords = ["audio", "beatgrid", "dsp", "waveform", "analysis"]
categories = ["multimedia::audio"]

[features]
default = ["symphonia", "client-reqwest", "tls-rustls"]
analysis-beat = []
analysis-waveform = ["kithara-waveform/dsp"]
beat-backend = ["analysis-beat"]
# `beat-nn` is the neural backend; one of the three below picks the model it
# embeds, and the choice is named in the analysis fingerprint.
beat-nn = ["beat-backend", "kithara-beat/nn"]
beat-nn-small = ["beat-nn", "kithara-beat/embed-small-model"]
beat-nn-full = ["beat-nn", "kithara-beat/embed-full-model"]
beat-nn-full-int8 = ["beat-nn", "kithara-beat/embed-full-int8-model"]
beat-dsp = ["beat-backend", "kithara-beat/dsp"]
mock = ["dep:unimock"]
usdt = ["kithara-worker/usdt"]
client-reqwest = ["kithara-audio/client-reqwest", "kithara-test-utils/client-reqwest"]
client-wreq = ["kithara-audio/client-wreq", "kithara-test-utils/client-wreq"]
tls-rustls = ["kithara-audio/tls-rustls", "kithara-test-utils/tls-rustls"]
tls-native = ["kithara-audio/tls-native", "kithara-test-utils/tls-native"]
apple = ["kithara-audio/apple"]
android = ["kithara-audio/android"]
symphonia = ["kithara-audio/symphonia"]
webcodecs = ["kithara-audio/webcodecs"]
fdk-aac = ["kithara-audio/fdk-aac"]

[dependencies]
kithara-audio = { workspace = true, default-features = false }
kithara-beat = { workspace = true }
kithara-blob = { workspace = true }
kithara-bufpool = { workspace = true }
kithara-derive = { workspace = true, features = ["built-default", "patch"] }
kithara-platform = { workspace = true }
kithara-resampler = { workspace = true, default-features = false }
kithara-signal = { workspace = true }
kithara-test-utils = { workspace = true }
kithara-waveform = { workspace = true }
kithara-worker = { workspace = true }

bitflags = { workspace = true }

bon = { workspace = true }
bytes = { workspace = true }
delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
rangemap = { workspace = true }
ringbuf = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unimock = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-beat = { workspace = true, features = ["mock"] }
kithara-bufpool = { workspace = true }
kithara-decode = { workspace = true, features = [] }
kithara-events = { workspace = true }
kithara-resampler = { workspace = true, features = ["resample-rubato"] }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock", "subscriber"] }

serde_json = { workspace = true }
unimock = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }
serde_yaml_ng = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
kithara-decode = { workspace = true, features = ["symphonia"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
