[package]
name = "kithara-waveform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Waveform model, byte codec, and progressive band analyzer for Kithara."
keywords = ["audio", "waveform", "dsp", "analysis"]
categories = ["multimedia::audio"]
exclude = ["tests/**"]

[features]
default = []
# The FFT band analyzer. The model, its codec and the analysis parameters
# are available without it.
dsp = ["kithara-dsp/spectrum"]

[dependencies]
kithara-blob = { workspace = true }
kithara-bufpool = { workspace = true }
kithara-config = { workspace = true }
kithara-dsp = { workspace = true }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }

delegate = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
rangemap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { features = ["test"], workspace = true }

serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }

criterion = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "analyzer"
harness = false
required-features = ["dsp"]
