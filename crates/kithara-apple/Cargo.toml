[package]
name = "kithara-apple"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Apple platform ABI and safe wrappers shared by Kithara crates."
keywords = ["apple", "audio", "audiotoolbox", "accelerate"]
categories = ["multimedia::audio", "os::macos-apis"]

# The wrappers exist only on Apple targets; the Linux default docs.rs picks
# would render an empty crate.
[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "aarch64-apple-ios"]

[features]
default = []
accelerate = []
audio-toolbox = []
foundation = ["dep:block2", "dep:objc2", "dep:objc2-foundation"]
# How much the graphics device holds. Only `objc2`: the one property this reads
# is answered by a message send, so nothing heavier is needed.
metal = ["dep:objc2"]

[dependencies]
kithara-platform = { workspace = true }

fieldwork = { workspace = true }

thiserror = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true, features = [
    "std",
    "block2",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSOperation",
    "NSPathUtilities",
    "NSObject",
    "NSString",
    "NSArray",
    # `NSArray::iter`. Cargo used to hand this over through cpal, which the
    # audio graph no longer pulls in; the iteration this crate does is its own
    # requirement and says so here.
    "NSEnumerator",
    "NSURL",
    "NSURLAuthenticationChallenge",
    "NSURLCredential",
    "NSURLProtectionSpace",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSValue",
] }

[dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }

[lints]
workspace = true
