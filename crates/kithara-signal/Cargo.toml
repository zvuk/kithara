[package]
name = "kithara-signal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Decoded-audio signal values and sample/time math for Kithara."
keywords = ["audio", "buffer", "frames", "samples", "signal"]
categories = ["multimedia::audio"]

[dependencies]
kithara-blob = { workspace = true }
kithara-bufpool = { workspace = true }
kithara-derive = { workspace = true, features = ["ranged"] }
kithara-dsp = { workspace = true }
kithara-platform = { workspace = true }

delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
rangemap = { workspace = true }
serde = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-bufpool = { workspace = true }
kithara-core-test-fixtures = { workspace = true }
kithara-test-utils = { workspace = true, features = ["usdt", "client-reqwest", "tls-rustls"] }

[lints]
workspace = true
