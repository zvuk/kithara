[package]
name = "kithara-test-fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-time generated audio test assets: content-addressed store and generated accessors."
publish = false

[[bin]]
name = "kithara-fixture-export"
path = "src/bin/export.rs"
test = false

[dependencies]
hex = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `PcmSource` and `EncodedTrack`. The crate refuses to build with no backend,
# and `ffmpeg` is the one the build script already pulls in, so this adds no
# compilation.
kithara-encode = { workspace = true, default-features = false, features = ["client-reqwest", "ffmpeg", "tls-rustls"] }
# `AudioCodec` for the fMP4 sample entries.
kithara-stream = { workspace = true, default-features = false, features = ["client-reqwest", "tls-rustls"] }

kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

delegate = { workspace = true }

[build-dependencies]
kithara-analysis = { workspace = true, default-features = false, features = ["analysis-beat", "analysis-waveform", "beat-nn-small", "client-reqwest", "symphonia", "tls-rustls"] }
kithara-audio = { workspace = true, default-features = false, features = ["client-reqwest", "symphonia", "tls-rustls"] }
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-decode = { workspace = true, default-features = false, features = ["client-reqwest", "symphonia", "tls-rustls"] }
kithara-drm = { workspace = true }
kithara-encode = { workspace = true, features = ["client-reqwest", "fdk-aac", "ffmpeg", "tls-rustls"] }
kithara-events = { workspace = true }
kithara-platform = { workspace = true }
kithara-resampler = { workspace = true, features = ["resample-rubato"] }
kithara-signal = { workspace = true }
kithara-stream = { workspace = true, features = ["client-reqwest", "tls-rustls"] }
kithara-test-macros = { workspace = true }

aes = { workspace = true }

bytes = { workspace = true }
cbc = { workspace = true }
cochlea-render = { workspace = true }
cochlea-score = { workspace = true }
delegate = { workspace = true }
futures-lite = { workspace = true }
hex = { workspace = true }
hls_m3u8 = { workspace = true }
inventory = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
kithara-analysis = { workspace = true, default-features = false, features = ["client-reqwest", "symphonia", "tls-rustls"] }
kithara-drm = { workspace = true }
kithara-platform = { workspace = true }
# The backend features are what lets `cargo test -p kithara-test-fixtures` stand on
# its own: kithara-net, reached through test-utils, refuses to build without one.
kithara-test-utils = { workspace = true, features = ["client-reqwest", "probe", "tls-rustls"] }

hls_m3u8 = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
tempfile = { workspace = true }
tiny_http = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
