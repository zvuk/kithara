[package]
name = "kithara-test-fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-time generated audio test assets: content-addressed store and generated accessors."
publish = false
build = "build/main.rs"

[[bin]]
name = "kithara-fixture-export"
path = "src/bin/export.rs"
test = false
required-features = ["all"]

[features]
# The store, the build script and the generated accessors. A consumer names the
# fixture families it reads; each family turns this on. Enabling it alone
# registers no asset beyond the synthetic PCM every family builds on.
native-fixtures = [
    "dep:kithara-fixture-gen",
    "dep:kithara-platform",
    "dep:kithara-stream",
    "dep:kithara-test-macros",
    "dep:serde_json",
    "kithara-fixture-media/native",
]

# Each family registers the assets `kithara-fixture-gen` declares for it.
encoded = ["kithara-fixture-gen/encoded", "wav"]
hls = ["kithara-fixture-gen/hls", "packaged"]
# The segment inputs and the variant catalog reach consumers through one module;
# the catalog packages its variants from the `packaged` pools.
hls-inputs = ["hls", "kithara-fixture-gen/hls-inputs"]
library = ["kithara-fixture-gen/library", "remote", "rhythm"]
packaged = ["kithara-fixture-gen/packaged", "wav"]
remote = ["hls", "kithara-fixture-gen/remote", "native-fixtures"]
rhythm = ["kithara-fixture-gen/rhythm", "native-fixtures"]
signal = ["kithara-fixture-gen/signal", "native-fixtures"]
wav = ["kithara-fixture-gen/wav", "native-fixtures"]

all = ["encoded", "hls", "hls-inputs", "library", "packaged", "remote", "rhythm", "signal", "wav"]

[dependencies]
kithara-fixture-media = { workspace = true }
kithara-platform = { workspace = true, optional = true }
kithara-test-macros = { features = ["test"], workspace = true, optional = true }

num-traits = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-stream = { workspace = true, features = ["client-reqwest", "tls-rustls"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `AudioCodec` for the fMP4 sample entries.
kithara-stream = { workspace = true, default-features = false, optional = true }

serde_json = { workspace = true, features = ["float_roundtrip"], optional = true }

[build-dependencies]
kithara-effects = { workspace = true }
kithara-fixture-gen = { workspace = true, optional = true }
kithara-fixture-media = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
kithara-analysis = { workspace = true, default-features = false, features = ["client-reqwest", "tls-rustls"] }
kithara-core-test-fixtures = { workspace = true }
kithara-drm = { workspace = true }
kithara-platform = { workspace = true }
# The backend features are what lets `cargo test -p kithara-test-fixtures` stand on
# its own: kithara-net, reached through test-utils, refuses to build without one.
kithara-test-utils = { workspace = true, features = ["test", "usdt", "client-reqwest", "tls-rustls"] }

hls_m3u8 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls"] }
tempfile = { workspace = true }
tiny_http = { workspace = true }
toml = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dev-dependencies]
kithara-analysis = { workspace = true, features = ["symphonia"] }
kithara-decode = { workspace = true, default-features = false, features = ["client-reqwest", "symphonia", "tls-rustls"] }
kithara-resampler = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
kithara-test-utils = { workspace = true, features = ["test", "subscriber"] }
wasm-bindgen-test = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true

[[test]]
name = "rhythm_contract"
required-features = ["rhythm"]

[[test]]
name = "reference_contract"
required-features = ["rhythm", "wav"]

[[test]]
name = "library_contract"
required-features = ["library"]

[[test]]
name = "store_contract"
required-features = ["all"]

[[test]]
name = "hls_contract"
required-features = ["hls"]

[[test]]
name = "signal_contract"
required-features = ["native-fixtures"]
