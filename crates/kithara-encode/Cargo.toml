[package]
name = "kithara-encode"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable and native audio encoding with continuous and finite outputs"
publish = false

[features]
default = ["ffmpeg", "fdk-aac", "client-reqwest", "tls-rustls"]
# In-tree fdk-aac, built from vendored sources: HE-AAC v1/v2 offline and the
# streaming AAC-LC the live broadcast runs on. Carries no system dependency,
# so a distributed binary needs nothing installed on the user's machine.
fdk-aac = ["dep:fdk-aac-sys"]
# FFmpeg: byte encoding, FLAC, and offline AAC-LC fixtures. Android links
# the target libraries statically; other native targets use system FFmpeg.
ffmpeg = ["dep:ffmpeg-next", "dep:tempfile"]
# HTTP backend forwarding. This crate encodes and never speaks HTTP, but it
# takes its media types from kithara-stream, which reaches kithara-net, and
# kithara-net refuses to build without a backend.
client-apple = ["kithara-stream/client-apple"]
client-reqwest = ["kithara-stream/client-reqwest"]
client-wreq = ["kithara-stream/client-wreq"]
tls-native = ["kithara-stream/tls-native"]
tls-rustls = ["kithara-stream/tls-rustls"]

[dependencies]
kithara-bufpool = { workspace = true }
kithara-stream = { workspace = true }

bon = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
ffmpeg-next = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

fdk-aac-sys = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ffmpeg-next = { workspace = true, optional = true, features = ["static"] }

[dev-dependencies]
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["probe"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true
