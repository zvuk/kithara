[package]
name = "kithara-bufpool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sharded buffer pool for zero-allocation audio hot paths."
keywords = ["buffer", "pool", "audio", "performance", "sharded"]
categories = ["memory-management", "concurrency"]

[features]
perf = ["dep:hotpath", "hotpath/hotpath"]
test-utils = []

[dependencies]
kithara-macros = { workspace = true }
kithara-platform = { workspace = true }
kithara-test-macros = { workspace = true }

bon = { workspace = true }
crossbeam-queue = { workspace = true }
delegate = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# hotpath (perf/memprof profiling) does not build on wasm32; keep it off the wasm closure.
hotpath = { workspace = true, optional = true }

[dev-dependencies]
kithara-bufpool = { path = ".", default-features = false, features = ["test-utils"] }
kithara-test-utils = { path = "../kithara-test-utils", features = ["probe", "hang"] }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_yaml_ng = { workspace = true }

[lints]
workspace = true
