[package]
name = "kithara-bufpool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sharded buffer pool for zero-allocation audio hot paths."
keywords = ["buffer", "pool", "audio", "performance", "sharded"]
categories = ["memory-management", "concurrency"]

[features]
perf = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
kithara-config = { workspace = true }
kithara-derive = { workspace = true, features = ["patch", "ranged"] }
kithara-platform = { workspace = true }
kithara-ring = { workspace = true }
kithara-test-macros = { workspace = true }

bon = { workspace = true }
crossbeam-queue = { workspace = true }
delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# hotpath (perf/memprof profiling) does not build on wasm32; keep it off the wasm closure.
hotpath = { workspace = true, optional = true }

[dev-dependencies]
kithara-core-test-fixtures = { workspace = true }
kithara-test-utils = { path = "../kithara-test-utils", features = ["usdt", "hang"] }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_yaml_ng = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true
