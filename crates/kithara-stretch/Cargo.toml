[package]
name = "kithara-stretch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Time-stretch DSP contracts and backend adapters."
keywords = ["audio", "dsp", "time-stretch", "pitch", "playback"]
categories = ["multimedia::audio"]

[package.metadata.cargo-machete]
# `serde` is reached only through `#[derive(Patch)]`, whose expansion names
# `::serde::Deserialize`; no source line in this crate spells the crate out.
ignored = ["hotpath", "serde"]

[features]
default = ["stretch-signalsmith"]
perf = ["dep:hotpath", "hotpath/hotpath"]
stretch-signalsmith = ["dep:signalsmith-stretch"]
stretch-bungee = ["dep:bungee-sys"]

[dependencies]
kithara-macros = { workspace = true }
kithara-signal = { workspace = true }
kithara-test-macros = { workspace = true }

bon = { workspace = true }
delegate = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

# `bungee-sys` builds its C++ through `cmake`, which fails under MSVC (see
# `windows_build_env` in xtask's Windows lane for the toolchain fight this
# crate is not worth having on that target). wasm32 already excludes the
# whole backend set above the same way, because none of these optional deps
# exist for that target either; Windows/MSVC gets the same treatment for
# bungee specifically, so `stretch-signalsmith` keeps working there.
[target.'cfg(all(not(target_arch = "wasm32"), not(all(target_os = "windows", target_env = "msvc"))))'.dependencies]
bungee-sys = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-bufpool = { workspace = true }
kithara-platform = { workspace = true }

# `kithara::measure_block!` resolves `hotpath` in this crate; `hotpath` is native-only.
hotpath = { workspace = true, optional = true }
signalsmith-stretch = { workspace = true, optional = true }

[dev-dependencies]
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-test-utils = { workspace = true, features = ["client-reqwest", "hang", "probe", "tls-rustls"] }

[lints]
workspace = true
