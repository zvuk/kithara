[package]
name = "kithara-ui-input"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Toolkit-neutral pointer, wheel and keyboard input for kithara-ui, and the recognizers that turn it into control gestures."
keywords = ["ui", "input", "gesture", "pointer", "keyboard"]
categories = ["gui"]
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-workspace-hack"]

[features]
# Decoding iced's events into neutral input, and the cursor shape into iced's.
iced = ["dep:iced", "dep:kithara-derive", "iced/advanced", "kithara-ui-draw/iced"]
# Decoding masonry's pointer and text events into neutral input, and back.
masonry = ["dep:masonry", "dep:num-traits"]

[dependencies]
kithara-derive = { workspace = true, optional = true, features = ["mirror"] }
kithara-platform = { workspace = true }
kithara-ui-draw = { workspace = true }

bon = { workspace = true }
fieldwork = { workspace = true }
iced = { workspace = true, optional = true }
masonry = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }

# The same desktop-only gate `kithara-ui` carries.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { workspace = true }

[[test]]
name = "input"
path = "tests/input/main.rs"

[lints]
workspace = true
