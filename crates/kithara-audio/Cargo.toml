[package]
name = "kithara-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Decoded-audio source pipeline: lifecycle, resampling, and readiness."
keywords = ["audio", "dsp", "resampling", "playback", "player"]
categories = ["multimedia::audio"]

[features]
default = ["symphonia", "resample-rubato", "client-reqwest", "tls-rustls"]
probe = []
mock = ["dep:unimock"]
# HTTP backend forwarding to every kithara-net-reaching dep.
client-reqwest = [
    "kithara-stream/client-reqwest",
    "kithara-events/client-reqwest",
    "kithara-abr/client-reqwest",
    "kithara-decode/client-reqwest",
]
client-wreq = [
    "kithara-stream/client-wreq",
    "kithara-events/client-wreq",
    "kithara-abr/client-wreq",
    "kithara-decode/client-wreq",
]
tls-rustls = [
    "kithara-stream/tls-rustls",
    "kithara-events/tls-rustls",
    "kithara-abr/tls-rustls",
    "kithara-decode/tls-rustls",
]
tls-native = [
    "kithara-stream/tls-native",
    "kithara-events/tls-native",
    "kithara-abr/tls-native",
    "kithara-decode/tls-native",
]
# Enable performance monitoring with hotpath-rs (timing only, minimal overhead)
perf = ["dep:hotpath", "hotpath/hotpath"]
# Enable memory profiling for examples (includes allocation tracking, adds overhead)
memprof = ["dep:hotpath", "hotpath/hotpath", "hotpath/hotpath-alloc"]
# Enable Apple AudioToolbox hardware decoder (macOS/iOS).
apple = ["kithara-decode/apple"]
# Enable Apple AudioToolbox fused decode+SRC, used by the Apple device FFI set.
apple-fused-src = ["kithara-decode/apple-codec-embedded-resampler"]
# Enable Android MediaCodec hardware decoder (Android)
android = ["kithara-decode/android", "resample-rubato"]
# Enable the Symphonia software decoder path. Disable to build with
# only the hardware backend (apple or android) and no software fallback.
symphonia = ["kithara-decode/symphonia"]
webcodecs = ["kithara-decode/webcodecs"]
# Enable libfdk-aac for HE-AAC v1/v2 decode. Symphonia's stock AAC
# decoder is LC-only; without this feature, HE-AAC v2 streams fail to
# play through the software fallback.
fdk-aac = ["kithara-decode/fdk-aac"]
resample-glide = ["kithara-decode/resample-glide", "kithara-resampler/resample-glide"]
resample-rubato = ["kithara-resampler/resample-rubato"]
[dependencies]
kithara-abr = { workspace = true, default-features = false }
kithara-bufpool = { workspace = true }
kithara-decode = { workspace = true, default-features = false }
kithara-events = { workspace = true }
kithara-macros = { workspace = true }
kithara-platform = { workspace = true }
kithara-resampler = { workspace = true, default-features = false }
kithara-signal = { workspace = true }
kithara-stream = { workspace = true, default-features = false }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true }

arc-swap = { workspace = true }
bon = { workspace = true }
crossbeam-queue = { workspace = true }
delegate = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
ringbuf = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unimock = { workspace = true, optional = true }
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# hotpath (perf/memprof profiling) does not build on wasm32; keep it off the wasm closure.
hotpath = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "AudioContext",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "MessagePort",
] }

[dev-dependencies]
kithara-audio = { path = ".", default-features = false, features = ["mock", "probe", "symphonia"] }
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-decode = { workspace = true, features = ["mock", "probe", "symphonia"] }
kithara-storage = { workspace = true }
kithara-test-fixtures = { workspace = true }
kithara-test-utils = { path = "../kithara-test-utils", features = ["mock", "probe", "hang"] }

aes = { workspace = true }
assert_no_alloc = { workspace = true }
bytes = { workspace = true }
cbc = { workspace = true }
num-traits = { workspace = true }
serde_yaml_ng = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
unimock = { workspace = true }
url = { workspace = true }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-assets = { workspace = true }
kithara-file = { workspace = true }
kithara-hls = { workspace = true }
kithara-net = { workspace = true, default-features = false, features = [
    "client-reqwest",
    "tls-rustls",
] }

axum = { workspace = true }
hotpath = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
