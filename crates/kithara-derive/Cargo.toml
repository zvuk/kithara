[package]
name = "kithara-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "kithara derive macros for configuration documents, bounded scalars, events, and event sets."
keywords = ["audio", "config", "serde", "macros", "kithara"]
categories = ["config", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[features]
built-default = []
config = ["patch"]
control = []
control-painter = []
default = []
event = []
enum-str = []
mirror = []
patch = []
phase = []
ranged = []
skin-walk = []
variants = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["extra-traits", "visit"] }

[dev-dependencies]
kithara-test-utils = { workspace = true }

humantime-serde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true

[[test]]
name = "ranged"
required-features = ["ranged"]

[[test]]
name = "mirror"
required-features = ["mirror"]

[[test]]
name = "vocabulary"
required-features = ["enum-str", "variants"]

[[test]]
name = "patch"
required-features = ["patch"]
