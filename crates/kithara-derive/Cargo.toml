[package]
name = "kithara-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "kithara derive macros for configuration documents, bounded scalars, events, and event sets."
keywords = ["audio", "config", "serde", "macros", "kithara"]
categories = ["config", "development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["extra-traits"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true
