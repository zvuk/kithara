# The configuration kithara-app ships with. `build.rs` embeds this text
# verbatim; the application parses it at startup, and a `kithara.yaml` beside
# the executable is laid over it without a rebuild. Only what differs from the
# crate's own defaults belongs here.
#
# Secrets MUST NOT be inlined here — use `$KITHARA_...` env references
# instead and put the value in the workspace `.env` (gitignored) or
# the build shell. A reference resolves from the process environment first and
# from the table `build.rs` baked behind it second; a reference that resolves
# nowhere stops startup rather than degrading silently.
#
# `build.rs` wraps every value read from an env reference with
# `obfstr!()` so it does not appear as a plain run of bytes in
# `strings` output.

hls:
  size_probe_method: range_get

net:
  compression: [gzip, deflate]
  is_insecure: true

# `kithara-play`'s own crate default is 1.0; this app has shipped with a
# longer 5-second crossfade since before this section existed, so it is
# named explicitly here to keep that behavior.
player:
  crossfade_duration: 5.0

# Remote media identity used by the shared AssetStore. Rules are ordered and
# use exact hosts, `*.domain` subdomains, or `*`. Only listed query parameters
# affect cache identity; signed URL parameters and expiry timestamps remain
# transport details.
assets:
  cache_identity:
    - domains: [cdn-edge.zvq.me]
      query_parameters: [id]

playlist:
  tracks:
    - https://stream.silvercomet.top/track.mp3
    - https://stream.silvercomet.top/hls/master.m3u8
    - https://stream.silvercomet.top/drm/master.m3u8
    - https://stream.silvercomet.top/tones/master.m3u8
    - https://cdn-edge.zvq.me/track/streamhq?id=27390231
    - https://cdn-edge.zvq.me/track/streamhq?id=151585912
    - https://cdn-edge.zvq.me/track/streamhq?id=125475417
    - https://cdn-edge.zvq.me/track/streamhq?id=138535169
    - https://cdn-edge.zvq.me/track/streamhq?id=130432502
    - https://cdn-edge.zvq.me/track/streamhq?id=132017169
    - https://cdn-hls-slicer.zvuk.com/drm/track/173388194_1/master.m3u8
    - https://cdn-hls-slicer.zvuk.com/drm/track/180082552_1/master.m3u8
    - https://cdn-hls-slicer.zvuk.com/drm/track/5807750_3/master.m3u8
    - https://cdn-hls-slicer.zvuk.com/drm/track/50984034_1/master.m3u8
    - https://cdn-hls-slicer.zvuk.com/drm/track/79829257_2/master.m3u8
    - https://cdn-hls-slicer.zvuk.com/drm/track/171515249_1/master.m3u8
    - https://cdn-hls-slicer.zvuk.com/drm/track/59232754_2/master.m3u8

# DRM key-server providers. The play-level domain policy treats a bare host as
# an exact match and `*.host` as a subdomain wildcard. List both forms when the
# key URL lives on a bare host but media is served from subdomains (e.g.
# `zvuk.com/keyserver/...` plus `cdn-hls-slicer.zvuk.com/...`).
#
# Each provider declares one `cipher_key`, whose value may be a
# `$KITHARA_...` env reference or an inline non-secret literal.
# Everything else goes through `headers` — values starting with `$`
# are env references (obfuscated like `cipher_key`); literal values
# pass through unchanged. `X-Encrypted-Key` is reserved (generated
# per request from the cipher_key).
drm:
  providers:
    - name: zvuk-prod
      domains: [zvuk.com, "*.zvuk.com"]
      cipher_key: $KITHARA_DRM_PROD_KEY
      # iOS `HLSAes128Service.AES128ResourceLoader` ships
      # `randomString(of: 8)` — 8-char lowercase hex. The zvuk.com WAF
      # validates alphabet + length; deviation triggers HTTP 418.
      seed:
        length: 8
        alphabet: hex
      headers:
        User-Agent: OpenPlay - com.zvooq.openplay/4.30.0 (iPhone; iOS 17.5; Scale/3.00)
        X-Auth-Token: $KITHARA_DRM_PROD_AUTH_TOKEN
        X-SP-ZV: $KITHARA_DRM_PROD_SP_ZV_TOKEN
    - name: zvuk-stage
      domains: [zvq.me, "*.zvq.me"]
      cipher_key: $KITHARA_DRM_STAGE_KEY
      # zvq.me staging keyserver is captured against a 16-char
      # alphanumeric salt (legacy zvqengine format, `aaaaaaaaaaaaaaaa`
      # in `tests/tests/kithara_queue/zvuk_cipher_check.rs`). Using the
      # 8-char hex prod format here silently corrupts decrypt output.
      seed:
        length: 16
        alphabet: alphanumeric
      headers:
        User-Agent: OpenPlay - com.zvooq.openplay/4.30.0 (iPhone; iOS 17.5; Scale/3.00)
        X-Auth-Token: $KITHARA_DRM_STAGE_AUTH_TOKEN
