[package]
name = "kithara-app"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kithara"
path = "src/main.rs"

[features]
default = ["gui", "analysis-waveform", "beat-nn-small", "stretch-signalsmith"]
# HTTP backend forwarding to every kithara-net-reaching production dep
# (kithara facade + kithara-queue). NOT in `default`: the backend is selected
# per target (macOS desktop pulls `apple` + `client-wreq`; other desktops
# pull client-reqwest via the non-Apple target block below), so exactly one
# HTTP stack lands in each build. The dev-only kithara-net mirrors the same
# per-target split (see the target `dev-dependencies` below) so test builds
# stay single-stack too.
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
# Put the session mix on air over live HLS. Off by default; with it off the
# bar's phase machine compiles against a packager that has no stream values.
broadcast = ["kithara/broadcast"]
gui = ["dep:iced", "kithara/ui-iced"]
# Draw the studio through the retained host (masonry + Vello) instead of the
# immediate one. Both hosts read the same documents and the same state; only
# the window and the paint pass differ.
masonry = ["gui", "kithara/ui-masonry"]
# NN beat/downbeat detection.
beat-nn-small = ["kithara/beat-nn-small"]
beat-nn-full = ["kithara/beat-nn-full"]
beat-nn-full-int8 = ["kithara/beat-nn-full-int8"]
# Signal-processing beat detection, for builds that cannot carry the model.
beat-dsp = ["kithara/beat-dsp"]
# Waveform analysis for the deck overview.
analysis-waveform = ["kithara/analysis-waveform"]
# Build kithara-app as a plain library — exposes `config`/`sources`/`drm`
# modules without pulling in iced. Used by integration tests
# (`tests/tests/kithara_queue/real_playlist.rs`).
lib-only = []
# Enable app and facade USDT probes together.
probe = ["kithara/probe"]
# Production Apple decode shape: embedded AudioConverter SRC inside the Apple
# codec. Opt-in so the default desktop build keeps the Rubato adapter path.
apple-fused-src = ["kithara/apple-fused-src"]
# Native-only C++ time-stretch backends. Signalsmith is the default; bungee
# stays opt-in (need a C++ toolchain).
stretch-signalsmith = ["kithara/stretch-signalsmith"]
stretch-bungee = ["kithara/stretch-bungee"]
# Enable both stretch libraries in the DJ deck's selector.
stretch-all = ["stretch-signalsmith", "stretch-bungee"]

[dependencies]
kithara = { workspace = true, default-features = false, features = ["analysis", "file", "hls", "queue", "resample-rubato", "worker"] }
kithara-assets = { workspace = true }
kithara-record = { workspace = true }
kithara-test-utils = { workspace = true }

delegate = { workspace = true }

fieldwork = { workspace = true }

# Desktop binary deps. Gated off iOS as well as wasm: kithara-app is a
# desktop-only binary (GUI, no iOS audio backend), so none of these —
# notably tracing-subscriber/env-filter, which drags in regex — should resolve
# for the iOS framework closure. Keeping them off iOS lets the workspace-hack
# leave env-filter (and regex/regex-automata/aho-corasick) out of the iOS build.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
kithara = { workspace = true, default-features = false, features = ["signal"] }
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

bon = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
crabtime = { workspace = true }
derive_more = { workspace = true }
iced = { workspace = true, optional = true }
num-traits = { workspace = true }
obfstr = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

# Desktop (non-Apple, non-Android, native) — fall back to symphonia
# software decoding. workspace.dependencies now disables kithara's
# defaults at the workspace level, so without this target.cfg
# `cargo build` on Linux/Windows would leave the binary with no audio
# backend at all.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
kithara = { workspace = true, default-features = false, features = ["symphonia", "client-reqwest", "tls-rustls"] }

# HE-AAC v1/v2 through libfdk. Its vendored `FDK_archdef.h` has no branch for
# MSVC on ARM64 and stops at `fatal error C1021: invalid preprocessor command`,
# so that one target decodes AAC through symphonia alone.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android"), not(all(target_os = "windows", target_arch = "aarch64"))))'.dependencies]
kithara = { workspace = true, default-features = false, features = ["fdk-aac"] }

[target.'cfg(target_os = "macos")'.dependencies]
kithara = { workspace = true, default-features = false, features = ["apple", "client-wreq"] }

[build-dependencies]
serde = { workspace = true }
serde_yaml_ng = { workspace = true }

[dev-dependencies]
kithara = { workspace = true, default-features = false, features = ["probe", "ui-capture"] }
kithara-encode = { workspace = true, default-features = false }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["mock", "probe", "hang"] }

futures = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dev-dependencies]
kithara = { workspace = true, default-features = false, features = ["client-reqwest", "net", "tls-rustls"] }

# Dev-only kithara-net mirrors the per-target production backend so test
# builds stay single-stack: macOS tests run wreq (matching the `apple`
# production path), every other desktop runs client-reqwest. Without this
# split a fixed client-reqwest dev-dep would unify with the macOS wreq
# production path and compile both stacks into the test binary.
[target.'cfg(target_os = "macos")'.dev-dependencies]
kithara = { workspace = true, default-features = false, features = ["client-wreq", "net"] }

[lints]
workspace = true
