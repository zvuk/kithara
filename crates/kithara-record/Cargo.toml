[package]
name = "kithara-record"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Storage-neutral master recording for Kithara."
keywords = ["audio", "recording", "encoding"]
categories = ["multimedia::audio"]

[features]
default = ["client-reqwest", "tls-rustls"]
assets = ["dep:kithara-assets", "dep:tracing"]
client-apple = ["kithara-encode/client-apple"]
client-reqwest = ["kithara-encode/client-reqwest"]
client-wreq = ["kithara-encode/client-wreq"]
tls-native = ["kithara-encode/tls-native"]
tls-rustls = ["kithara-encode/tls-rustls"]

[dependencies]
kithara-assets = { workspace = true, optional = true }
kithara-bufpool = { workspace = true }
kithara-config = { workspace = true }
kithara-encode = { workspace = true, default-features = false }
kithara-output = { workspace = true }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }
kithara-worker = { workspace = true }

ringbuf = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-bufpool = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["test", "usdt", "client-reqwest", "tls-rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true
