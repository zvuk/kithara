[package]
name = "kithara-blob"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned little-endian byte framing for stored Kithara artifacts."
keywords = ["codec", "serialization", "bytes", "blob"]
categories = ["encoding"]

[dependencies]
kithara-bufpool = { workspace = true }

delegate = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { features = ["test"], workspace = true }

[lints]
workspace = true
