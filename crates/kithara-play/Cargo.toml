[package]
name = "kithara-play"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Player engine: audio graph, EQ, crossfade, DJ-ready."
keywords = ["audio", "player", "dj", "crossfade", "playback"]
categories = ["multimedia::audio"]

[package.metadata.cargo-machete]
ignored = ["unimock"]

[features]
default = ["symphonia", "resample-rubato", "stretch-signalsmith", "client-reqwest", "tls-rustls"]
# HTTP backend forwarding to every kithara-net-reaching dep.
client-reqwest = [
    "kithara-net/client-reqwest",
    "kithara-stream/client-reqwest",
    "kithara-file/client-reqwest",
    "kithara-hls/client-reqwest",
    "kithara-audio/client-reqwest",
    "kithara-decode/client-reqwest",
    "kithara-events/client-reqwest",
    "kithara-abr/client-reqwest",
]
client-wreq = [
    "kithara-net/client-wreq",
    "kithara-stream/client-wreq",
    "kithara-file/client-wreq",
    "kithara-hls/client-wreq",
    "kithara-audio/client-wreq",
    "kithara-decode/client-wreq",
    "kithara-events/client-wreq",
    "kithara-abr/client-wreq",
]
tls-rustls = [
    "kithara-net/tls-rustls",
    "kithara-stream/tls-rustls",
    "kithara-file/tls-rustls",
    "kithara-hls/tls-rustls",
    "kithara-audio/tls-rustls",
    "kithara-decode/tls-rustls",
    "kithara-events/tls-rustls",
    "kithara-abr/tls-rustls",
]
tls-native = [
    "kithara-net/tls-native",
    "kithara-stream/tls-native",
    "kithara-file/tls-native",
    "kithara-hls/tls-native",
    "kithara-audio/tls-native",
    "kithara-decode/tls-native",
    "kithara-events/tls-native",
    "kithara-abr/tls-native",
]
apple = ["kithara-audio/apple", "kithara-decode/apple"]
apple-fused-src = ["kithara-audio/apple-fused-src", "kithara-decode/apple"]
# Software decoder pass-through. Required when not opting into a hardware
# backend, since `kithara-decode`'s `DecoderBackend` enum needs at least
# one variant available. WASM has no hardware decoder (apple/android are
# native-only).
symphonia = ["kithara-audio/symphonia", "kithara-decode/symphonia"]
webcodecs = ["kithara-audio/webcodecs", "kithara-decode/webcodecs"]
fdk-aac = ["kithara-audio/fdk-aac", "kithara-decode/fdk-aac"]
resample-glide = ["kithara-audio/resample-glide", "kithara-decode/resample-glide"]
resample-rubato = ["kithara-audio/resample-rubato", "kithara-decode/resample-rubato"]
stretch-signalsmith = ["kithara-warp/stretch-signalsmith"]
stretch-bungee = ["kithara-warp/stretch-bungee"]
# Re-export of testing helpers (engine module + macro mocks).
# Offline backend lives in `kithara-integration-tests::offline` since 2026-05-07.
probe = ["kithara-warp/probe", "kithara-worker/probe"]
perf = [
    "dep:hotpath",
    "hotpath/hotpath",
    "kithara-audio/perf",
    "kithara-decode/perf",
    "kithara-warp/perf",
    "kithara-worker/perf",
]
mock = ["dep:unimock"]

[dependencies]
kithara-abr = { workspace = true, default-features = false }
kithara-assets = { workspace = true }
# Kithara sub-crates
kithara-audio = { workspace = true, default-features = false }
kithara-bufpool = { workspace = true }
kithara-decode = { workspace = true, default-features = false }
kithara-drm = { workspace = true }
kithara-events = { workspace = true }
kithara-file = { workspace = true, default-features = false }
kithara-hls = { workspace = true, default-features = false }
kithara-net = { workspace = true, default-features = false }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }
kithara-stream = { workspace = true, default-features = false }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true }
kithara-warp = { workspace = true, default-features = false, features = ["render"] }
kithara-worker = { workspace = true }

# Utilities
arc-swap = { workspace = true }
biquad = { workspace = true }
bon = { workspace = true }
delegate = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }

# Audio engine
firewheel = { workspace = true }
firewheel-core = { workspace = true }
hex = { workspace = true }
hotpath = { workspace = true, optional = true }
num-traits = { workspace = true }
portable-atomic = { workspace = true }

# Async & channels
ringbuf = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

unimock = { workspace = true, optional = true }
url = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# hotpath profiling does not build on wasm32; keep it off the wasm closure.
hotpath = { workspace = true, optional = true }

[dev-dependencies]
kithara-audio = { workspace = true, features = ["mock", "probe"] }
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-play = { path = ".", default-features = false, features = ["probe"] }
kithara-test-utils = { path = "../kithara-test-utils", features = ["mock", "probe", "hang"] }

bytes = { workspace = true }
unimock = { workspace = true }

[lints]
workspace = true
