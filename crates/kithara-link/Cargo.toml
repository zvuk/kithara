[package]
name = "kithara-link"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-tempo synchronization decorators for tracks and decks."
keywords = ["audio", "player", "tempo", "sync", "dj"]
categories = ["multimedia::audio"]

[features]
default = [
    "backend-cpal",
    "symphonia",
    "resample-rubato",
    "stretch-signalsmith",
    "client-reqwest",
    "tls-rustls",
]
backend-cpal = ["kithara-host/backend-cpal"]
client-reqwest = ["kithara-host/client-reqwest", "kithara-queue/client-reqwest", "kithara-render/client-reqwest"]
client-wreq = ["kithara-host/client-wreq", "kithara-queue/client-wreq", "kithara-render/client-wreq"]
tls-rustls = ["kithara-host/tls-rustls", "kithara-queue/tls-rustls", "kithara-render/tls-rustls"]
tls-native = ["kithara-host/tls-native", "kithara-queue/tls-native", "kithara-render/tls-native"]
apple = ["kithara-host/apple", "kithara-queue/apple"]
apple-fused-src = ["kithara-host/apple-fused-src", "kithara-queue/apple-fused-src"]
symphonia = ["kithara-host/symphonia", "kithara-queue/symphonia", "kithara-render/symphonia"]
webcodecs = ["kithara-host/webcodecs", "kithara-queue/webcodecs"]
fdk-aac = ["kithara-host/fdk-aac", "kithara-queue/fdk-aac"]
resample-glide = ["kithara-host/resample-glide"]
resample-rubato = ["kithara-host/resample-rubato"]
stretch-signalsmith = [
    "kithara-host/stretch-signalsmith",
    "kithara-queue/stretch-signalsmith",
    "kithara-render/stretch-signalsmith",
]
stretch-bungee = ["kithara-host/stretch-bungee", "kithara-queue/stretch-bungee", "kithara-render/stretch-bungee"]
stretch-glide = ["kithara-host/stretch-glide", "kithara-queue/stretch-glide", "kithara-render/stretch-glide"]
stretch-identity = [
    "kithara-host/stretch-identity",
    "kithara-queue/stretch-identity",
    "kithara-render/stretch-identity",
]
flash = ["kithara-host/flash", "kithara-render/flash"]
no-block = ["kithara-host/no-block", "kithara-render/no-block"]
usdt = ["kithara-host/usdt", "kithara-queue/usdt", "kithara-render/usdt"]

[dependencies]
kithara-beat = { workspace = true }
kithara-bufpool = { workspace = true }
kithara-command = { workspace = true }
kithara-config = { workspace = true }
kithara-events = { workspace = true }
kithara-host = { workspace = true, default-features = false }
kithara-play = { workspace = true, default-features = false }
kithara-queue = { workspace = true, default-features = false }
kithara-render = { workspace = true }
kithara-signal = { workspace = true }
kithara-sync = { workspace = true }

delegate = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-assets = { workspace = true }
kithara-audio = { workspace = true }
kithara-decode = { workspace = true, default-features = false }
kithara-play = { workspace = true, features = ["mock", "symphonia", "stretch-identity"] }
kithara-test-utils = { workspace = true, features = ["temp-dir"] }
kithara-warp = { workspace = true }

futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }

[lints]
workspace = true
