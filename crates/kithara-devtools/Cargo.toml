[package]
name = "kithara-devtools"
version = "0.0.1-alpha5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Reusable, config-driven xtask command core (lint, format, test, health and friends)"
repository = "https://github.com/zvuk/kithara"

[features]
default = ["lint", "viz"]
# Enables the arch/style/idioms lint command family.
lint = []
# Enables architecture visualization commands.
viz = []

[dependencies]
kithara-config = { workspace = true }
kithara-devtools-trace-format = { workspace = true }

anyhow = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
fs4 = { workspace = true }
glob = { workspace = true }
hex = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
roxmltree = { workspace = true }
same-file = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "visit"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
