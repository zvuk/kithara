[package]
name = "kithara-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain-free prioritized worker dispatch for Kithara."
keywords = ["concurrency", "scheduler", "worker"]
categories = ["concurrency"]

[package.metadata.cargo-machete]
ignored = ["hotpath"]

[features]
mock = []
perf = ["dep:hotpath", "hotpath/hotpath"]
usdt = ["kithara-test-utils/usdt"]

[dependencies]
kithara-config = { workspace = true }
kithara-derive = { workspace = true, features = ["patch"] }
kithara-platform = { workspace = true }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["client-reqwest", "tls-rustls"] }

delegate = { workspace = true }
fieldwork = { workspace = true }
hotpath = { workspace = true, optional = true }

humantime-serde = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
kithara-test-utils = { workspace = true, features = ["usdt", "client-reqwest", "hang", "tls-rustls", "subscriber"] }
kithara-worker = { path = ".", default-features = false, features = ["usdt"] }

tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }
serde_yaml_ng = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "dispatcher"
harness = false
