[package]
name = "kithara-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Domain-free prioritized worker dispatch for Kithara."
keywords = ["concurrency", "scheduler", "worker"]
categories = ["concurrency"]

[package.metadata.cargo-machete]
ignored = ["hotpath"]

[features]
perf = ["dep:hotpath", "hotpath/hotpath"]
probe = ["dep:tracing", "kithara-test-utils/probe"]

[dependencies]
kithara-macros = { workspace = true }
kithara-platform = { workspace = true }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["client-reqwest", "tls-rustls"] }

bon = { workspace = true }
delegate = { workspace = true }
fieldwork = { workspace = true }
hotpath = { workspace = true, optional = true }

humantime-serde = { workspace = true }
serde = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
kithara-test-utils = { workspace = true, features = ["client-reqwest", "hang", "probe", "tls-rustls"] }

criterion = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_yaml_ng = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "dispatcher"
harness = false
