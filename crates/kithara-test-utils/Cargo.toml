[package]
name = "kithara-test-utils"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "kithara test runtime: probe/hang/mock helpers (no-op in release)."
keywords = ["audio", "testing", "kithara", "usdt"]
categories = ["development-tools::testing"]

[features]
default = ["hang"]
flash = ["kithara-platform/flash"]
hang = ["dep:serde", "dep:serde_json"]
mock = ["dep:unimock"]
no-block = ["kithara-platform/no-block"]
usdt = ["dep:usdt"]
# HTTP backend forwarding.
client-reqwest = []
client-wreq = []
tls-rustls = []
tls-native = []

[dependencies]
kithara-platform = { workspace = true }
kithara-test-macros = { workspace = true }

fieldwork = { workspace = true }

num-traits = { workspace = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unimock = { workspace = true, optional = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serial_test = { workspace = true }

[target.'cfg(rtsan)'.dependencies]
pin-project-lite = { workspace = true }

[target.'cfg(rtsan_standalone)'.dependencies]
rtsan-standalone = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
usdt = { workspace = true, optional = true }

[dev-dependencies]
kithara-test-utils = { path = ".", default-features = false }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
