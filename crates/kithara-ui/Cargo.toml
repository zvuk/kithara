[package]
name = "kithara-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Serializable modular UI model: layout and module documents, registries, compiler."
keywords = ["ui", "layout", "modular", "serde", "ron"]
categories = ["gui", "config"]

[package.metadata.cargo-machete]
ignored = ["kithara-workspace-hack"]

[features]
default = ["iced"]
# Tests that need a graphics device. Off by default: a machine without one
# would fail them for having no hardware rather than for a defect.
gpu = ["iced", "dep:pollster"]
# Photographing a page with no window, and comparing two sets of photographs.
# A debug harness rather than something a shipped build carries, so it is off
# by default and lives behind this flag.
capture = [
    "iced",
    "dep:futures-lite",
    "dep:iced_renderer",
    "dep:iced_runtime",
    "dep:iced_wgpu",
    "dep:kithara-ui-capture",
]
masonry = ["dep:futures-lite", "dep:masonry", "dep:winit", "kithara-ui-input/masonry", "vello"]
perf = ["dep:hotpath", "hotpath/hotpath"]
usdt = ["dep:kithara-test-utils", "kithara-test-utils/usdt"]
# Hand the no-block gate the platform layer the toolkit draws through, so a
# lane that runs this package under the gate detects a blocking call made
# from a paint pass.
no-block = ["kithara-platform/no-block"]
# Everything that draws. Artwork reading is part of it rather than an opt-in:
# which controls a document may name is a contract of the toolkit, not of the
# host's feature set, so a build that draws at all draws every control.
render = [
    "dep:kithara-ui-input",
    "dep:kithara-ui-lottie",
    "dep:lucide-icons",
    "dep:naga",
    "dep:num-traits",
    "dep:png",
    "dep:skrifa",
    "dep:tracing",
    "dep:unicode-segmentation",
    "kithara-ui-draw/list",
    "kithara-ui-shaping/shape",
]
iced = ["render", "dep:iced", "iced/advanced", "kithara-ui-draw/iced", "kithara-ui-input/iced"]
vello = ["render", "dep:lucide-icons", "dep:num-traits", "dep:tracing", "dep:vello"]

[dependencies]
kithara-derive = { workspace = true, features = ["built-default", "control", "control-painter", "enum-str", "mirror", "node-control", "patch", "ranged", "retained", "skin-walk", "variants", "view-control"] }
kithara-platform = { workspace = true }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, optional = true }
kithara-ui-capture = { workspace = true, optional = true }
kithara-ui-draw = { workspace = true }
kithara-ui-input = { workspace = true, optional = true }
kithara-ui-lottie = { workspace = true, optional = true }
kithara-ui-shaping = { workspace = true }

bon = { workspace = true }
delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
futures-lite = { workspace = true, optional = true }
iced = { workspace = true, optional = true }
iced_renderer = { workspace = true, optional = true }
iced_runtime = { workspace = true, optional = true }
iced_wgpu = { workspace = true, optional = true }
kurbo = { workspace = true }
lucide-icons = { workspace = true, optional = true }
masonry = { workspace = true, optional = true }
naga = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
png = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
ron = { workspace = true }
serde = { workspace = true }
skrifa = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

# The workspace hack is a desktop build cache: kithara-ui stays out of the hakari
# traversal, and its iOS, Android and wasm builds do not pull the feature union.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

# The graphics device answers how much it holds. The platform call that asks it
# belongs to `kithara-apple`, which owns every Apple ABI this workspace uses.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara-apple = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# hotpath (perf/memprof profiling) does not build on wasm32; keep it off the wasm closure.
hotpath = { workspace = true, optional = true }
iced = { workspace = true, optional = true, features = ["tiny-skia"] }

[dev-dependencies]
kithara-platform = { path = "../kithara-platform" }
kithara-test-utils = { path = "../kithara-test-utils", features = [
    "usdt",
    "client-reqwest",
    "tls-rustls",
] }
kithara-ui = { path = ".", default-features = false, features = ["usdt"] }

bitflags = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
futures-lite = { workspace = true }
iced_renderer = { workspace = true }
iced_runtime = { workspace = true }
iced_tiny_skia = { workspace = true }
iced_wgpu = { workspace = true }
png = { workspace = true }
ron = { workspace = true }
serde_yaml_ng = { workspace = true }
# The emitter is measured against the renderer it was written from.
velato = { workspace = true }
# The budget guard reads the renderer's bump allocators back, which vello only
# does when this is on. A dev-dependency so a shipped build keeps the fast path
# rather than a readback on every frame.
vello = { workspace = true, features = ["debug_layers"] }

[lints]
workspace = true

[[example]]
name = "gallery"
# The gallery photographs its own pages and compares two hosts, which is what
# `capture` carries. A build without it has no gallery rather than a gallery
# that cannot answer the question it exists for.
required-features = ["capture"]
# The gallery is the program; what checks it is `tests/gallery/main.rs`, which takes
# these same modules by path. Building the example as a test target too would
# run every one of those checks twice.
test = false

[[example]]
name = "masonry_host"
required-features = ["masonry"]
test = true

# Its own binary: the graphics device counts bytes for the whole process, so a
# reading taken beside another drawing test would measure that test too.
[[test]]
name = "ui_memory"
path = "tests/ui_memory/main.rs"
required-features = ["capture"]

# Its own binary for the same reason `ui_memory` is: it draws, and a drawing
# test beside that one is counted into its readings.
[[test]]
name = "ui_buffers"
path = "tests/ui_buffers/main.rs"
required-features = ["capture", "masonry"]

[[test]]
name = "frame_perf"
path = "perf/frame/main.rs"
required-features = ["perf", "iced", "masonry"]

[[test]]
name = "page_perf"
path = "perf/page/main.rs"
required-features = ["perf", "iced", "masonry"]

[[bench]]
name = "ui"
harness = false
required-features = ["iced"]
