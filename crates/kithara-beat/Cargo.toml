[package]
name = "kithara-beat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Beat / downbeat detection: pure-Rust NN inference (beat_this port on rten)."
keywords = ["audio", "beat", "tempo", "bpm", "dsp"]
categories = ["multimedia::audio"]
exclude = ["tests/**"]

[package.metadata.cargo-machete]
# `unimock` is reached only through `kithara_test_macros::mock`, whose
# expansion names it; no source line in this crate spells the crate out.
ignored = ["kithara-workspace-hack", "unimock"]

[features]
default = []
nn = ["dep:rten", "dep:rten-tensor"]
cuda = ["nn", "dep:ort", "dep:kithara-platform"]
dsp = ["dep:kithara-dsp", "kithara-dsp/spectrum"]
embed-model = []
embed-small-model = ["nn", "embed-model"]
embed-full-model = ["nn", "embed-model"]
embed-full-int8-model = ["nn", "embed-model"]
mock = ["dep:unimock"]

[dependencies]
kithara-bufpool = { workspace = true }
kithara-config = { workspace = true }
kithara-derive = { workspace = true, features = ["patch"] }
kithara-dsp = { workspace = true, optional = true }
kithara-platform = { workspace = true, optional = true }
kithara-sync = { workspace = true }
kithara-test-macros = { workspace = true }

bon = { workspace = true }

num-traits = { workspace = true }
ort = { workspace = true, optional = true }
rten = { workspace = true, optional = true }
rten-tensor = { workspace = true, optional = true }
serde = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
unimock = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[build-dependencies]
fs4 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
kithara-bufpool = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["temp-dir"] }

serde_json = { workspace = true }
unimock = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }

criterion = { workspace = true }
serde_yaml_ng = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
kithara-test-dylib = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "spectral"
harness = false
required-features = ["dsp"]
