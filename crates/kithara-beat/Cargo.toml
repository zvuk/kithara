[package]
name = "kithara-beat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Beat / downbeat detection: pure-Rust NN inference (beat_this port on rten)."
keywords = ["audio", "beat", "tempo", "bpm", "dsp"]
categories = ["multimedia::audio"]
exclude = ["tests/**"]

[package.metadata.cargo-machete]
ignored = ["kithara-workspace-hack"]

[features]
default = []
embed-small-model = []

[dependencies]
kithara-bufpool = { workspace = true }
kithara-macros = { workspace = true }
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

bon = { workspace = true }
num-traits = { workspace = true }
rten = { workspace = true }
rten-tensor = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-test-utils = { workspace = true }

serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_yaml_ng = { workspace = true }

[lints]
workspace = true
