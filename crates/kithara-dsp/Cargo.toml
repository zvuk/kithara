[package]
name = "kithara-dsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Vector DSP kernels over planar f32 slices: Accelerate on Apple, fearless_simd elsewhere."
keywords = ["audio", "dsp", "simd", "accelerate"]
categories = ["multimedia::audio"]

[features]
# The real FFT and autocorrelation of `spectrum`, their planes drawn from the
# caller's `kithara-bufpool` region. `FftLen` and `SpectrumError` are
# available without it.
spectrum = ["dep:fieldwork", "dep:kithara-bufpool", "dep:realfft", "dep:rustfft"]

[dependencies]
kithara-bufpool = { workspace = true, optional = true }

biquad = { workspace = true }
fearless_simd = { workspace = true }
fieldwork = { workspace = true, optional = true }
firewheel-core = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara-apple = { workspace = true, features = ["accelerate"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
realfft = { workspace = true, optional = true }
rustfft = { workspace = true, optional = true }

[dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["subscriber"] }

fast-interleave = { workspace = true }

fearless_simd = { workspace = true, features = ["force_support_fallback"] }
realfft = { workspace = true }
rustfft = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_no_alloc = { workspace = true }
criterion = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "kernels"
harness = false
required-features = ["spectrum"]

[[bench]]
name = "vector_fade"
harness = false
