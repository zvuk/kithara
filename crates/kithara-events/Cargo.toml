[package]
name = "kithara-events"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hierarchical event bus for the audio pipeline."
keywords = ["events", "audio", "observer", "pubsub"]
categories = ["asynchronous"]

[dependencies]
kithara-derive = { workspace = true }
kithara-platform = { workspace = true }

crossbeam-queue = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
portable-atomic = { workspace = true }
smallvec = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { path = "../kithara-test-utils", features = ["mock", "hang"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
