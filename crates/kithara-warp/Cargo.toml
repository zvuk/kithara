[package]
name = "kithara-warp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Beat-map alignment and synchronization contracts for Kithara."
keywords = ["audio", "beatgrid", "dj", "playback", "synchronization"]
categories = ["multimedia::audio"]

[features]
default = []
render = ["dep:kithara-bufpool"]
perf = ["dep:hotpath", "hotpath/hotpath", "kithara-stretch?/perf"]
probe = ["dep:kithara-test-utils"]
stretch-signalsmith = ["dep:firewheel-core", "dep:kithara-stretch", "kithara-stretch/stretch-signalsmith", "render"]
stretch-bungee = ["dep:firewheel-core", "dep:kithara-stretch", "kithara-stretch/stretch-bungee", "render"]

[dependencies]
kithara-bufpool = { workspace = true, optional = true }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["client-reqwest", "probe", "tls-rustls"], optional = true }

arc-swap = { workspace = true }
bon = { workspace = true }
delegate = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
firewheel-core = { workspace = true, optional = true }
hotpath = { workspace = true, optional = true }
num-traits = { workspace = true }
portable-atomic = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-stretch = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
kithara-bufpool = { workspace = true, features = ["test-utils"] }
kithara-test-utils = { workspace = true, features = ["client-reqwest", "probe", "tls-rustls"] }

realfft = { workspace = true }

[lints]
workspace = true
