[package]
name = "kithara-warp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Beat-map geometry, alignment, and warp rendering for Kithara."
keywords = ["audio", "beatgrid", "dj", "playback", "warp"]
categories = ["multimedia::audio"]

[package.metadata.cargo-machete]
# `serde` is reached only through `#[derive(Patch)]`, whose expansion names
# `::serde::Deserialize`; no source line in this crate spells the crate out.
ignored = ["serde"]

[features]
default = []
# Beat-grid and warp-plan fixtures for tests outside this crate.
mock = []
perf = ["kithara-stretch/perf"]
usdt = ["dep:kithara-test-utils", "kithara-test-utils/usdt"]
render = ["dep:kithara-bufpool", "dep:kithara-dsp"]
stretch-signalsmith = ["kithara-stretch/stretch-signalsmith", "render"]
stretch-bungee = ["kithara-stretch/stretch-bungee", "render"]
stretch-glide = ["kithara-stretch/stretch-glide", "render"]
stretch-identity = ["kithara-stretch/stretch-identity", "render"]

[dependencies]
kithara-beat = { workspace = true }
kithara-bufpool = { workspace = true, optional = true }
kithara-config = { workspace = true }
kithara-derive = { workspace = true, features = ["patch"] }
kithara-dsp = { workspace = true, optional = true }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }
kithara-stretch = { workspace = true, default-features = false }
kithara-test-macros = { workspace = true }
kithara-test-utils = { workspace = true, features = ["client-reqwest", "usdt", "tls-rustls"], optional = true }

bon = { workspace = true }
delegate = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
portable-atomic = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-bufpool = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["usdt", "client-reqwest", "tls-rustls"] }
kithara-warp = { path = ".", default-features = false, features = ["usdt", "stretch-identity", "stretch-glide", "stretch-signalsmith", "stretch-bungee"] }

realfft = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }

[lints]
workspace = true
