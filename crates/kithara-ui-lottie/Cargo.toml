[package]
name = "kithara-ui-lottie"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The Lottie artwork kithara-ui ships and the emitter that draws it into the neutral draw list."
keywords = ["ui", "lottie", "animation", "vector", "render"]
categories = ["gui", "graphics"]
autotests = false

[dependencies]
kithara-platform = { workspace = true }
kithara-ui-draw = { workspace = true, features = ["list"] }

fieldwork = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
velato = { workspace = true }

[dev-dependencies]
kithara-test-utils = { features = ["test"], workspace = true }

[[test]]
name = "lottie"
path = "tests/lottie/main.rs"

[lints]
workspace = true
