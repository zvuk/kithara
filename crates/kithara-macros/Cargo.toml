[package]
name = "kithara-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "kithara macros: #[derive(Patch)], the configuration-document overlay of a configuration struct."
keywords = ["audio", "config", "serde", "macros", "kithara"]
categories = ["config", "development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["extra-traits"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[lints]
workspace = true
