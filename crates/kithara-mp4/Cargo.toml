[package]
name = "kithara-mp4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MPL-2.0"
repository.workspace = true
description = "Fragmented-mp4 box walk that reads headers and seeks over payload, yielding a fragment layout in media ticks."
keywords = ["audio", "mp4", "fmp4", "container", "streaming"]
categories = ["multimedia::audio"]

[dependencies]
derive_more = { workspace = true }
re_mp4 = { workspace = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha5", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { path = "../kithara-test-utils", features = ["test", "hang"] }

[lints]
workspace = true
