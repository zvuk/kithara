[build]
target = "index.html"
dist = "dist"
filehash = false

[serve]
port = 8080
# No COOP/COEP headers: GitHub Pages cannot send them either, so the dev server
# and the selenium suite reach cross-origin isolation the way the published demo
# does, through coi-serviceworker.js.

# Strip integrity/crossorigin attrs that break under COEP require-corp.
[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["xtask", "wasm", "postbuild", "--package", "kithara-ffi"]
