[package]
name = "kithara-ui-shaping"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Text styles, the embedded font catalog, and Parley text shaping for kithara-ui."
keywords = ["ui", "text", "font", "shaping", "parley"]
categories = ["gui", "text-processing"]
autotests = false

[features]
default = ["shape"]
# The embedded faces and the shaper. Off, the crate carries only the style
# vocabulary a document names, which a build that never draws still parses.
shape = [
    "dep:derive_more",
    "dep:fieldwork",
    "dep:kithara-platform",
    "dep:lucide-icons",
    "dep:num-traits",
    "dep:parley",
    "dep:skrifa",
    "dep:thiserror",
    "dep:unicode-segmentation",
]

[dependencies]
kithara-platform = { workspace = true, optional = true }

derive_more = { workspace = true, optional = true }
fieldwork = { workspace = true, optional = true }
lucide-icons = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
serde = { workspace = true }
skrifa = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }

[dev-dependencies]
kithara-test-utils = { features = ["test"], workspace = true }

[lints]
workspace = true

[[test]]
name = "shaping"
path = "tests/shaping/main.rs"
required-features = ["shape"]
