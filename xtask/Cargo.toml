[package]
name = "xtask"
version = "0.0.1-alpha5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "ci-bootstrap"
path = "bin/ci-bootstrap.rs"

[[bin]]
name = "fake-tool"
path = "bin/fake-tool/main.rs"

[features]
default = ["cli"]
cli = [
    "dep:kithara-devtools",
    "dep:anyhow",
    "dep:base64",
    "dep:cargo_metadata",
    "dep:clap",
    "dep:delegate",
    "dep:derive_more",
    "dep:fieldwork",
    "dep:filetime",
    "dep:fs4",
    "dep:glob",
    "dep:hex",
    "dep:humantime",
    "dep:plist",
    "dep:regex",
    "dep:reqwest",
    "dep:roxmltree",
    "dep:rustdoc-types",
    "dep:serde",
    "dep:serde_yaml_ng",
    "dep:sha2",
    "dep:signal-hook",
    "dep:tiny_http",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uniffi_bindgen",
]

[dependencies]
kithara-devtools = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cargo_metadata = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
delegate = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true }
fieldwork = { workspace = true, optional = true }
filetime = { workspace = true, optional = true }
fs4 = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
plist = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking", "form", "json", "rustls"] }
roxmltree = { workspace = true, optional = true }
rustdoc-types = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }
tempfile = { workspace = true }
tiny_http = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uniffi_bindgen = { workspace = true, optional = true }

# The descriptor ceiling this raises is a Unix concept; Windows hands out
# handles from a pool with no per-process limit to lift.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
socket2 = { workspace = true }

[dev-dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["visit"] }

[[test]]
name = "agent_hook_runner"
required-features = ["cli"]

[[test]]
name = "android_lane"
required-features = ["cli"]

[[test]]
name = "beat_model_cache"
required-features = ["cli"]

[[test]]
name = "bin_feature_ownership"
required-features = ["cli"]

[[test]]
name = "build_scripts"
required-features = ["cli"]

[[test]]
name = "download_boundary"
required-features = ["cli"]

[[test]]
name = "github_workflows"
required-features = ["cli"]

[[test]]
name = "lane_config"
required-features = ["cli"]

[[test]]
name = "portable_policy"
required-features = ["cli"]

[[test]]
name = "self_cache_runner"
required-features = ["cli"]

[[test]]
name = "gitlab_pipelines"
path = "tests/gitlab_pipelines/main.rs"
required-features = ["cli"]

[lints]
workspace = true
