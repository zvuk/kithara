[package]
name = "xtask"
version = "0.0.1-alpha4"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
kithara-devtools = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
cargo_metadata = { workspace = true }
clap = { workspace = true }
fs4 = { workspace = true }
glob = { workspace = true }
hex = { workspace = true }
plist = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "form", "json", "rustls"] }
rustdoc-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
signal-hook = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The descriptor ceiling this raises is a Unix concept; Windows hands out
# handles from a pool with no per-process limit to lift.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
