build_cache_size = "25GB"
cache_root = "/var/lib/kithara-ci"
image_cache_env_file = "/etc/kithara-ci/cache/images.env"
compiler_cache_size = "40G"
network = "kithara-ci"
subnet = "172.16.240.0/24"

[[repositories]]
name = "octocat/kithara"
token_file = "/etc/kithara-ci/tokens/octocat.token"

[[repositories]]
name = "hubot/kithara"
token_file = "/etc/kithara-ci/tokens/hubot.token"

[[runners]]
name = "kithara-ci-octocat"
repository = "octocat/kithara"
sccache_s3_env_file = "/etc/kithara-ci/cache/octocat.env"
cache_trust = "review"
cpus = 24
memory = "96g"
labels = ["self-hosted", "linux", "x64", "kithara"]

[[runners]]
name = "kithara-ci-octocat-gpu"
repository = "octocat/kithara"
sccache_s3_env_file = "/etc/kithara-ci/cache/octocat.env"
cache_trust = "review"
cpus = 8
memory = "32g"
labels = ["self-hosted", "linux", "x64", "kithara", "gpu"]
devices = ["/dev/dri"]
groups = [993]

[[runners]]
name = "kithara-ci-octocat-android"
repository = "octocat/kithara"
sccache_s3_env_file = "/etc/kithara-ci/cache/octocat.env"
cache_trust = "review"
cpus = 6
memory = "16g"
labels = ["self-hosted", "linux", "x64", "kithara", "android"]
devices = ["/dev/kvm"]
groups = [994]
flavor = "android"

[[runners]]
name = "kithara-ci-hubot"
repository = "hubot/kithara"
sccache_s3_env_file = "/etc/kithara-ci/cache/hubot.env"
cache_trust = "review"
cpus = 3
memory = "8g"
labels = ["self-hosted", "linux", "x64", "kithara"]

[windows]
name = "kithara-ci-windows"
repository = "octocat/kithara"
sccache_s3_env_file = "/etc/kithara-ci/cache/windows.env"
labels = ["self-hosted", "windows", "x64", "kithara"]
vcpus = 8
memory_mib = 16384
disk_gib = 200
