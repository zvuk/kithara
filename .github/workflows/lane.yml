name: Lane

# One declared CI lane, run against a fresh checkout on the self-hosted fleet.
#
# A caller names a lane and a pipeline kind; `.config/xtask.toml` and
# `xtask ci lane` own what that lane actually does. Stating the pinned
# checkout, the runner labels, and the artifact upload here once means a
# caller says only which lane to run, for which pipeline, and for how long -
# never a command of its own.
#
# A caller that needs more than one lane - several steps, an environment the
# lane cannot carry, `continue-on-error` - stays a job of its own. This is the
# uniform case, not every case.
on:
  workflow_call:
    inputs:
      lane:
        description: Name of the declared CI lane to run.
        required: true
        type: string
      fixture-refresh:
        description: >-
          Comma-separated fixture names, or producing-function names, to
          produce again instead of reading from the store. Empty on every
          ordinary run: the store is keyed by name, so a format change leaves
          entries that still answer to their name and only a deliberate run
          replaces them. Dispatch the pipeline once with this set, and leave
          it unset afterwards.
        default: ''
        type: string
      kind:
        description: Pipeline kind the lane runs under, for `xtask ci lane --kind`.
        required: true
        type: string
      timeout-minutes:
        description: How long the lane may take before the job is killed.
        required: true
        type: number
      history:
        description: >-
          Whether the lane reads the history of the commit it checks out, as a
          comparison against an earlier revision does. Without it the lane
          runs on the tip alone.
        default: false
        type: boolean
      artifact-name:
        description: Name of the artifact to upload, when the lane leaves one.
        default: ''
        type: string
      artifact-path:
        description: Path the artifact is collected from. Empty uploads nothing.
        default: ''
        type: string
      artifact-when:
        description: >-
          `always` uploads the artifact regardless of the lane's result;
          `failure` uploads it only when the lane fails.
        default: always
        type: string
      download:
        description: >-
          Name of an artifact this lane downloads before it runs, when it
          depends on one lane's output. Empty downloads nothing.
        default: ''
        type: string
      runner:
        description: Stable runner label for a lane-owned persistent build cache.
        default: ''
        type: string
      narrow:
        description: >-
          Nextest filterset the lane's test suite is narrowed to. Empty narrows
          nothing; a lane with no suite refuses one.
        default: ''
        type: string

# Not inherited from the caller: a called workflow gets its own environment.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # What this run produces again rather than reads from the store; empty unless
  # the pipeline was dispatched to refill it.
  KITHARA_FIXTURE_REFRESH: ${{ inputs.fixture-refresh }}
  # No cache paths here: the runner's container names the fixture store,
  # Cargo's home, the xtask build and the build directory. `ci lane` points
  # that build directory at the lane's own under the runner's build root and
  # names the copy of this job's timing reports as `KITHARA_LANE_TIMINGS`.

jobs:
  # Named after the lane, not after this file. A caller reaches this workflow
  # through `uses:`, and GitHub renders the callee's job name in the run tree,
  # not the caller's - so without this every lane in a fan-out reads `run` and
  # the tree says which lanes ran only through the API.
  run:
    name: ${{ inputs.lane }}
    runs-on: ${{ inputs.runner || fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # The runner image carries the toolchain, so a lane installs no packages.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not checkout's `fetch-depth: 0`: that fetches every branch and tag, and
      # the runner keeps its checkout, with garbage collection off, for every
      # job after this one.
      - name: Fetch the history of the checked-out commit
        if: ${{ inputs.history }}
        run: git fetch --no-tags --quiet --depth=2147483647 origin "$(git rev-parse HEAD)"

      # Checkout sets `gc.auto` to zero, so every fetch into the checkout the
      # runner keeps left a pack behind for good. Git's default thresholds
      # decide when they are repacked.
      - name: Collect the checkout's garbage
        run: git -c gc.auto=6700 -c gc.autoDetach=false gc --auto --quiet

      # The whole run's artifacts, not only the named ones: every upload below
      # suffixes its name with the run id and attempt so a re-run cannot collide
      # with the run it repeats, and a pattern would have to reconstruct that
      # suffix here. `download` names what this lane reads, and is what decides
      # whether anything is collected at all.
      - name: Fetch what this lane reads
        if: ${{ inputs.download != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Run the lane
        env:
          GITHUB_FETCH_TOKEN: ${{ github.token }}
          # A filterset is shell syntax, so it reaches the script as data.
          NARROW: ${{ inputs.narrow }}
        run: |
          # Cargo fetches into a cache outside checkout's credential scope.
          # Scope the header to the pinned dependency and RustSec database.
          auth=$(printf 'x-access-token:%s' "$GITHUB_FETCH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/gerasim13/bevy_seedling.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=http.https://github.com/RustSec/advisory-db.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth"
          just ci lane "${{ inputs.lane }}" --kind "${{ inputs.kind }}" ${NARROW:+--narrow "$NARROW"}

      # `ci lane` copies this job's reports out of the slot it held into the
      # job's own temporary directory and names that copy only when the build
      # wrote a report. A job that wrote none, or was cancelled first, has
      # nothing to upload.
      - name: Upload Cargo timing report
        if: ${{ always() && env.KITHARA_LANE_TIMINGS != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-${{ inputs.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KITHARA_LANE_TIMINGS }}
          if-no-files-found: error

      # `artifact-when: always` uploads even when the lane failed: a budget
      # report is most worth reading on the run that broke the budget.
      # `failure` uploads only on a failed lane, for evidence that exists
      # solely because something went wrong.
      #
      # `if-no-files-found: error` applies to every lane, not only the ones
      # that expect it: a declared artifact is the lane's own claim that it
      # will produce that file, and an upload that finds nothing is that
      # claim broken, not a reason to warn and move on.
      - name: Upload the lane's report
        if: ${{ always() && inputs.artifact-path != '' && (inputs.artifact-when == 'always' || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
