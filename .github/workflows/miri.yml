name: Miri

# Interpret the crates that carry shared state, looking for unsound memory
# ordering and for undefined behaviour reached through a dependency. Miri runs
# a program hundreds of times slower than the machine does, so it has a longer
# timeout than the routine checks.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The store the build-time audio assets are read from; see ci.yml.
  KITHARA_FIXTURE_CACHE: /cache/fixtures

# Heavy work: this asks for the whole fleet, so it queues with the other heavy
# lanes and takes its turn among them rather than beside them. A push is not
# behind that queue; see ci.yml.
concurrency:
  group: heavy-linux-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  miri:
    name: Interpret the shared-state crates
    # `KITHARA_RUNNER_LABELS` is set only where runners are attached, so a
    # copy of this repository without them never starts the job.
    # See .github/workflows/ci.yml.
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Miri
        run: just test miri
