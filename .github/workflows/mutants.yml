name: Mutants

# The suites in `.config/mutation-suites.toml`. Each names its production files
# and a unit-test filter; nothing here walks the workspace or an integration
# suite. It ran on the Mac mini, which has neither the cores nor the hours.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The store the build-time audio assets are read from; see ci.yml.
  KITHARA_FIXTURE_CACHE: /cache/fixtures

# Heavy work: this asks for the whole fleet, so it queues with the other heavy
# lanes and takes its turn among them rather than beside them. A push is not
# behind that queue; see ci.yml.
concurrency:
  group: heavy-linux-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  mutants:
    name: Mutation suites
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Mac mini ran these one at a time. This host has cores to spare.
      - name: Run the mutation suites
        run: just test mutants run-all --jobs 4

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants
          path: target/mutants-ci/
