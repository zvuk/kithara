name: Android

# The instrumented tests need a device. On a machine whose processor matches
# the guest's, the emulator is a virtual machine rather than an interpreter,
# which is what makes running them here worth the minutes.
on:
  workflow_call:
    inputs:
      filter:
        description: nextest expression for the Rust tests; empty runs them all
        required: false
        type: string
  workflow_dispatch:
    inputs:
      filter:
        description: nextest expression for the Rust tests; empty runs them all
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android baseline on an emulator
    # Set only where a runner with an emulator is attached, so a copy of this
    # repository without one never starts the job.
    # See .github/workflows/ci.yml.
    if: vars.KITHARA_ANDROID_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_ANDROID_RUNNER_LABELS) }}
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run instrumentation and Rust tests
        env:
          KITHARA_ANDROID_TEST_FILTER: ${{ inputs.filter }}
        run: just ci lane android-test --kind platforms

      - name: Upload test results and run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-baseline
          path: |
            target/android-test/
            !target/android-test/**/native/*.tar
            !target/android-test/**/native/jniLibs/**
            !target/android-test/**/native/apk/**
