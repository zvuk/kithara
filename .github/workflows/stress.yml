name: Stress

# GitHub owns authorization, immutable checkout identity, artifact transport,
# and the trusted reporting boundary. The Rust side owns portable work.
#
# The stress run goes to a runner of its own, labelled `kithara-stress` instead
# of the fleet's `kithara` rather than in addition to it: GitHub places a job
# on any runner whose labels cover the request, so a runner carrying both
# would also take ordinary lanes, and a run measuring flakes would be
# back to sharing the machine with whatever else was queued.
on:
  workflow_call:
    inputs:
      revision:
        description: full commit SHA to test; empty uses the triggering commit
        required: false
        type: string
      filter:
        description: nextest expression; empty uses the project configuration
        required: false
        type: string
      count:
        description: repetitions; empty uses the repository variable, then project configuration
        required: false
        type: string
      mode:
        description: configured stress mode; empty uses the project configuration
        required: false
        type: string
      lane:
        description: stressed test lane; empty uses the tier's lanes
        required: false
        type: string
      tier:
        description: configured stress tier; empty uses the project's default tier
        required: false
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: full commit SHA to test; empty uses the triggering commit
        required: false
        type: string
      filter:
        description: nextest expression; empty uses the project configuration
        required: false
        type: string
      count:
        description: repetitions; empty uses the repository variable, then project configuration
        required: false
        type: string
      mode:
        description: configured stress mode; empty uses the project configuration
        required: false
        type: string
      lane:
        description: stressed test lane; empty uses the tier's lanes
        required: false
        type: string
      tier:
        description: configured stress tier; empty uses the project's default tier
        required: false
        type: string

# The run queues against itself, not against fork CI. Sharing CI's group
# was right while both drew on one pool of runners; now that the run has a
# runner of its own it is a way to lose runs, because a group admits one queued
# entry and a run arriving behind a queued lane is cancelled outright
# rather than held.
concurrency:
  group: stress-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  authorize:
    name: Stress authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One shard per runner that serves the run. Shards on one runner take
    # turns, so a run split wider than its pool repeats nothing sooner and
    # holds every unit's evidence back until the slowest shard reports.
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      shard-count: ${{ steps.shards.outputs.shard-count }}
    steps:
      - name: Validate fork owner and runner configuration
        id: shards
        env:
          ACTOR: ${{ github.actor }}
          COUNT: ${{ inputs.count || vars.KITHARA_STRESS_COUNT }}
          ENABLED: ${{ vars.KITHARA_STRESS_ENABLED }}
          IS_FORK: ${{ github.event.repository.fork }}
          MAX_COUNT: ${{ vars.KITHARA_STRESS_MAX_COUNT }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ inputs.revision || github.sha }}
          RUNNER_LABELS: ${{ vars.KITHARA_STRESS_RUNNER_LABELS }}
          SHARDS: ${{ vars.KITHARA_STRESS_SHARDS }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENABLED" == true ]] || { echo "stress runs are disabled"; exit 1; }
          [[ "$IS_FORK" == true ]] || { echo "stress runs require a fork"; exit 1; }
          [[ "$ACTOR" == "$OWNER" ]] || { echo "only the fork owner may start stress"; exit 1; }
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]] || { echo "only the fork owner may re-run stress"; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "revision must be a full SHA"; exit 1; }
          if [[ -n "$COUNT" ]]; then
            [[ "$COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "invalid count"; exit 1; }
          fi
          if [[ -n "$MAX_COUNT" ]]; then
            [[ "$MAX_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "invalid repository maximum"; exit 1; }
            if [[ -n "$COUNT" ]]; then
              (( 10#$COUNT <= 10#$MAX_COUNT )) || { echo "count exceeds repository maximum"; exit 1; }
            fi
          fi
          jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "string" and length > 0)
            and (["self-hosted", "linux", "x64", "kithara-stress"] - . | length == 0)
          ' <<< "$RUNNER_LABELS" >/dev/null || {
            echo "runner labels must include self-hosted, linux, x64, and kithara-stress"
            exit 1
          }
          if [[ -n "$SHARDS" ]]; then
            [[ "$SHARDS" =~ ^[1-3]$ ]] || { echo "shard count must be between 1 and 3"; exit 1; }
          fi
          SHARDS="${SHARDS:-1}"
          shards='['
          separator=''
          for ((shard = 0; shard < SHARDS; shard++)); do
            shards+="$separator$shard"
            separator=','
          done
          shards+=']'
          {
            echo "shards=$shards"
            echo "shard-count=$SHARDS"
          } >> "$GITHUB_OUTPUT"

  execute:
    name: Repeated run (shard ${{ matrix.shard }})
    needs: authorize
    if: >-
      ${{ github.event.repository.fork == true &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          vars.KITHARA_STRESS_ENABLED == 'true' &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'self-hosted') &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'linux') &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'x64') &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'kithara-stress') }}
    runs-on: ${{ fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS) }}
    timeout-minutes: 1380
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.authorize.outputs.shard-count) }}
      matrix:
        shard: ${{ fromJSON(needs.authorize.outputs.shards) }}
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Checkout subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ inputs.revision || github.sha }}

      - name: Execute the stress run
        working-directory: controller
        env:
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          COUNT: ${{ inputs.count || vars.KITHARA_STRESS_COUNT }}
          FILTER: ${{ inputs.filter }}
          MODE: ${{ inputs.mode }}
          LANE: ${{ inputs.lane }}
          SHARD_COUNT: ${{ needs.authorize.outputs.shard-count }}
          SHARD_INDEX: ${{ matrix.shard }}
          SUBJECT_SHA: ${{ inputs.revision || github.sha }}
          TIER: ${{ inputs.tier }}
        run: |
          args=(
            --subject-root "$GITHUB_WORKSPACE/subject"
            --output "$RUNNER_TEMP/kithara-stress/raw/shard-$SHARD_INDEX"
            --expected-controller-sha "$CONTROLLER_SHA"
            --expected-subject-sha "$SUBJECT_SHA"
            --shard-index "$SHARD_INDEX"
            --shard-count "$SHARD_COUNT"
          )
          [[ -z "$FILTER" ]] || args+=(--filter "$FILTER")
          [[ -z "$COUNT" ]] || args+=(--count "$COUNT")
          [[ -z "$TIER" ]] || args+=(--tier "$TIER")
          # `--mode` and `--lane` repeat per entry; each input is a space-separated
          # list, so one flag carrying the whole string would name a mode or a lane
          # that does not exist and fail the run at argument parsing.
          for mode in $MODE; do args+=(--mode "$mode"); done
          for lane in $LANE; do args+=(--lane "$lane"); done
          just ci stress "${args[@]}"

      - name: Upload the raw stress evidence
        if: always()
        id: raw-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-raw-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/kithara-stress/raw
          if-no-files-found: error
          retention-days: 14

  report:
    name: Report evidence
    needs: execute
    if: ${{ always() && needs.execute.result != 'skipped' }}
    runs-on: [self-hosted, linux, x64, kithara-report]
    timeout-minutes: 30
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Download every shard's evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stress-raw-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: raw
          merge-multiple: true

      - name: Verify and render the stress evidence
        if: always()
        working-directory: controller
        env:
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          COUNT: ${{ inputs.count || vars.KITHARA_STRESS_COUNT }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
          FILTER: ${{ inputs.filter }}
          MODE: ${{ inputs.mode }}
          LANE: ${{ inputs.lane }}
          SUBJECT_SHA: ${{ inputs.revision || github.sha }}
          TIER: ${{ inputs.tier }}
        run: |
          args=()
          # One root per shard: each artifact carries its evidence under `shard-<index>`.
          for raw in "$GITHUB_WORKSPACE"/raw/shard-*; do args+=(--raw "$raw"); done
          args+=(
            --output "$GITHUB_WORKSPACE/target/stress-report.md"
            --expected-controller-sha "$CONTROLLER_SHA"
            --expected-subject-sha "$SUBJECT_SHA"
            --execute-result "$EXECUTE_RESULT"
          )
          [[ -z "$FILTER" ]] || args+=(--filter "$FILTER")
          [[ -z "$COUNT" ]] || args+=(--count "$COUNT")
          [[ -z "$TIER" ]] || args+=(--tier "$TIER")
          for mode in $MODE; do args+=(--mode "$mode"); done
          for lane in $LANE; do args+=(--lane "$lane"); done
          just ci cache-exec stress-report just ci stress-report "${args[@]}"

      - name: Upload report compiler-cache evidence
        if: ${{ always() && hashFiles(format('controller/.ci-artifacts/cache/github-{0}-{1}-*.json', github.run_id, github.run_attempt)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-cache-stress-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/.ci-artifacts/cache/github-${{ github.run_id }}-${{ github.run_attempt }}-*.json
          if-no-files-found: error

      - name: Add the stress summary
        if: always()
        run: |
          if [[ -s "$GITHUB_WORKSPACE/target/stress-report.md" ]]; then
            cat "$GITHUB_WORKSPACE/target/stress-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Stress report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            raw
            target/stress-report.md
          retention-days: 14
