name: Network

# The one test lane the catalog cannot declare. Its build bakes production DRM
# keys into the binary, so it needs five repository secrets at compile time -
# and one executor serves every declared lane, so handing them to it would hand
# them to all of them. A lane that needs more than a recipe stays a workflow of
# its own, beside the three that need a machine of their own.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: network-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  network:
    name: network
    if: vars.KITHARA_RUNNER_LABELS != ''
    runs-on: [self-hosted, linux, x64, kithara-network]
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the lane
        env:
          # Baked at build time by kithara-app's build script, so they belong
          # to the build rather than to the test process. `KITHARA_DRM_REQUIRE`
          # turns a missing one into a build error naming it, instead of the
          # silent degrade that would run the lane against no key server and
          # report it green.
          KITHARA_DRM_REQUIRE: 1
          KITHARA_DRM_PROD_KEY: ${{ secrets.KITHARA_DRM_PROD_KEY }}
          KITHARA_DRM_PROD_AUTH_TOKEN: ${{ secrets.KITHARA_DRM_PROD_AUTH_TOKEN }}
          KITHARA_DRM_PROD_SP_ZV_TOKEN: ${{ secrets.KITHARA_DRM_PROD_SP_ZV_TOKEN }}
          KITHARA_DRM_STAGE_KEY: ${{ secrets.KITHARA_DRM_STAGE_KEY }}
          KITHARA_DRM_STAGE_AUTH_TOKEN: ${{ secrets.KITHARA_DRM_STAGE_AUTH_TOKEN }}
        # The dedicated runner mounts only its private cache scope. Keep the
        # build as one leased eviction unit under its persistent target root.
        run: CARGO_TARGET_DIR=/cache/target/lane-network just ci cache-exec network just test run --lane=network

      - name: Upload compiler-cache evidence
        if: ${{ always() && hashFiles(format('.ci-artifacts/cache/github-{0}-{1}-*.json', github.run_id, github.run_attempt)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-network-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/cache/github-${{ github.run_id }}-${{ github.run_attempt }}-*.json
          if-no-files-found: error
