name: CI

# Nothing here reacts to a pull request. A self-hosted runner executes whatever
# the checked-out tree tells it to, so a fork proposing a branch must never be
# able to start one; only a push to a copy of this repository can.
on:
  push:
  workflow_call:
    inputs:
      required_lanes:
        description: Space-separated additional required lane names, or all.
        type: string
        default: ""
      fixture-refresh:
        description: >-
          Comma-separated fixture names, or producing-function names, to
          produce again instead of reading from the store. Leave unset on
          ordinary runs and dispatch once with it set when a format change
          has to replace what the store already answers for.
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      required_lanes:
        description: Space-separated additional required lane names, or all.
        type: string
        default: ""
      fixture-refresh:
        description: >-
          Comma-separated fixture names, or producing-function names, to
          produce again instead of reading from the store. Leave unset on
          ordinary runs and dispatch once with it set when a format change
          has to replace what the store already answers for.
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A newer push supersedes a run for the same branch. Different branches remain
# independent, while repeated commits cannot fill the runner queue with work
# whose result is already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Authorization runs on a GitHub-hosted machine, before any job can reach a
  # self-hosted runner. Malformed runner configuration is a failed check, never
  # a skipped workflow that can be mistaken for success. Absent configuration
  # is a different statement — this repository runs no CI — and the guard below
  # answers it before a job is requested.
  authorize:
    name: CI authorization
    # A repository without runner labels runs nothing: upstream has no runners and is not
    # getting any — its gate is the GitLab verification status the bridge
    # writes. Every other workflow already skips on that variable; this one
    # turned the question into a job, and on upstream that job cannot even
    # start ("your account is locked due to a billing issue"), so every push
    # there was red with all twenty checks skipped. A permanent red reads as a
    # regression and hides the next real one.
    #
    # A fork is admitted on its own, without the variable being readable from
    # here, because a fork someone else owns is where this repository is
    # developed and its settings are not ours to inspect. The trade is that a
    # fork with no runners starts a run whose jobs fail to resolve `runs-on`
    # rather than being skipped. A malformed value is still a hard failure: it
    # passes this guard and fails the step below.
    if: github.event.repository.fork || vars.KITHARA_RUNNER_LABELS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - name: Validate actor and runner labels
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          RUNNER_LABELS: ${{ vars.KITHARA_RUNNER_LABELS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          actor = os.environ["ACTOR"]
          owner = os.environ["OWNER"]
          if actor != owner:
              print(f"CI may only be started by repository owner {owner!r}, got {actor!r}")
              sys.exit(1)

          raw_labels = os.environ.get("RUNNER_LABELS", "")
          try:
              labels = json.loads(raw_labels)
          except json.JSONDecodeError as error:
              print(f"KITHARA_RUNNER_LABELS is not valid JSON: {error}")
              sys.exit(1)
          if not isinstance(labels, list) or not labels or not all(
              isinstance(label, str) and label for label in labels
          ):
              print("KITHARA_RUNNER_LABELS must be a non-empty JSON array of non-empty strings")
              sys.exit(1)
          PY

      # The pipeline kind every role below runs under. A push to the default
      # branch is `main`. A push to a branch with a pull request open for
      # review where pull requests land - the repository this one was forked
      # from, or this one when it is no fork - is `merge-request`; any other
      # push, a draft's included, is `branch`. Nothing here reacts to a pull
      # request, so marking a draft ready starts nothing: the next push, or a
      # re-run of this one, asks again.
      - name: Name the pipeline kind
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            kind=main
          else
            upstream=$(gh api "repos/$REPOSITORY" --jq '.parent.full_name // .full_name')
            ready=$(gh api "repos/$upstream/pulls?head=$OWNER:$BRANCH&state=open" --jq 'map(select(.draft | not)) | length')
            if [ "$ready" -gt 0 ]; then kind=merge-request; else kind=branch; fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  ui-select:
    name: Select UI ownership
    needs: authorize
    runs-on: [self-hosted, linux, x64, kithara-report]
    timeout-minutes: 10
    outputs:
      ui_required: ${{ steps.ui.outputs.ui_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select UI ownership
        id: ui
        run: |
          ui_required=$(just ci touched --lane ui)
          echo "ui_required=$ui_required" >> "$GITHUB_OUTPUT"

  # Every gate lane, from the one catalog. What each of them runs, how long it
  # may take, how much history it reads and what it leaves behind is declared in
  # `.config/xtask.toml`; `run.yml` renders the selection and `lane.yml` runs
  # each entry. Nothing about a lane is described here, so nothing here can
  # disagree with what GitLab runs.
  #
  # The kind comes from the authorization job. A `branch` or `merge-request`
  # push runs the lanes that name its kind; the two schedule the same lanes, and
  # a lane that runs the product suite runs it whole on a ready pull request and
  # only what the push touched on any other branch push. A `main` push asks for
  # `all`, a full run: every lane that some full kind (main, nightly, weekly,
  # release, platforms) schedules.
  lanes:
    name: Gate
    needs: authorize
    uses: ./.github/workflows/run.yml
    with:
      role: gate
      kind: ${{ needs.authorize.outputs.kind }}
      only: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'all' || inputs.required_lanes || '' }}
      fixture-refresh: ${{ inputs.fixture-refresh }}

  deep:
    name: Deep
    needs: authorize
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || inputs.required_lanes != ''
    uses: ./.github/workflows/run.yml
    with:
      role: deep
      kind: ${{ needs.authorize.outputs.kind }}
      only: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'all' || inputs.required_lanes }}
      fixture-refresh: ${{ inputs.fixture-refresh }}

  # Mutation testing is not scheduled from here: a push to the default branch
  # asks for every lane, and the suites cost hours. `dispatch.yml` runs them
  # when asked.

  platforms:
    name: Platforms
    needs: authorize
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || inputs.required_lanes != ''
    uses: ./.github/workflows/run.yml
    with:
      role: platforms
      kind: ${{ needs.authorize.outputs.kind }}
      only: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'all' || inputs.required_lanes }}
      fixture-refresh: ${{ inputs.fixture-refresh }}

  quality:
    name: Quality
    needs: authorize
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || inputs.required_lanes != ''
    uses: ./.github/workflows/run.yml
    with:
      role: quality
      kind: ${{ needs.authorize.outputs.kind }}
      only: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'all' || inputs.required_lanes }}
      fixture-refresh: ${{ inputs.fixture-refresh }}

  ui:
    name: UI
    needs: [authorize, ui-select]
    if: >-
      vars.KITHARA_GPU_RUNNER_LABELS != ''
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || contains(format(' {0} ', inputs.required_lanes), ' all ')
      || contains(format(' {0} ', inputs.required_lanes), ' deep-ui ')
      || needs.ui-select.outputs.ui_required == 'true')
    uses: ./.github/workflows/ui.yml

  # The Android baseline needs an emulator, which only the KVM runner pool
  # carries, so it is started by name like the UI suite rather than through the
  # shared fan-out.
  android:
    name: Android
    needs: authorize
    if: >-
      vars.KITHARA_ANDROID_RUNNER_LABELS != ''
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || contains(format(' {0} ', inputs.required_lanes), ' all ')
      || contains(format(' {0} ', inputs.required_lanes), ' android-test '))
    uses: ./.github/workflows/android.yml

  # This is the one stable required status. GitHub treats a skipped job as an
  # acceptable required check, so the aggregate must run unconditionally and
  # reject every result other than an executed success.
  required:
    name: CI required
    # `always()` alone would keep this job red on a repository the guard above
    # skipped: it demands success from every job it needs, and a skip is not a
    # success. It carries the same guard so the whole run is skipped there.
    if: ${{ always() && (github.event.repository.fork || vars.KITHARA_RUNNER_LABELS != '') }}
    needs:
      - authorize
      - ui-select
      - lanes
      - deep
      - platforms
      - quality
      - ui
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have executed successfully
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED_LANES: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'all' || inputs.required_lanes || '' }}
          TOUCHED_UI_REQUIRED: ${{ vars.KITHARA_GPU_RUNNER_LABELS != '' && needs.ui-select.outputs.ui_required == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          required_lanes = set(os.environ["REQUIRED_LANES"].split())
          optional_required = bool(required_lanes)
          ui_required = "all" in required_lanes or "deep-ui" in required_lanes or os.environ["TOUCHED_UI_REQUIRED"] == "true"
          android_required = "all" in required_lanes or "android-test" in required_lanes
          incomplete = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] != "success"
              and not (name in {"deep", "platforms", "quality"} and job["result"] == "skipped" and not optional_required)
              and not (name == "ui" and job["result"] == "skipped" and not ui_required)
              and not (name == "android" and job["result"] == "skipped" and not android_required)
          }
          if incomplete:
              print(f"required CI jobs did not execute successfully: {incomplete}")
              sys.exit(1)
          PY
