name: CI

# Nothing here reacts to a pull request. A self-hosted runner executes whatever
# the checked-out tree tells it to, so a fork proposing a branch must never be
# able to start one; only a push to a copy of this repository can.
on:
  push:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Where the build-time audio assets are kept. A job that finds the store
  # empty regenerates every asset it needs, which is encode work no test
  # should pay for; the bytes are identical for every job sharing a build
  # fingerprint. The path is the one the GitLab container executor already
  # mounts on this host, so both CIs fill one store. Lanes that build on
  # macOS or Windows leave the variable unset and land in the temporary
  # directory instead.
  KITHARA_FIXTURE_CACHE: /cache/fixtures

# One queue per branch. Pushes to different branches hold nothing from each
# other: they share the machine at the runner, where a job waits for the cores
# it asks for, which is the resource actually being rationed. Serialising whole
# runs instead was measured on the Linux host — two pushes waited fourteen
# minutes behind one nightly assessment with fifteen of eighteen runner slots
# and two thirds of the CPU idle. The lanes that do want the whole fleet queue
# together under `heavy-linux-`, and the stress campaign has a runner of its own
# and a group of its own.
#
# `queue: max` is what makes this queue honest. The default `single` holds one
# pending run and lets every new arrival evict it, so a second push to a branch
# cancelled the run already waiting there — a queue in name only. `queue` takes
# no expression and may not be declared beside `cancel-in-progress: true`, so
# the cancellation of superseded pushes goes with it, the trade lanes.yml
# already made. A superseded push runs to completion instead of being cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # Authorization runs on a GitHub-hosted machine, before any job can reach a
  # self-hosted runner. Malformed runner configuration is a failed check, never
  # a skipped workflow that can be mistaken for success. Absent configuration
  # is a different statement — this repository runs no CI — and the guard below
  # answers it before a job is requested.
  authorize:
    name: CI authorization
    # Every job below takes its `runs-on` from the runner-labels variable, so a
    # repository without one runs nothing: upstream has no runners and is not
    # getting any — its gate is the GitLab verification status the bridge
    # writes. Every other workflow already skips on that variable; this one
    # turned the question into a job, and on upstream that job cannot even
    # start ("your account is locked due to a billing issue"), so every push
    # there was red with all twenty checks skipped. A permanent red reads as a
    # regression and hides the next real one.
    #
    # A fork is admitted on its own, without the variable being readable from
    # here, because a fork someone else owns is where this repository is
    # developed and its settings are not ours to inspect. The trade is that a
    # fork with no runners starts a run whose jobs fail to resolve `runs-on`
    # rather than being skipped. A malformed value is still a hard failure: it
    # passes this guard and fails the step below.
    if: github.event.repository.fork || vars.KITHARA_RUNNER_LABELS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate actor and runner labels
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          RUNNER_LABELS: ${{ vars.KITHARA_RUNNER_LABELS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          actor = os.environ["ACTOR"]
          owner = os.environ["OWNER"]
          if actor != owner:
              print(f"CI may only be started by repository owner {owner!r}, got {actor!r}")
              sys.exit(1)

          raw_labels = os.environ.get("RUNNER_LABELS", "")
          try:
              labels = json.loads(raw_labels)
          except json.JSONDecodeError as error:
              print(f"KITHARA_RUNNER_LABELS is not valid JSON: {error}")
              sys.exit(1)
          if not isinstance(labels, list) or not labels or not all(
              isinstance(label, str) and label for label in labels
          ):
              print("KITHARA_RUNNER_LABELS must be a non-empty JSON array of non-empty strings")
              sys.exit(1)
          PY

  # The single self-hosted gate every substantive job depends on. The runner
  # labels remain repository configuration rather than naming an owner or a
  # machine in this workflow.
  gate:
    name: Self-hosted gate
    needs: authorize
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 5
    steps:
      - name: Confirm the runner is reachable
        run: just --version

  lint:
    name: Lint
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      # The runner image carries the toolchain, so regular jobs install no
      # packages. The advisory browser lane below is the deliberate exception:
      # it provisions a reviewed Chrome/ChromeDriver pair for each run.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lint checks
        run: just lint full

  test:
    name: Tests (simulated clock)
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        env:
          KITHARA_HANG_DUMP_DIR: ${{ github.workspace }}/target/hang
        run: |
          mkdir -p "$KITHARA_HANG_DUMP_DIR"
          just test all

      # A hang dump names the branch that starved the watchdog; the job's
      # container does not outlive the job, so an unuploaded dump is evidence
      # destroyed at the exact moment it exists.
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hang-dumps-simulated-clock
          path: target/hang/
          if-no-files-found: ignore

  # The virtual clock collapses fixture delays, so order-of-service defects
  # cannot reproduce above. Own target dir: the two builds differ.
  test-real-clock:
    name: Tests (real clock)
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests on a real clock
        env:
          KITHARA_HANG_DUMP_DIR: ${{ github.workspace }}/target/hang
        run: |
          mkdir -p "$KITHARA_HANG_DUMP_DIR"
          CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/flash-off" just test run --flash=off

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hang-dumps-real-clock
          path: target/hang/
          if-no-files-found: ignore

  # `just test` no longer carries the build tooling or the harness it is written
  # with; three lanes do. The nightly sweep in lanes.yml is what catches a
  # product change breaking them, but a change to their OWN sources must not wait
  # a night, so this runs the lanes that this push actually touches.
  #
  # The selection happens inside the job rather than in a job of its own, and the
  # job runs unconditionally with an empty selection as a legitimate outcome.
  # Both follow from what this workflow already guarantees: every job depends on
  # `gate` and nothing else, and `required` below reads anything other than an
  # executed success — skipped included — as a failure. A job that skipped itself
  # on an empty selection would turn every ordinary push red.
  support:
    name: Support suites
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The selection compares against a base, which a shallow single-branch
          # checkout does not carry.
          fetch-depth: 0

      - name: Run the suites this push touches
        env:
          # Read as data, never interpolated into the shell.
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          suites=$(python3 - <<'PY'
          import json
          import os
          import subprocess

          # Each suite's own sources, plus the config that decides what belongs to
          # which suite: a change to the routing must be tested by the routes it
          # moves.
          OWNED = {
              "tooling": ("xtask/", "crates/kithara-devtools/"),
              "harness": (
                  "crates/kithara-test-utils/",
                  "crates/kithara-test-macros/",
                  "crates/kithara-platform/tests/flash_",
              ),
              "fixtures": (
                  "tests/src/",
                  "tests/tests/suite_harness.rs",
                  "tests/tests/flash_lexical.rs",
                  "tests/tests/timeout_guard.rs",
              ),
          }
          SHARED = (".config/xtask.toml", ".config/nextest.toml", "tests/Cargo.toml")

          # main is where the branches land, so it runs the whole set rather than
          # the diff of whatever merged last.
          if os.environ["REF"] == "refs/heads/main":
              print(" ".join(OWNED))
              raise SystemExit(0)

          base = subprocess.run(
              ["git", "merge-base", "origin/main", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          if any(path in SHARED for path in changed):
              print(" ".join(OWNED))
              raise SystemExit(0)

          print(" ".join(
              suite
              for suite, prefixes in OWNED.items()
              if any(path.startswith(prefixes) for path in changed)
          ))
          PY
          )
          if [ -z "$suites" ]; then
            echo "no support path touched; the nightly sweep in lanes.yml covers these"
            exit 0
          fi
          # Serial, and one failure does not hide the rest: this exists to
          # enumerate which suite broke.
          status=0
          for suite in $suites; do
            echo "=== $suite ==="
            just test run "--lane=$suite" || status=1
          done
          exit "$status"

  msrv:
    name: MSRV
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image knows which toolchain is the minimum supported one, so the
      # version stays owned by the reviewed pins rather than repeated here.
      - name: Check the minimum supported toolchain
        run: RUSTUP_TOOLCHAIN="${KITHARA_MSRV_TOOLCHAIN}" just check

  deny:
    name: cargo-deny
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        run: just deps deny

  arch:
    name: Architecture checks
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run architecture checks
        run: just lint arch

  wasm:
    name: WASM checks
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run wasm checks
        run: just platform wasm

  wasm-browser:
    name: Chromium WebCodecs (advisory)
    needs: gate
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The browser is installed in the image, not by the job: Debian ships
      # `chromium` with a version-matched `chromium-driver`, and `.config/ci-pins.toml`
      # records which pair a rebuild brought in. Downloading Chrome for Testing
      # per job did the opposite — it read a version index on GitHub Pages, three
      # of whose four addresses this network cannot reach, and then installed an
      # OLDER build over the working pair. The recipe is called directly, as every
      # other job here does: `just ci run <lane>` is the host executor's entry and
      # wants a host profile this container has no reason to carry.
      - name: Run the Chromium browser lane
        run: just test wasm chrome webcodecs

  machete:
    name: cargo-machete
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-machete
        run: just deps machete

  wasm-size:
    name: WASM size budget
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run wasm-slim check
        run: just platform wasm size-check

      - name: Upload wasm-slim report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-slim-report
          path: target/wasm-slim-result.json

  hack:
    name: Feature powerset
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-hack
        run: just deps hack

  semver:
    name: Semver checks
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      # The baseline is a revision, so the history holding it must be here.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run semver checks
        run: just deps semver

  # Real-time correctness is what this product is for: an allocation or a lock
  # on the audio thread is a dropout, not a slow path. It ran nightly, which
  # meant learning about it the morning after the push that caused it.
  #
  # The fast lane is a tripwire over the mock decoder. The real-decoder lanes
  # exercise file and HLS playback under the same required sanitizer gate.
  rtsan:
    name: RealtimeSanitizer
    needs: gate
    uses: ./.github/workflows/rtsan.yml

  # Memory is the other budget a player cannot overrun quietly: pool budgets,
  # allocation regressions, a zero-allocation audio hot path, and the resident
  # size of an HLS playback. `just perf memory` runs all four.
  memory:
    name: Memory budgets
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the memory budgets
        run: just perf memory

  # This is the one stable required status. GitHub treats a skipped job as an
  # acceptable required check, so the aggregate must run unconditionally and
  # reject every result other than an executed success.
  required:
    name: CI required
    # `always()` alone would keep this job red on a repository the guard above
    # skipped: it demands success from every job it needs, and a skip is not a
    # success. It carries the same guard so the whole run is skipped there.
    if: ${{ always() && (github.event.repository.fork || vars.KITHARA_RUNNER_LABELS != '') }}
    needs:
      - authorize
      - gate
      - lint
      - test
      - test-real-clock
      - support
      - msrv
      - deny
      - arch
      - wasm
      - machete
      - wasm-size
      - hack
      - semver
      - rtsan
      - memory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have executed successfully
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          incomplete = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] != "success"
          }
          if incomplete:
              print(f"required CI jobs did not execute successfully: {incomplete}")
              sys.exit(1)
          PY
