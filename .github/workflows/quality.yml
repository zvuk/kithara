name: Quality

# The repository's own analysis recipes. They exist, they are documented, and
# until now nothing ran them unattended.
on:
  workflow_call:
    inputs:
      depth:
        description: shallow for the routine run, deep for the weekly one
        required: false
        default: shallow
        type: string
  workflow_dispatch:
    inputs:
      depth:
        description: shallow for the routine run, deep for the weekly one
        required: false
        default: shallow
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The store the build-time audio assets are read from; see ci.yml.
  KITHARA_FIXTURE_CACHE: /cache/fixtures

# Heavy work: this asks for the whole fleet, so it queues with the other heavy
# lanes and takes its turn among them rather than beside them. A push is not
# behind that queue; see ci.yml.
concurrency:
  group: heavy-linux-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  assess:
    name: Repository assessment
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Depth buys more evidence; the profile decides what is being judged.
      # `complete` drops every exclusion, so it would score xtask and devtools
      # as if they were the product and produce a number nothing can be
      # compared against.
      - name: Assess
        env:
          DEPTH: ${{ inputs.depth || 'shallow' }}
        run: |
          if [[ "$DEPTH" == "deep" ]]; then
            just quality assess --depth deep
          else
            just quality assess
          fi

      # Decision evidence stays visible when assessment execution is partial,
      # and an invalid summary remains a failed check.
      - name: Summarize the assessment
        if: always()
        env:
          DEPTH: ${{ inputs.depth || 'shallow' }}
        run: |
          summary_args=()
          if [[ "$DEPTH" == "deep" ]]; then
            summary_args=(--depth deep)
          fi
          just quality summary "${summary_args[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the assessment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-assessment-${{ inputs.depth || 'shallow' }}
          path: |
            target/quality-assessment/
            target/quality-report/
            target/quality-lab/

  similarity:
    name: Duplication report
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report structural and behavioural duplication
        run: just lint similarity

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: similarity-report
          path: target/similarity/

  architecture:
    name: Architecture diagram and metrics
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `viz` no longer fails over a degraded optional overlay, so the only place
      # that degradation would otherwise appear is an artifact nobody opens.
      - name: Render the architecture document
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target
          just arch viz 2>&1 | tee target/viz.log

      - name: Report the architecture evidence status
        if: always()
        run: |
          {
            echo "## Architecture document"
            echo
            if [[ -f target/viz.log ]]; then
              grep -E '^(==>|warning:)' target/viz.log | sed 's/^/- /' \
                || echo "- The render produced no status line."
            else
              echo "- The render step did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sweep for orphans
        run: just arch orphans --deny

      - name: Upload the diagram and metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture
          path: target/architecture/

  # The CRAP metric: complexity weighted by how little of it the tests execute.
  # cargo-crap is pinned in `.config/ci-pins.toml` and installed in the CI
  # image, and until now nothing ran it — the one number that ranks "risky and
  # untested" was available to every local checkout and to no report.
  #
  # `just quality coverage-risk` writes the LCOV even when the suite is red and
  # scores it anyway, so the ranking survives a failing product; without a
  # baseline the run states the picture rather than gating on it.
  coverage-risk:
    name: Coverage risk
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure coverage risk
        run: just quality coverage-risk

      - name: Upload the coverage-risk report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-risk
          path: |
            target/quality-lab/
            coverage/

  health:
    name: Workspace health
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `semver-checks` compares the branch against the tip of `main`, and the
      # checkout above fetches one commit of one branch. Without this the stage
      # dies on `couldn't parse revision: "origin/main^{tree}"` and reports a
      # failure it never ran. One commit is enough: the baseline is a tree, and
      # a full clone of this repository is gigabytes of history.
      - name: Fetch the semver baseline
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - name: Report workspace health
        run: just ci health

      - name: Upload the health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-report
          path: |
            target/health-report.md
            target/health-logs/

  # One report for the whole run. Every job above archives what it measured and
  # stops; a red stage is the normal reason those measurements exist, so the
  # collector runs whatever they concluded (`always()`) and states a missing
  # input rather than omitting the section.
  report:
    name: Quality report
    needs: [architecture, coverage-risk, health]
    if: always() && vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the run's artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: target/quality-artifacts

      - name: Assemble the report
        run: |
          just ci report --artifacts target/quality-artifacts \
            | tee target/quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-report
          path: target/quality-report.md
