name: Lanes

# The test lanes `.config/xtask.toml` declares that no gate runs. Each answers
# a question the workspace lane cannot: a resampler shape, a loom model, a
# regression suite, a browser.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      lane:
        description: one configured lane, or all of them
        required: false
        default: all
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The store the build-time audio assets are read from; see ci.yml.
  KITHARA_FIXTURE_CACHE: /cache/fixtures

# Heavy work: this asks for the whole fleet, so it queues with the other heavy
# lanes and takes its turn among them rather than beside them. A push is not
# behind that queue; see ci.yml.
concurrency:
  group: heavy-linux-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  # Which lanes this run is for, decided before any of them start.
  #
  # Selecting inside the lane job instead would skip the step and leave the job
  # green: a run scoped to one lane then reports every other lane as passing,
  # which is the opposite of what a lane exists to say. A lane that does not run
  # must produce no job at all.
  select:
    name: select lanes
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.pick.outputs.lanes }}
    steps:
      - name: Pick the lanes
        id: pick
        env:
          # Absent for `workflow_call`, which always means every lane.
          REQUESTED: ${{ github.event.inputs.lane }}
        run: |
          set -euo pipefail
          # These runners are containers with no output device, so the three
          # e2e lanes would fail on the machine rather than on the code.
          # `apple:e2e` serves them on hardware. A lane this fleet cannot run is
          # left out entirely, producing no job at all rather than a red one or
          # a skipped-but-green one.
          # `tooling`, `harness` and `fixtures` carry the tests `just test` no
          # longer runs: the build tooling and the harness the product tests are
          # written with. A push that touches their sources runs them straight
          # away (the `support` job in ci.yml); this is the unattended sweep that
          # catches a product change breaking them from the other side.
          configured='["broadcast","integration-regressions","network","loom","selenium-firefox","tooling","harness","fixtures"]'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = all ]; then
            echo "lanes=$configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A lane nobody configured would otherwise select nothing and report a
          # run that tested nothing as green.
          if ! echo "$configured" | jq -e --arg lane "$REQUESTED" 'index($lane)' >/dev/null; then
            echo "::error::no lane named '$REQUESTED'; configured lanes are $configured"
            exit 1
          fi
          printf 'lanes=%s\n' "$(jq -cn --arg lane "$REQUESTED" '[$lane]')" >> "$GITHUB_OUTPUT"

  lanes:
    name: ${{ matrix.lane }}
    needs: select
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 180
    strategy:
      # One red lane must not hide the others: this run exists to enumerate, so
      # a failure stops neither its siblings nor the report. It does count —
      # `continue-on-error` here additionally made the run green whatever the
      # lanes said, so the nightly report had nothing to key on.
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.select.outputs.lanes) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the lane
        env:
          LANE: ${{ matrix.lane }}
          # The network lanes build against real key servers. These are baked
          # at build time by kithara-app's build script, so they belong to the
          # build rather than to the test process. Absent, every other lane
          # compiles exactly as it did before (silent degrade); the network
          # lanes export KITHARA_DRM_REQUIRE below, which turns a missing
          # variable into a build error naming it instead of a runtime key
          # rejection.
          KITHARA_DRM_PROD_KEY: ${{ secrets.KITHARA_DRM_PROD_KEY }}
          KITHARA_DRM_PROD_AUTH_TOKEN: ${{ secrets.KITHARA_DRM_PROD_AUTH_TOKEN }}
          KITHARA_DRM_PROD_SP_ZV_TOKEN: ${{ secrets.KITHARA_DRM_PROD_SP_ZV_TOKEN }}
          KITHARA_DRM_STAGE_AUTH_TOKEN: ${{ secrets.KITHARA_DRM_STAGE_AUTH_TOKEN }}
        run: |
          if [[ "$LANE" == network* ]]; then
            export KITHARA_DRM_REQUIRE=1
          fi
          CARGO_TARGET_DIR="target-lane-$LANE" just test run "--lane=$LANE"
