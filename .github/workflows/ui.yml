name: UI

# UI tests are isolated from the general workspace suite: unit and integration
# targets, real GPU rendering, and host screenshots all run here. The main CI
# and nightly dispatcher call it when UI coverage is due.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: UI tests and host parity
    if: vars.KITHARA_GPU_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_GPU_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Named directly rather than through the role fan-out: this lane wants a
      # runner pool of its own, and `run.yml` schedules onto the one Linux pool
      # every other lane shares. `deep-ui` therefore claims no pipeline kind -
      # nothing selects it - and this is the one caller that runs it.
      - name: Run every UI test and photograph both hosts
        env:
          NEXTEST_RETRIES: "0"
        run: |
          KITHARA_HANG_DUMP_DIR=$(mktemp -d "${TMPDIR:?}/kithara-ui-hang.XXXXXX")
          export KITHARA_HANG_DUMP_DIR
          printf 'KITHARA_HANG_DUMP_DIR=%s\n' "$KITHARA_HANG_DUMP_DIR" >> "$GITHUB_ENV"
          just ci lane deep-ui --kind nightly

      - name: Upload UI hang evidence
        if: ${{ always() && env.KITHARA_HANG_DUMP_DIR != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hang-dumps-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KITHARA_HANG_DUMP_DIR }}
          if-no-files-found: ignore

      - name: Upload compiler-cache evidence
        if: ${{ always() && hashFiles(format('.ci-artifacts/cache/github-{0}-{1}-*.json', github.run_id, github.run_attempt)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/cache/github-${{ github.run_id }}-${{ github.run_attempt }}-*.json
          if-no-files-found: error

      - name: Upload both hosts, shipped studios, and difference masks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-parity
          path: target/parity
