name: Scheduled runs

# When the lanes run unattended. The lanes themselves are the same ones a
# maintainer can start by hand; this only decides when.
#
# A schedule belongs to whichever copy of the repository carries it, and this
# one is carried by every copy. What decides whether it does anything is the
# same thing that decides it for the lanes: a repository variable naming the
# runners that serve them. Where none is set, each job below is skipped before
# it starts a lane, so a copy without runners spends a scheduled run doing
# nothing rather than a machine's night doing nothing.
#
# Keeping it here rather than only in a copy that has runners means it is
# reviewed with the lanes it calls, and survives that copy being brought back
# in step with this one.
#
# A copy that does have runners must also let GitHub start it: scheduled
# workflows do not run in a fork until Actions is enabled there.
on:
  schedule:
    # The suite on a second architecture, nightly.
    - cron: '0 1 * * *'
    # The repeated run that turns "fails sometimes" into a rate.
    - cron: '0 3 * * *'
    # The RealtimeSanitizer soak.
    - cron: '0 5 * * *'
    # The suite on Windows, on an Android emulator, and on a graphics
    # device, on the machines that have them.
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    - cron: '30 4 * * *'
    # Miri, weekly: the interpreter is slow enough that a nightly run would
    # hold the machine for hours it owes to lanes that answer faster.
    - cron: '0 6 * * 0'
    # The repository's own analysis, and the lanes no gate runs.
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    # Weekly, because they cost hours: the deep assessment and the mutation
    # suites.
    - cron: '0 8 * * 6'
    - cron: '0 10 * * 6'
  workflow_dispatch:

jobs:
  suite:
    if: >-
      vars.KITHARA_RUNNER_LABELS != ''
      && (github.event.schedule == '0 1 * * *'
          || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/ci.yml

  stress:
    if: >-
      vars.KITHARA_STRESS_ENABLED == 'true'
      && vars.KITHARA_STRESS_RUNNER_LABELS != ''
      && github.event.schedule == '0 3 * * *'
    uses: ./.github/workflows/stress.yml

  rtsan:
    if: vars.KITHARA_RUNNER_LABELS != '' && github.event.schedule == '0 5 * * *'
    # The soak carries no queue of its own, because CI calls it too. Started
    # here it shares a machine with the stress campaign, so on a fork this call
    # waits for the campaign; elsewhere it names its own run and never waits.
    concurrency:
      group: ${{ github.event.repository.fork && format('fork-linux-{0}', github.repository) || format('scheduled-rtsan-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/rtsan.yml

  miri:
    if: vars.KITHARA_RUNNER_LABELS != '' && github.event.schedule == '0 6 * * 0'
    uses: ./.github/workflows/miri.yml

  windows:
    if: >-
      vars.KITHARA_WINDOWS_RUNNER_LABELS != ''
      && github.event.schedule == '0 23 * * *'
    uses: ./.github/workflows/windows.yml

  android:
    if: >-
      vars.KITHARA_ANDROID_RUNNER_LABELS != ''
      && github.event.schedule == '0 2 * * *'
    uses: ./.github/workflows/android.yml

  ui:
    if: >-
      vars.KITHARA_GPU_RUNNER_LABELS != ''
      && github.event.schedule == '30 4 * * *'
    uses: ./.github/workflows/ui.yml

  quality:
    if: vars.KITHARA_RUNNER_LABELS != '' && github.event.schedule == '0 20 * * *'
    uses: ./.github/workflows/quality.yml

  lanes:
    if: vars.KITHARA_RUNNER_LABELS != '' && github.event.schedule == '0 21 * * *'
    uses: ./.github/workflows/lanes.yml
    # A called workflow starts with none of the caller's secrets. The network
    # lane bakes real key-server credentials into the build and fails when one
    # is absent, so a scheduled run reports every one of them unset while the
    # same lane started by hand builds against them.
    secrets: inherit

  quality-deep:
    if: vars.KITHARA_RUNNER_LABELS != '' && github.event.schedule == '0 8 * * 6'
    uses: ./.github/workflows/quality.yml
    with:
      depth: deep

  mutants:
    if: vars.KITHARA_RUNNER_LABELS != '' && github.event.schedule == '0 10 * * 6'
    uses: ./.github/workflows/mutants.yml
