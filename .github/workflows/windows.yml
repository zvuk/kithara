name: Windows
run-name: ${{ (inputs.diagnostics || (inputs.test-filter || '') != '') && 'Windows diagnostics (not acceptance)' || 'Windows' }}

# Cross-compiling to MSVC answers whether the code builds on Windows. Whether
# it runs there is a question only a Windows machine answers.
on:
  workflow_call:
    secrets:
      KITHARA_DRM_PROD_KEY:
        required: false
      KITHARA_DRM_PROD_AUTH_TOKEN:
        required: false
      KITHARA_DRM_PROD_SP_ZV_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Capture native state and existing failure reports without running the acceptance suite.
        type: boolean
        default: false
      test-filter:
        description: Optional diagnostic Nextest filter. Its result does not qualify the full suite.
        type: string
        default: ""
      test-lane:
        description: Configured test lane for a nonempty diagnostic test-filter.
        type: string
        default: workspace
      test-load:
        description: Built-in kithara test CPU load for a nonempty diagnostic test-filter.
        type: choice
        options: ["off", "on"]
        default: "off"
      test-count:
        description: Positive finite repetition count for a nonempty diagnostic test-filter.
        type: number
        default: 1
      fixture-refresh:
        description: >-
          Comma-separated fixture names, or producing-function names, to
          produce again instead of reading from the store. Leave unset on
          ordinary runs and dispatch once with it set when a format change
          has to replace what the store already answers for.
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # What this run produces again rather than reads from the store; empty unless
  # the run was dispatched to refill it. The guest's store outlives every run,
  # so an entry it built wrong stays until a run names it here.
  KITHARA_FIXTURE_REFRESH: ${{ inputs.fixture-refresh }}
  # Where the encoded fixtures are built and reused. It is read when the
  # fixture crate is compiled, not when a test runs, so a lane that leaves it
  # unset fails to build rather than to find a file. The guest keeps it beside
  # the rest of the CI state it owns.
  KITHARA_FIXTURE_CACHE: C:\kithara-ci\fixtures
  # The guest is the only Windows machine, so its build directory is state it
  # keeps rather than something a lane claims on a shared root. A checkout is
  # wiped on every run, so leaving this unset rebuilt the workspace - the part
  # of this lane that costs hours - from source each time.
  CARGO_TARGET_DIR: C:\kithara-ci\target
  # xtask builds itself before the first phase. Left unset, that build lands
  # in the checkout and is wiped with it, so every run compiled xtask from
  # source before the cache check could start. Beside the workspace build it
  # is reused, where Linux runners keep it too, and the job leases it for as
  # long as xtask runs.
  KITHARA_XTASK_TARGET: C:\kithara-ci\target\xtask

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Suite on Windows
    # Set only where a Windows runner is attached, so a copy of this repository
    # without one never starts the job. See .github/workflows/ci.yml.
    if: >-
      vars.KITHARA_WINDOWS_RUNNER_LABELS != '' && github.actor == github.repository_owner
      && !inputs.diagnostics && (inputs.test-filter || '') == ''
    runs-on: ${{ fromJSON(vars.KITHARA_WINDOWS_RUNNER_LABELS) }}
    timeout-minutes: 180

    steps:
      - name: Inspect bootstrap storage
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Root, Used, Free | Format-Table -AutoSize
          $buildProcesses = @(Get-Process -Name cargo, rustc, link, xtask, ci-bootstrap, cargo-nextest -ErrorAction SilentlyContinue)
          Write-Output ("Active build processes: {0}" -f $buildProcesses.Count)
          $buildProcesses | Select-Object ProcessName, Id | Format-Table -AutoSize

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify independent RustFS cache reuse
        run: just ci cache-verify

      # The guest carries the toolchain and says where its libraries are in
      # its own environment, so this installs and sets nothing.
      - name: Check the workspace
        env:
          KITHARA_DRM_PROD_KEY: ${{ secrets.KITHARA_DRM_PROD_KEY }}
          KITHARA_DRM_PROD_AUTH_TOKEN: ${{ secrets.KITHARA_DRM_PROD_AUTH_TOKEN }}
          KITHARA_DRM_PROD_SP_ZV_TOKEN: ${{ secrets.KITHARA_DRM_PROD_SP_ZV_TOKEN }}
        run: just ci cache-exec windows-check just check

      # The default backend is `wreq`, which the Apple desktop app ships and
      # Windows does not. Asking for it here builds BoringSSL through cmake,
      # which the guest has no more than it has the product that would use it,
      # so the lane names the backend the platform actually carries.
      - name: Run tests
        env:
          KITHARA_HANG_DUMP_DIR: ${{ runner.temp }}/kithara-windows-hang
          KITHARA_DRM_PROD_KEY: ${{ secrets.KITHARA_DRM_PROD_KEY }}
          KITHARA_DRM_PROD_AUTH_TOKEN: ${{ secrets.KITHARA_DRM_PROD_AUTH_TOKEN }}
          KITHARA_DRM_PROD_SP_ZV_TOKEN: ${{ secrets.KITHARA_DRM_PROD_SP_ZV_TOKEN }}
        run: just ci cache-exec windows-test just test run --net-backend=none

      - name: Upload compiler-cache evidence
        if: ${{ always() && hashFiles(format('.ci-artifacts/cache/github-{0}-{1}-*.json', github.run_id, github.run_attempt)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/cache/github-${{ github.run_id }}-${{ github.run_attempt }}-*.json
          if-no-files-found: error

      - name: Upload Windows hang evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-hang-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kithara-windows-hang
          if-no-files-found: warn

  diagnostics:
    name: Windows diagnostics
    if: >-
      vars.KITHARA_WINDOWS_RUNNER_LABELS != '' && github.actor == github.repository_owner
      && (inputs.diagnostics || (inputs.test-filter || '') != '')
    runs-on: ${{ fromJSON(vars.KITHARA_WINDOWS_RUNNER_LABELS) }}
    timeout-minutes: 180
    env:
      TEST_FILTER: ${{ inputs.test-filter || '' }}
      TEST_LANE: ${{ inputs.test-lane }}
      TEST_LOAD: ${{ inputs.test-load }}
      TEST_COUNT: ${{ inputs.test-count }}
    steps:
      - name: Checkout diagnostics controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostics-controller
          persist-credentials: false

      # Cargo must not inherit overrides from the retained checkout.
      - name: Isolate diagnostics Cargo workspace
        run: >-
          [System.IO.Directory]::Move("$env:GITHUB_WORKSPACE/diagnostics-controller", "$env:RUNNER_TEMP/windows-diagnostics-controller")

      - name: Capture existing Windows evidence
        working-directory: ${{ runner.temp }}/windows-diagnostics-controller
        run: just ci windows-diagnostics --output "$env:RUNNER_TEMP/windows-diagnostics"

      - name: Preserve existing Windows evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-before-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-diagnostics
          if-no-files-found: error

      - name: Verify probe compiler cache
        if: ${{ (inputs.test-filter || '') != '' }}
        working-directory: ${{ runner.temp }}/windows-diagnostics-controller
        run: just ci cache-verify

      - name: Run diagnostic test selection
        if: ${{ (inputs.test-filter || '') != '' }}
        working-directory: ${{ runner.temp }}/windows-diagnostics-controller
        env:
          RUST_LOG: kithara_test_utils::load=info,kithara_storage=info
          NEXTEST_SUCCESS_OUTPUT: immediate
          KITHARA_FLASH_SYNC_TRACE: "1"
          KITHARA_HANG_DUMP_DIR: ${{ runner.temp }}/windows-diagnostics/probe-hang
        run: >-
          just ci cache-exec windows-diagnostic just test run --net-backend=none "--narrow=$env:TEST_FILTER"
          "--lane=$env:TEST_LANE" "--load=$env:TEST_LOAD" "--stress-count=$env:TEST_COUNT" --profile=ci --retries=0

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-diagnostics
            ${{ runner.temp }}/windows-diagnostics-controller/target/nextest/ci/junit.xml
            ${{ runner.temp }}/windows-diagnostics-controller/.ci-artifacts/cache/github-${{ github.run_id }}-${{ github.run_attempt }}-*.json
          if-no-files-found: error
