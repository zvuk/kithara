name: Host

# The toolchain-image operation prepares a reviewed Linux image. Full
# provisioning rolls merged configuration onto the host's services and runners.
#
# Opt-in on purpose: nothing here belongs on a push. It writes to the machine,
# a rebuilt toolchain image costs half an hour, and most merges change nothing
# the host holds. Start it by hand after a change to `.config/ci-pins.toml`,
# to a `docker/*.Dockerfile`, or to the host commands themselves.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Provision this host or build only its Linux CI toolchain image.
        type: choice
        options: [provision, toolchain-image]
        default: provision

# The host serves one provisioning pass at a time. A second would rebuild the
# images the first is installing services against.
concurrency:
  group: host-provision-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provision:
    name: provision
    # The machine itself, not one of the throwaway runner containers: a
    # container has neither the Docker daemon that holds the images nor the
    # systemd that owns the units. One non-ephemeral runner lives on the host
    # and serves only this.
    if: vars.KITHARA_HOST_RUNNER_LABEL != ''
    runs-on: ${{ vars.KITHARA_HOST_RUNNER_LABEL }}
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision this machine
        if: ${{ inputs.operation == 'provision' }}
        run: just ci host provision

      - name: Build the Linux CI toolchain image
        if: ${{ inputs.operation == 'toolchain-image' }}
        run: just ci host linux image toolchain
