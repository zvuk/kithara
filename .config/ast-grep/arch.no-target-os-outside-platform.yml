id: arch.no-target-os-outside-platform
message: |
  Target-dependent behavior outside its platform owner. Move the implementation
  into `kithara-platform` or its owning Android/FFI adapter and expose a stable
  interface. Android/FFI module roots allow only the declared structural ABI wiring.
severity: warning
language: Rust
files:
  - crates/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  # The platform primitive owner is the scope boundary of this rule.
  - "crates/kithara-platform/src/**"
  # These paths are checked by the item-specific branches below, under the same report category.
  - "crates/kithara-android/src/lib.rs"
  - "crates/kithara-ffi/src/lib.rs"
  - "crates/kithara-ffi/src/native/mod.rs"
rule:
  all:
    - pattern: "#[cfg($$$)]"
    - has:
        kind: identifier
        regex: "^target_(os|arch)$"
        stopBy: end

---
id: arch.no-target-os-outside-platform.android-root
metadata:
  category: arch.no-target-os-outside-platform
message: |
  Target-dependent behavior outside its platform owner. Move the implementation
  into `kithara-platform` or its owning Android/FFI adapter and expose a stable
  interface. Android/FFI module roots allow only the declared structural ABI wiring.
severity: warning
language: Rust
files:
  - crates/kithara-android/src/lib.rs
rule:
  all:
    - pattern: "#[cfg($$$)]"
    - has:
        kind: identifier
        regex: "^target_(os|arch)$"
        stopBy: end
    - not:
        all:
          - inside:
              kind: source_file
          - pattern: '#[cfg(target_os = "android")]'
          - precedes:
              all:
                - any:
                    - pattern: "mod buffer;"
                    - pattern: "mod http;"
                    - pattern: "pub mod media;"
                    - pattern: "mod method;"
                - not:
                    follows:
                      all:
                        - kind: attribute_item
                        - has:
                            kind: identifier
                            regex: "^path$"
                            stopBy: end
                      stopBy:
                        not:
                          any:
                            - kind: attribute_item
                            - kind: line_comment
                            - kind: block_comment
              stopBy:
                not:
                  any:
                    - kind: attribute_item
                    - kind: line_comment
                    - kind: block_comment

---
id: arch.no-target-os-outside-platform.ffi-root
metadata:
  category: arch.no-target-os-outside-platform
message: |
  Target-dependent behavior outside its platform owner. Move the implementation
  into `kithara-platform` or its owning Android/FFI adapter and expose a stable
  interface. Android/FFI module roots allow only the declared structural ABI wiring.
severity: warning
language: Rust
files:
  - crates/kithara-ffi/src/lib.rs
rule:
  all:
    - pattern: "#[cfg($$$)]"
    - has:
        kind: identifier
        regex: "^target_(os|arch)$"
        stopBy: end
    - not:
        all:
          - inside:
              kind: source_file
          - any:
              - all:
                  - pattern: '#[cfg(not(target_arch = "wasm32"))]'
                  - precedes:
                      all:
                        - any:
                            - pattern: "mod native;"
                            - pattern: "pub(crate) use core::registry;"
                            - pattern: "pub(crate) use native::{EventBridge, FFI_RUNTIME, Inner, Router};"
                            - pattern: "pub use native::{asset, cipher, config, logging, salt};"
                        - not:
                            follows:
                              all:
                                - kind: attribute_item
                                - has:
                                    kind: identifier
                                    regex: "^path$"
                                    stopBy: end
                              stopBy:
                                not:
                                  any:
                                    - kind: attribute_item
                                    - kind: line_comment
                                    - kind: block_comment
                      stopBy:
                        not:
                          any:
                            - kind: attribute_item
                            - kind: line_comment
                            - kind: block_comment
              - all:
                  - pattern: '#[cfg(target_arch = "wasm32")]'
                  - precedes:
                      all:
                        - any:
                            - pattern: "pub mod web;"
                            - pattern: "pub(crate) use web::inner::Inner;"
                        - not:
                            follows:
                              all:
                                - kind: attribute_item
                                - has:
                                    kind: identifier
                                    regex: "^path$"
                                    stopBy: end
                              stopBy:
                                not:
                                  any:
                                    - kind: attribute_item
                                    - kind: line_comment
                                    - kind: block_comment
                      stopBy:
                        not:
                          any:
                            - kind: attribute_item
                            - kind: line_comment
                            - kind: block_comment
              - all:
                  - pattern: '#[cfg(all(feature = "uniffi", not(target_arch = "wasm32")))]'
                  - precedes:
                      all:
                        - any:
                            - pattern: "uniffi::setup_scaffolding!();"
                            - pattern: "use kithara::events::TrackId;"
                            - pattern: "uniffi::custom_type!(TrackId, u64, { remote });"
                        - not:
                            follows:
                              all:
                                - kind: attribute_item
                                - has:
                                    kind: identifier
                                    regex: "^path$"
                                    stopBy: end
                              stopBy:
                                not:
                                  any:
                                    - kind: attribute_item
                                    - kind: line_comment
                                    - kind: block_comment
                      stopBy:
                        not:
                          any:
                            - kind: attribute_item
                            - kind: line_comment
                            - kind: block_comment

