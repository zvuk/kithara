id: perf.no-local-test-pools
message: |
  Test harnesses use `kithara_test_utils::bufpool::TestPools` so composed
  subsystems share one application-shaped pool facade. Do not declare or
  load a crate-local `TestPools` schema or construct its region locally.
severity: error
language: Rust
files:
  - crates/**/*.rs
  - tests/src/**/*.rs
ignores:
  - crates/kithara-bufpool/**
  - crates/kithara-test-utils/src/bufpool.rs
  - crates/kithara-devtools/**
utils:
  pool-derive:
    kind: attribute_item
    regex: '^#\[\s*derive\s*\([^\]]*\bPool\s*[,)]'
  pool-schema:
    kind: struct_item
    any:
      - follows:
          matches: pool-derive
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
                - kind: block_comment
      - has:
          kind: field_declaration
          regex: '\bPoolSlot\s*<'
          stopBy: end
rule:
  any:
    - all:
        - matches: pool-schema
        - has:
            field: name
            regex: '^TestPools$'
    - all:
        - kind: mod_item
        - regex: '\bmod\s+test_pools\s*;'
    - all:
        - kind: call_expression
        - regex: '(?:^|::)TestPools::region\s*\('
