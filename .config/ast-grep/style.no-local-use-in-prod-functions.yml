id: style.no-local-use-in-prod-functions
message: |
  Move `use` imports to file top. A target-gated function may keep its import
  local so the same `target_arch` / `target_os` condition is not duplicated at
  module scope.
severity: warning
language: Rust
files:
  - crates/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  all:
    - kind: use_declaration
    - inside:
        kind: function_item
        stopBy: end
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: "target_(arch|os)"
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b|^#\[test\]$|kithara::test'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
