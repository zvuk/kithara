id: idioms.match-self-conversion
message: |
  A `match self` method constructs an owned result in at least one arm.
  Express the conversion as `From` for the receiver type so callers can use
  `.into()` and the type system can chain conversions. Plain field projections
  such as `id`, `*id`, or `self.id` are accessors and are not reported.

      // ❌
      impl Codec {
          pub fn container(self) -> ContainerFormat {
              match self { Self::Mp3 => ContainerFormat::MpegAudio, Self::Aac => ContainerFormat::Mp4 }
          }
      }

      // ✅
      impl From<Codec> for ContainerFormat {
          fn from(c: Codec) -> Self {
              match c { Codec::Mp3 => Self::MpegAudio, Codec::Aac => Self::Mp4 }
          }
      }
severity: error
language: Rust
files:
  - crates/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  all:
    - any:
        - pattern: |
            fn $NAME(self) -> $RET {
                match self { $$$ARMS }
            }
        - pattern: |
            fn $NAME(&self) -> $RET {
                match self { $$$ARMS }
            }
        - pattern: |
            pub fn $NAME(self) -> $RET {
                match self { $$$ARMS }
            }
        - pattern: |
            pub fn $NAME(&self) -> $RET {
                match self { $$$ARMS }
            }
        - pattern: |
            pub(crate) fn $NAME(self) -> $RET {
                match self { $$$ARMS }
            }
        - pattern: |
            pub(crate) fn $NAME(&self) -> $RET {
                match self { $$$ARMS }
            }
    # At least one arm must BUILD a value rather than hand back a name the arm
    # pattern bound. Constructing (a path, a call, a macro, a struct literal, a
    # plain literal) is a conversion; `id` / `*id` / `self.id` is a projection,
    # and a projection over an enum has no `From` to become.
    - has:
        kind: match_arm
        stopBy: end
        has:
          field: value
          any:
            - kind: scoped_identifier
            - kind: call_expression
            - kind: macro_invocation
            - kind: struct_expression
            - kind: boolean_literal
            - kind: char_literal
            - kind: float_literal
            - kind: integer_literal
            - kind: string_literal
constraints:
  RET:
    not:
      # `Self` returns are already idiomatic; reference returns (`&T`,
      # `Option<&T>`, ...) are borrowed accessors rather than owned
      # conversions.
      regex: "Self|&"
