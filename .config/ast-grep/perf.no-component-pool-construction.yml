id: perf.no-component-pool-construction
message: |
  Declaring or constructing a typed buffer-pool region outside its composition
  owner creates a second owner and bypasses the shared hard budget. Only
  `crates/kithara-app/src/pools.rs`, `crates/kithara-ffi/src/pools.rs`, and the
  `kithara-ui-draw` draw-buffer facade own production schemas and region
  construction. Components receive the existing facade and acquire registered
  buffers with `get::<K>()` or `get_with_len::<K>()`. Schema builders are
  private to their declaring module; manual `HasPool` implementations are
  rejected by `perf.no-manual-pool-registration`.
severity: error
language: Rust
files:
  - crates/kithara/src/**/*.rs
  - crates/kithara-*/src/**/*.rs
ignores:
  - crates/kithara-bufpool/**
  # The draw buffer family's own home, the same exemption `kithara-bufpool` has:
  # `DrawBuffers` is the facade a UI host injects through `UiConfig`, so its
  # constructor is the owner site, not a component reaching for storage.
  - crates/kithara-ui-draw/src/draw/pool/**
  - crates/kithara-devtools/**
  - crates/kithara-test-fixtures/**
  - crates/kithara-test-macros/**
  - crates/kithara-test-utils/**
  - crates/kithara-workspace-hack/**
  - crates/kithara-app/src/pools.rs
  - crates/kithara-ffi/src/pools.rs
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - crates/kithara-host/src/session/testing.rs
  - crates/kithara-play/src/session/testing.rs
  - "**/benches/**"
rule:
  all:
    - any:
        - all:
            - kind: macro_invocation
            - regex: '(?:^|::)pool_schema!\s*(?:\{|\(|\[)'
        - all:
            - kind: use_declaration
            - regex: '\bpool_schema\s+as\s+'
        - all:
            - kind: call_expression
            - regex: '::__build(?:_region)?\s*\('
        - all:
            - kind: call_expression
            - regex: '(?:^|::)(?:AppPools|FfiPools)::builder\s*\('
    - not:
        follows:
          kind: attribute_item
          regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
          stopBy:
            not:
              kind: attribute_item
    - not:
        inside:
          all:
            - kind: expression_statement
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b|^#\[test\]$|kithara::test'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: impl_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
