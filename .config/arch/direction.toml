# Crate-level layered architecture.
# Lower-layer crates may not transitively depend on higher-layer crates.
# Layers are derived from the actual `cargo metadata` graph; any change to
# real dependencies that contradicts this file is a violation.

[[layer]]
index = 0
name = "foundation"
crates = ["kithara-workspace-hack"]

[[layer]]
index = 1
name = "platform"
crates = ["kithara-platform"]

[[layer]]
index = 2
name = "infra"
crates = [
  "kithara-blob",
  "kithara-bufpool",
  "kithara-drm",
  "kithara-events",
  "kithara-net",
  "kithara-ring",
  "kithara-signal",
  "kithara-ui-capture",
  "kithara-ui-draw",
  "kithara-ui-input",
  "kithara-ui-lottie",
  "kithara-ui-shaping",
]

[[layer]]
index = 3
name = "services"
crates = ["kithara-abr", "kithara-storage", "kithara-test-utils"]

[[layer]]
index = 4
name = "core"
crates = ["kithara-assets", "kithara-download", "kithara-stream"]

[[layer]]
index = 5
name = "protocols"
crates = ["kithara-decode", "kithara-encode", "kithara-file", "kithara-hls"]

[[layer]]
index = 6
name = "engine"
crates = ["kithara-audio", "kithara-effects", "kithara-warp"]

[[layer]]
index = 7
name = "sync"
crates = ["kithara-sync"]

[[layer]]
index = 8
name = "playback"
crates = ["kithara-analysis", "kithara-play"]

[[layer]]
index = 9
name = "queue"
crates = ["kithara-queue"]

[[layer]]
index = 10
name = "ui"
crates = ["kithara-ui"]

[[layer]]
index = 11
name = "facade"
crates = ["kithara"]

[[layer]]
index = 12
name = "apps"
crates = ["kithara-app", "kithara-ffi"]

# Transitional edges that must shrink to zero. Format: "from -> to" = "reason".
[exemptions]
