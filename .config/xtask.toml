# Project-specific identity and per-tool settings for the reusable xtask.
# The xtask code carries no project names; everything here is what a new
# project edits to adopt it.

[project]
name = "kithara"

[workspace-scan]
# Cargo build output can also live below an individual crate (for example the
# multi-target FFI builds). Generated bindings are not workspace source.
exclude = ["target/**", "**/target/**"]

[architecture.filters]
exclude_crates = [
  "kithara-devtools",
  "kithara-fuzz",
  "kithara-integration-tests",
  "kithara-test-*",
  "kithara-workspace-hack",
  "xtask",
]
exclude_modules = ["*::tests"]

[[architecture.runtime.scenarios]]
name = "queue-playback"
command = "test"
package = "kithara-integration-tests"
test = "suite_light"
filter = "kithara_queue::architecture_flow::queue_playback_architecture"
ignored = true
timeout_secs = 120

[audit_clippy]
lints = [
  "redundant_clone",
  "needless_collect",
  "iter_with_drain",
  "drain_collect",
  "iter_overeager_cloned",
  "collection_is_never_read",
  "assigning_clones",
  "unnecessary_to_owned",
  "inefficient_to_string",
  "implicit_clone",
  "format_push_string",
  "format_collect",
  "redundant_allocation",
  "box_collection",
  "rc_buffer",
  "large_enum_variant",
  "large_types_passed_by_value",
  "large_stack_arrays",
  "result_large_err",
  "stable_sort_primitive",
  "unnecessary_box_returns",
  "zero_sized_map_values",
  "map_entry",
  "await_holding_lock",
  "await_holding_refcell_ref",
  "significant_drop_in_scrutinee",
  "needless_pass_by_ref_mut",
  "readonly_write_lock",
  "mutex_integer",
  "mutex_atomic",
  "suboptimal_flops",
  "imprecise_flops",
  "naive_bytecount",
  "map_flatten",
  "string_lit_as_bytes",
  "unused_peekable",
  "unnecessary_struct_initialization",
  "path_buf_push_overwrite",
  "single_char_pattern",
  "manual_memcpy",
  "slow_vector_initialization",
  "useless_vec",
  "missing_const_for_fn",
]

[ci_report]
# How much of each measurement `just ci report` inlines before it sends the
# reader to the artifact it came from. The CRAP table runs to five figures of
# lines against a step summary capped at a megabyte, so it is carried worst
# first and cut; the artifact keeps all of it.
crap_rows = 120
top_contours = 10

[health]
# Crates excluded from `cargo hack --feature-powerset` (too many features).
feature_powerset_exclude = ["kithara-play", "kithara-app", "kithara-fuzz"]
# The package whose public API is a contract outside this workspace: the facade
# a consumer depends on. Internal crates are free to break (AGENTS.md says so)
# and nothing here is published, so a workspace-wide comparison would report
# churn the project has already decided it allows — and it would not finish:
# cargo-semver-checks builds every package in its own target directory and
# rebuilds that package's whole dependency tree there, roughly 1.8 GB and a cold
# build each, once for the branch and once for the baseline. kithara-ffi is left
# out on purpose: what its consumers bind is generated by UniFFI and wasm-bindgen
# from that surface, so a rustdoc comparison is not where a break would show.
semver_packages = ["kithara"]
# Root of the unsafe-code census. A dependency tree has a root and the workspace
# manifest is virtual, so this names the package whose closure is the product's.
geiger_package = "kithara"
# `cargo hakari` writes kithara-workspace-hack's dependencies to unify features
# across the workspace; the crate has no code and is never meant to use them, so
# machete reports every one of them and the stage can only ever be red. It takes
# no exclude flag, so the stage names the packages to walk instead, and this is
# what it leaves out.
machete_exclude = ["kithara-workspace-hack"]
# Members whose deadlock findings this stage reports without failing on.
# Dependencies need no entry: the verdict only ever judges this workspace's own
# crates, so a bug in tokio is already out of it. What is listed is the scaffold
# — build tooling, the harness, the generated hack crate — which `cargo lockbud
# --workspace` compiles and reports on like any other member, and which is not
# the product a deadlock verdict is about. The same set is named in
# `[architecture.filters] exclude_crates`, per stage, the way every other
# `[health]` list is. Product crates are not listed: kithara-storage's 8
# `possibly` double locks fail the stage until that code is fixed.
lockbud_exclude = [
  "kithara-devtools",
  "kithara-fuzz",
  "kithara-integration-tests",
  "kithara-test-macros",
  "kithara-test-utils",
  "kithara-workspace-hack",
  "xtask",
]

# Groups a crate refuses to be built without, and says so with compile_error!.
# A crate is matched by declaring `when_feature`, so these follow the workspace
# instead of naming crates twice. A crate carrying two of them gets both in one
# invocation: meeting one while leaving the other empty still builds nothing.

[[health.feature_invariants]]
when_feature = "client-reqwest"
at_least_one_of = [
  [
    "client-reqwest",
    "client-wreq",
  ],
  [
    "tls-rustls",
    "tls-native",
  ],
]

[[health.feature_invariants]]
when_feature = "stretch-signalsmith"
at_least_one_of = [["stretch-signalsmith", "stretch-bungee"]]

# `ffmpeg` names only kithara-encode. Without an encode backend the crate
# encodes nothing and says so with compile_error!, so the empty combination is
# not a build to check.
[[health.feature_invariants]]
when_feature = "ffmpeg"
at_least_one_of = [["ffmpeg", "fdk-aac"]]

# Forced rather than chosen: apple, android and webcodecs are gated on
# target_os as well as on their feature, so off those targets symphonia is the
# only backend whose variant survives and there is nothing to choose between.
# The platform lanes cover the hardware shapes.
[[health.feature_invariants]]
when_feature = "symphonia"
always = ["symphonia"]

# Same shape, one layer down: kithara-play refuses a non-wasm build without an
# output backend, and cpal is the only one off wasm — backend-web-audio is a
# browser API. Every crate that forwards the choice inherits the refusal.
[[health.feature_invariants]]
when_feature = "backend-cpal"
always = ["backend-cpal"]

[stress]
# One run, both clocks. The first collapses the fixtures' artificial
# delays and is fast; the second keeps them and is the only one where a defect
# decided by the order requests are served in can reproduce at all.
default_modes = [
  "reproduction-flash-on",
  "reproduction-flash-off",
  "reproduction-no-block",
  "rtsan",
  "rtsan-file",
  "rtsan-hls",
]
lane = "workspace"
backend = "wreq"
nextest_config = ".config/nextest.toml"
nextest_profile = "stress"
default_filter = "all()"
default_count = 50
max_count = 100
test_threads = "num-cpus"
max_test_threads = 256
# A directory of this run's own, inside the checkout it builds. Sharing the
# machine's target directory cost five runs a whole lane: something else on the
# host cleared it hours in, and every remaining repeat failed to exec in
# milliseconds. The price is one cold build per run.
build_dir = "target-stress"
raw_output = "target/stress"
report_output = "target/stress-report.md"
workflow_job_timeout_minutes = 1380

[stress.artifacts]
attempts = "attempts.json"
subject_junit = "target/nextest/stress/junit.xml"
inventory = "inventory.json"
junit = "junit.xml"
log = "nextest.log"
manifest = "manifest.json"
pressure = "pressure.jsonl"
report = "stress-report.md"
envelope_dir = "hang"
line_log = "no-block.log"

[stress.environment]
remove = [
  "KITHARA_FLASH_SYNC_BT",
  "KITHARA_FLASH_SYNC_TRACE",
  "KITHARA_HANG_DUMP_DIR",
  "KITHARA_HANG_PREKILL_SECS",
  "KITHARA_NO_BLOCK",
  "KITHARA_NO_BLOCK_BUDGET_MS",
  "KITHARA_NO_BLOCK_LOG",
  "KITHARA_STRESS_REPEATS",
  "NEXTEST_FINAL_STATUS_LEVEL",
  "NEXTEST_SHOW_PROGRESS",
  "NEXTEST_STATUS_LEVEL",
  "RUST_BACKTRACE",
  "RUST_LOG",
]

[stress.evidence]
envelope_schema = "kithara.hang.v1"
envelope_marker = "[kithara_hang_detector]"
envelope_text_field = "flash"
envelope_suffix_markers = [" payload=", " \u2014 "]
line_marker = "[no_block]"
dump_marker = "[flash hang dump]"
primitive_marker = "created_at="
holder_marker = "held by"
wait_marker = "WAITING:"
# `pace_anchor=` selects the engine's own counter line, the causal one in a
# flash hang dump: `real_io` and `pace_anchor` together say whether virtual time
# was advancing while real work was in flight. It is neither a holder nor a
# waiter, so only this list can carry it into a section — without it the report
# named who held quiescence but never why the clock moved, and reading that
# meant opening the raw dump by hand.
direct_markers = [
  "active_async holder",
  "active holder thread=",
  "engine core lock held",
  "pace_anchor=",
  "BRIDGED sync wait",
  "state lock held",
]
source_excludes = ["kithara-test-macros/", "kithara-test-utils/src/test/"]

[stress.modes.reproduction-flash-on]
features = ["flash"]

# Reproduction lanes set no RUST_LOG: a run-wide one used to override the
# per-test `tracing(...)` annotations and silence exactly the verdict lines the
# annotated flaky tests were given (`setup_tracing_with_filter` now merges the
# two, keeping the wider level per target). Unannotated tests keep the "warn"
# default from `setup_tracing`.
#
# `KITHARA_FLASH_SYNC_TRACE` is on in every reproduction lane, not just the
# diagnostic ones: `flash::diag` reads it once and caches, so with it off every
# primitive carries `meta = None` and the hang dump cannot name a holder or a
# waiter — the dump degrades to "something is stuck" in exactly the lanes a
# stress run actually repeats. `KITHARA_FLASH_SYNC_BT` stays out: measured at
# count=50 it inflates JUnit past the 512 MiB artifact limit, and it has its own
# lane for when a stack is worth that price.
[stress.modes.reproduction-flash-on.set_env]
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"

[stress.modes.reproduction-flash-on.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"

# The same run on real clocks. Flash collapses the fixtures' artificial
# delays, so a defect that shows itself as "the needed request queued behind an
# unneeded one" cannot reproduce under it: at zero real delay the order of
# service does not change the outcome. Loader priorities, stale-fetch
# cancellation, and everything else decided by ORDER are invisible to the lane
# above, however many times it repeats.
[stress.modes.reproduction-flash-off]
features = []

[stress.modes.reproduction-flash-off.set_env]
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"

[stress.modes.reproduction-flash-off.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"

# The async contract, measured with the same repetition as the flakes. The
# blocking census reports a call that parks inside an async poll, which is a
# defect whether or not a test fails on the attempt that carried it — and a
# run that repeats every test fifty times is exactly what walks the paths
# where such a call hides. It rides the virtual clock because the census
# measures poll duration, and a real clock's scheduling noise would report the
# machine's load as the code's fault.
[stress.modes.reproduction-no-block]
features = ["flash", "no-block"]

[stress.modes.reproduction-no-block.set_env]
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
KITHARA_NO_BLOCK = "census"
KITHARA_NO_BLOCK_BUDGET_MS = "100"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"

[stress.modes.reproduction-no-block.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"
KITHARA_NO_BLOCK_LOG = "no-block.log"

# The real-time contract, measured the same way. They belong in the run
# because the violation is intermittent: one was seen firing on a single attempt
# out of two, which a gate that runs each lane once reports as green half the
# time. Their own recipes own the sanitizer flags, the pinned nightly and
# `-Zbuild-std`, which is why these lanes name a command instead of a feature set.
#
# `owns_repeats` is what stops the run from launching that command once per
# repeat. The recipes run under nextest, so handing them the count builds the
# suite once and lands every repeat in one report with a per-test verdict —
# measured the same way as the lanes above, and comparable with them. Launched per
# repeat instead, each one paid a rebuild and a cold start and could report only
# an exit code, which names no test.
#
# `attempt_junit` is that report. The runner overwrites the one path, so the lane
# keeps its own copy.
[stress.modes.rtsan]
attempt_junit = "target/nextest/rtsan/junit.xml"
command = ["just", "test", "rtsan"]
owns_repeats = true

[stress.modes.rtsan-file]
attempt_junit = "target/nextest/rtsan/junit.xml"
command = ["just", "test", "rtsan-file"]
owns_repeats = true

[stress.modes.rtsan-hls]
attempt_junit = "target/nextest/rtsan/junit.xml"
command = ["just", "test", "rtsan-hls"]
owns_repeats = true

[stress.modes.diagnostic]
features = ["flash"]

[stress.modes.diagnostic.set_env]
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"
RUST_LOG = "warn,flash::hang=debug,kithara_platform::no_block=debug,kithara_queue=debug,kithara_hls=debug,kithara_stream=debug,kithara_net=debug,kithara_audio=debug"

[stress.modes.diagnostic.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"

[stress.modes.diagnostic-no-block]
features = ["flash", "no-block"]

[stress.modes.diagnostic-no-block.set_env]
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
KITHARA_NO_BLOCK = "census"
KITHARA_NO_BLOCK_BUDGET_MS = "100"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"
RUST_LOG = "warn,flash::hang=debug,kithara_platform::no_block=debug,kithara_queue=debug,kithara_hls=debug,kithara_stream=debug,kithara_net=debug,kithara_audio=debug"

[stress.modes.diagnostic-no-block.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"
KITHARA_NO_BLOCK_LOG = "no-block.log"

[stress.modes.diagnostic-backtrace]
features = ["flash"]

[stress.modes.diagnostic-backtrace.set_env]
KITHARA_FLASH_SYNC_BT = "1"
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"
RUST_LOG = "warn,flash::hang=debug,kithara_platform::no_block=debug,kithara_queue=debug,kithara_hls=debug,kithara_stream=debug,kithara_net=debug,kithara_audio=debug"

[stress.modes.diagnostic-backtrace.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"

[stress.modes.diagnostic-full]
features = ["flash", "no-block"]

[stress.modes.diagnostic-full.set_env]
KITHARA_FLASH_SYNC_BT = "1"
KITHARA_FLASH_SYNC_TRACE = "1"
KITHARA_HANG_PREKILL_SECS = "630"
KITHARA_NO_BLOCK = "census"
KITHARA_NO_BLOCK_BUDGET_MS = "100"
NEXTEST_FINAL_STATUS_LEVEL = "fail"
NEXTEST_SHOW_PROGRESS = "counter"
NEXTEST_STATUS_LEVEL = "fail"
RUST_BACKTRACE = "1"
RUST_LOG = "warn,flash::hang=debug,kithara_platform::no_block=debug,kithara_queue=debug,kithara_hls=debug,kithara_stream=debug,kithara_net=debug,kithara_audio=debug"

[stress.modes.diagnostic-full.raw_path_env]
KITHARA_HANG_DUMP_DIR = "hang"
KITHARA_NO_BLOCK_LOG = "no-block.log"

[test]
default_lane = "workspace"
default_backend = "wreq"
feature_arg = "--features"
loom_lane = "loom"
# Base features applied to every test lane, including `--flash=off`.
features = []

[test.flash]
default = true
features = ["flash"]

[test.no_block]
default = false
features = ["no-block"]

[test.net_backends.wreq]
features = []

[test.net_backends.apple]
features = ["kithara-integration-tests/apple-net"]

# The product suite. What it excludes is not product: `kithara-devtools` and
# `xtask` are the build tooling, `kithara-test-utils` and `kithara-test-macros`
# are the harness the product tests are written with. Excluded at cargo level
# rather than filtered, so they are not compiled either — a filter would still
# pay for building and linking them. Neither depends on a product crate, so
# nothing product-side leaves with them.
#
# The remaining support targets live inside product crates and cannot be dropped
# here without taking product tests along; `default-filter` in
# `.config/nextest.toml` removes those. The lanes below run all of it.
#
# Returning a crate to this suite is one edit: drop its `--exclude` pair.
[test.lanes.workspace]
program = "cargo"
default_features = ["kithara-ui/render"]
prefix_args = [
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "kithara-fuzz",
  "--exclude",
  "kithara-devtools",
  "--exclude",
  "xtask",
  "--exclude",
  "kithara-test-utils",
  "--exclude",
  "kithara-test-macros",
  "--cargo-profile",
  "test-release",
]

# The build tooling: lint and architecture checks, similarity, viz, quality
# assessment, release and publish, the platform commands, the xtask self-cache,
# and the generators that write the CI pipelines. None of it ships.
[test.lanes.tooling]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "--profile",
  "support",
  "-p",
  "kithara-devtools",
  "-p",
  "xtask",
  "--cargo-profile",
  "test-release",
]
# Neither crate declares a `flash` feature — the virtual clock is a property of
# the player, not of the tools that build it — so leaving flash on would fail the
# lane on `none of the selected packages contains these features`.
default_flash = false

# The harness itself: the test attribute crate, the shared test helpers, and the
# two `kithara-platform` targets that pin what `#[kithara::flash]` does to a
# callstack and across a spawn.
#
# Flash stays ON here, unlike the `tooling` lane. Both flash targets are
# `#![cfg(feature = "flash")]`, so a lane that dropped the feature would compile
# them empty and report a green suite that ran none of its seven tests.
[test.lanes.harness]
program = "cargo"
# `kithara-net` refuses to compile without an HTTP backend, and the backend in
# turn refuses to compile without a TLS one; nothing in this package selection
# turns either on, because in the product suite both arrive from `kithara`,
# which is not built here. This lane names the same pair `kithara-net` takes as
# its own default.
default_features = [
  "kithara-test-utils/client-reqwest",
  "kithara-test-utils/tls-rustls",
]
prefix_args = [
  "nextest",
  "run",
  "--profile",
  "harness",
  "-p",
  "kithara-test-utils",
  "-p",
  "kithara-test-macros",
  "-p",
  "kithara-platform",
  "--cargo-profile",
  "test-release",
]

# The fixture library and the harness meta-tests: the local test server, the
# fixture cache and protocol, the signal oracles (`signal_pcm`, `goertzel`,
# `wav`, `rfc6381`) — and `suite_harness`, which asserts that a timeout kills a
# wedged test and that `flash` rewrites the test body. If these break quietly,
# product tests start lying, which is why they keep a lane rather than being
# dropped.
[test.lanes.fixtures]
program = "cargo"
default_features = ["harness"]
prefix_args = [
  "nextest",
  "run",
  "--profile",
  "support",
  "-p",
  "kithara-integration-tests",
  "--lib",
  "--test",
  "suite_harness",
  "--cargo-profile",
  "test-release",
]

[test.lanes.cold]
program = "cargo"
default_features = ["kithara-ui/render"]
prefix_args = [
  "nextest",
  "run",
  "--profile",
  "cold",
  "--workspace",
  "--exclude",
  "kithara-fuzz",
  "--cargo-profile",
  "test-release",
]

[test.lanes.loom]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "kithara-fuzz",
  "--cargo-profile",
  "test-release",
]
default_features = ["kithara/loom"]
default_flash = false
suffix_args = ["-E", "test(/(^|::)loom_model_/)"]

[test.lanes.doc]
program = "cargo"
prefix_args = ["test", "--doc", "--workspace", "--exclude", "kithara-fuzz"]
default_flash = false

# Resampler-backend axis: each e2e lane pins one SRC shape. `e2e` is the
# desktop shape (Rubato adapter for both decoders), `e2e-fused` the production
# Apple shape (embedded AudioConverter SRC in the Apple codec; Symphonia stays
# on Rubato; inert off Apple), `e2e-glide` the Glide backend (no Rubato in the
# graph, otherwise the compile-time alias picks Rubato).
#
# All three need a real output device, so they run on the Apple executor and are
# absent from the Linux container fleet. `suite_e2e` reaches nothing outside the
# runner. The tests that need the zvuk CDN or the corporate VPN live in
# `suite_network` behind the `network` feature, so no amount of `--run-ignored`
# can pull them in here.
[test.lanes.e2e]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_e2e",
]
default_features = ["e2e", "kithara/resample-rubato"]
default_flash = false

[test.lanes.e2e-fused]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_e2e",
]
default_features = ["e2e", "kithara/resample-rubato", "apple-fused-src"]
default_flash = false

[test.lanes.e2e-glide]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_e2e",
]
default_features = ["e2e", "kithara/resample-glide"]
default_flash = false

# The network tests a runner can reach: the public zvuk CDN and silvercomet.
# The CDN is auth-gated, so this lane only says something where
# `KITHARA_DRM_PROD_*` are in the build environment; without them it fails on
# the key request rather than on the code, which is why it is a lane of its own
# rather than a gate job.

[test.lanes.network]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_network",
]
default_features = ["network", "kithara/resample-rubato"]
default_flash = false

# The half of the network tests no runner can serve: `*.zvq.me`, which resolves
# only inside the corporate network, and the tests that open a real output
# device. No CI job runs this and none should — a runner that fails here reports
# the fence around itself, not the code. `just test run --lane=network-manual`.
[test.lanes.network-manual]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_network_manual",
]
default_features = ["network-manual", "kithara/resample-rubato"]
default_flash = false

# What only the `broadcast` feature turns on. `kithara-broadcast`'s own unit
# tests need no feature and stay in the workspace lane.
[test.lanes.broadcast]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-app",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--lib",
  "--test",
  "suite_broadcast",
]
default_features = [
  "kithara-app/broadcast",
  "kithara-integration-tests/broadcast",
]
default_flash = true
# The detector these tests were failing under. Declared here so two schedulers
# cannot run the same lane under different rules.
default_no_block = true
# `broadcast::state` runs in the gate against stand-in packagers; only
# `broadcast::engine` needs the feature.
suffix_args = [
  "-E",
  "binary(suite_broadcast) + (package(kithara-app) & test(/^broadcast::engine::/))",
]

# Integration regression tests are red by design and stay outside the main gate.
[test.lanes.integration-regressions]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_integration_regressions",
]
default_features = ["integration-regressions"]
default_flash = true

# The harness (tests/tests/kithara_ffi_web/selenium.rs) reads
# KITHARA_SELENIUM_BROWSER to pick a browser and defaults to chrome if unset.
# Naming the browser in the lane itself, rather than leaving it to whatever
# the caller happens to export, is what makes `--lane=selenium-firefox` an
# honest description of what ran. Firefox is the only browser this pins today
# (geckodriver, below); a `selenium-chrome` lane needs a reviewed chromedriver
# pin first.
[test.lanes.selenium-firefox]
program = "cargo"
prefix_args = [
  "+nightly",
  "test",
  "-p",
  "kithara-integration-tests",
  "--test",
  "suite_heavy",
]
default_features = ["selenium"]
suffix_args = ["selenium", "--", "--nocapture"]
passthrough = "after-suffix"
default_flash = false
env = { KITHARA_SELENIUM_BROWSER = "firefox" }

