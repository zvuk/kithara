# themselves. Same detector, two platforms, two backends - not duplication.
[ext.ci.lanes.deep-rtsan]
cache_group = "macos"
label = "deep Apple"
os = "macos"
tools = ["cargo", "just"]
program = "just"
steps = [
  { args = [
    "test",
    "rtsan",
  ], label = "real-time sanitizer suite" },
  { args = [
    "test",
    "rtsan-async",
  ], label = "real-time sanitizer suite" },
  { args = [
    "test",
    "rtsan-file",
  ], label = "real-time sanitizer suite" },
  { args = [
    "test",
    "rtsan-hls",
  ], label = "real-time sanitizer suite" },
]
