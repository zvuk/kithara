    "--lane=loom",
  ], label = "Linux loom lane", env = { CARGO_BUILD_JOBS = "2" } },
]
role = "deep"
kinds = ["weekly"]
kinds_github = ["nightly"]
timeout_minutes = 180

# `just test` runs neither the build tooling nor the harness the product tests
