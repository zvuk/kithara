steps = [{ args = ["deps", "deny"], label = "licence and advisory gate" }]
role = "gate"
kinds = ["weekly", "quarantine"]
kinds_github = ["main", "branch"]
timeout_minutes = 30

[ext.ci.lanes.deps-unused]
cache_group = "linux"
label = "dependency audit"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [{ args = ["deps", "machete"], label = "unused manifest entries" }]
role = "gate"
kinds = ["weekly"]
kinds_github = ["main", "branch"]
timeout_minutes = 30

# Its own lane, and off the push gate: `cargo shear` reads what the source
# actually imports, so a dependency reachable only under a `cfg` this build
# does not enable reads as unused. The workspace has dozens - wasm-only and
# bench-only entries - and every one of them would refuse every push. Weekly
# on GitLab, nightly here, where the report is read rather than blocking.
[ext.ci.lanes.deps-shear]
cache_group = "linux"
label = "dependency audit"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [{ args = ["deps", "shear"], label = "unused crate dependencies" }]
role = "gate"
kinds = ["weekly"]
kinds_github = ["nightly"]
timeout_minutes = 30

[ext.ci.lanes.deps-features]
cache_group = "linux"
label = "dependency audit"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [{ args = ["deps", "hack"], label = "feature powerset check" }]
role = "gate"
kinds = ["weekly"]
# Not on a branch push. This checks about 375 feature combinations - the count
# moves as crates and features do - and the workspace is unpublished: the
# configurations anyone actually builds are the ones the platform lanes name,
# roughly a dozen. Paying 6.9 to 38.3 minutes of a one-host fleet on every push
# of every branch to cover the rest is the wrong trade - 30.8 hours of runner time over 117 runs. On the default branch
# it still gates what lands, and the nightly pass covers the days nothing
# lands, which is where a dependency update would break a combination with no
# push to blame. GitLab already said `weekly`; this is the same judgement.
kinds_github = ["main", "nightly"]
# The measurement, not a nap: over 117 runs on the fork's runners this lane took
# 6.9 to 38.3 minutes green, with p95 at 29.5, and the six that failed all
# failed inside eleven minutes - the shape of a check that stops at the first
# broken combination, not of one that hangs. Three hours would let a wedged lane
# hold a one-host fleet for the rest of an evening before anyone learned it was
# stuck, which is what a backstop exists to prevent. Sixty is the next rung
# above the worst run measured, and what every other gate lane of this weight
# already says.
timeout_minutes = 60

[ext.ci.lanes.deps-semver]
cache_group = "linux"
label = "dependency audit"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [{ args = ["deps", "semver"], label = "public API compatibility" }]
role = "gate"
kinds = ["weekly"]
kinds_github = ["main", "branch"]
timeout_minutes = 60
fetch_depth = 0

