tools = ["cha", "rustqual", "cargo-dupes", "pmat"]
expected_artifacts = ["target/quality-lab/{revision}/manual-summary.json"]

[[quality.assessment.deep_stages]]
name = "coverage-risk"
command = ["just", "quality", "coverage-risk"]
tools = ["cargo-llvm-cov", "cargo-crap"]
hard_invariant = true
expected_artifacts = [
  "coverage/lcov.info",
  "target/quality-lab/{revision}/coverage-summary.json",
]

[[quality.assessment.deep_stages]]
name = "public-api"
command = ["cargo", "public-api", "-p", "kithara"]
tools = ["cargo-public-api"]

[[quality.assessment.deep_stages]]
name = "binary-bloat"
command = [
  "cargo",
  "bloat",
  "-p",
  "kithara-app",
  "--release",
  "--message-format",
  "json",
]
tools = ["cargo-bloat"]

[[quality.assessment.deep_stages]]
name = "e2e"
command = ["just", "test", "run", "--lane=e2e"]
tools = ["e2e-tests"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "e2e-resamplers"
command = ["just", "test", "e2e-resamplers"]
tools = ["e2e-resamplers"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "selenium"
command = ["just", "test", "run", "--lane=selenium"]
tools = ["selenium-tests"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "feature-gate"
command = ["just", "ci", "gate"]
tools = ["feature-gate"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "loom"
command = ["just", "test", "run", "--loom=on"]
tools = ["loom"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "rtsan"
command = ["just", "test", "rtsan"]
tools = ["rtsan"]
hard_invariant = true
platforms = ["macos"]

[[quality.assessment.deep_stages]]
name = "perf-suite"
command = ["just", "perf"]
tools = ["perf-suite"]
hard_invariant = true
expected_artifacts = ["perf-results.txt"]

[[quality.assessment.deep_stages]]
name = "benchmarks"
command = ["just", "perf", "bench", "build"]
tools = ["benchmarks"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "memory"
command = ["just", "perf", "memory"]
tools = ["memory"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "wasm-check"
command = ["just", "platform", "wasm", "check"]
tools = ["wasm-check"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "wasm-tests"
command = ["just", "platform", "wasm", "test"]
tools = ["wasm-tests"]
