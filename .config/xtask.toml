title = "Kithara"
github_repo = "zvuk/kithara"
gitlab_host = "gitlab.zvq.me"
gitlab_project = "disrupt/kithara"
gitlab_package = "kithara"
# Rolling build channel: the nightly pipeline replaces this tag, its release,
# and its package files on every run, so a consumer pins the tag once.
nightly_tag = "nightly"
core_asset = "KitharaFFIInternal.xcframework.zip"
merged_asset = "Kithara.xcframework.zip"
platform_assets = ["kithara.aar", "rust-tls.aar"]
http_timeout_secs = 60
upload_timeout_secs = 600
# Documentation channel: DocC archive (`just platform apple doc`) zipped + uploaded as a
# release asset.
docs_asset = "Kithara-docs.zip"
docs_archive = "docs-build/Kithara.doccarchive"
# WebAssembly channel: trunk dist (`just platform wasm build`) zipped + deployed
# to GitHub Pages classic on the gh-pages branch.
wasm_asset = "kithara-wasm-pages.zip"
wasm_dist = "crates/kithara-ffi/dist"
pages_branch = "gh-pages"

# What each packaging run collects. The version gate belongs to publishing a
# version, so a snapshot taken of a commit under review does not ask for one.
[ext.release.packages.release]
version_gate = true
assets = ["core", "merged"]

[ext.release.packages.snapshot]
version_gate = false
assets = ["merged"]

# What delivery requires before it runs and what it then performs. The nightly
# channel is the only reader of `nightly_tag` above.
[ext.release.channels.release]
requires_version = true
require_all_assets = true
tokens = ["CARGO_REGISTRY_TOKEN", "GH_TOKEN", "GITLAB_TOKEN"]
steps = ["retained", "pages", "crates"]

[ext.release.channels.nightly]
requires_version = false
require_all_assets = false
tokens = ["GH_TOKEN", "GITLAB_TOKEN"]
steps = ["nightly_retained"]

[orphans]
# Empty, and it should stay that way. This check exists to point at code that
# needs rewriting, so a name on this list is a place someone decided not to
# look, and a green sweep bought that way says exactly as much as a green run
# that executed nothing.
#
# The list used to hold five names because dropping a whole package was the
# only lever the tool offered: a module gated behind another target or a
# non-default feature, or one reached through `#[path]` from a sibling file,
# reads as an orphan to `cargo modules`, which resolves one configuration and
# pairs files with parents by directory convention. The sweep now settles that
# question against the source — a file some `mod` declaration names is not an
# orphan, whatever gates it — and covers every `--lib` and `--bin` target
# rather than libraries alone, so a package without a library no longer has to
# be dropped.
#
# An entry here now means a package whose dead files nobody will be told about.
exclude_packages = []

[ext.android]
# Cargo package compiled into the Android JNI libraries.
ffi_crate = "kithara-ffi"
# AAR artifacts the Gradle export is expected to produce.
aars = ["kithara.aar", "rust-tls.aar"]
# Demo app launched by `just tooling xtask android run`.
default_avd = "Pixel_6"
demo_package = "com.kithara.example"
demo_activity = "com.kithara.example.MainActivity"
api_level = "26"
boot_wait_attempts = 120
boot_poll_interval_secs = 1

[ext.wasm]
# wasm-bindgen JS artifact patched by the trunk post-build hook.
js_artifact = "kithara-ffi.js"

[quality]
# Trait directory whose every `pub trait` must carry `#[unimock]`.
unimock_traits_dir = "crates/kithara-play/src/api"

[[quality.assessment.not_applicable_tools]]
tool = "cargo-mutants"
reason = "Workspace-wide mutation testing was measured at three days and killed nothing; the `deep-mutants` lane runs the curated unit suites in `.config/mutation-suites.toml` instead."

[[quality.assessment.deep_stages]]
name = "extended-clippy"
command = ["just", "lint", "audit-clippy"]
tools = ["extended-clippy"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "quality-lab"
command = ["just", "quality", "lab", "run", "manual"]
tools = ["cha", "rustqual", "cargo-dupes", "pmat"]
expected_artifacts = ["target/quality-lab/{revision}/manual-summary.json"]

[[quality.assessment.deep_stages]]
name = "coverage-risk"
command = ["just", "quality", "coverage-risk"]
tools = ["cargo-llvm-cov", "cargo-crap"]
hard_invariant = true
expected_artifacts = [
  "coverage/lcov.info",
  "target/quality-lab/{revision}/coverage-summary.json",
]

[[quality.assessment.deep_stages]]
name = "public-api"
command = ["cargo", "public-api", "-p", "kithara"]
tools = ["cargo-public-api"]

[[quality.assessment.deep_stages]]
name = "binary-bloat"
command = [
  "cargo",
  "bloat",
  "-p",
  "kithara-app",
  "--release",
  "--message-format",
  "json",
]
tools = ["cargo-bloat"]

[[quality.assessment.deep_stages]]
name = "e2e"
command = ["just", "test", "run", "--lane=e2e"]
tools = ["e2e-tests"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "e2e-resamplers"
command = ["just", "test", "e2e-resamplers"]
tools = ["e2e-resamplers"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "selenium-firefox"
command = ["just", "test", "run", "--lane=selenium-firefox"]
tools = ["selenium-tests"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "feature-gate"
command = ["just", "ci", "gate"]
tools = ["feature-gate"]
hard_invariant = true
complete_only = true

[[quality.assessment.deep_stages]]
name = "loom"
command = ["just", "test", "run", "--loom=on"]
tools = ["loom"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "rtsan"
command = ["just", "test", "rtsan"]
tools = ["rtsan"]
hard_invariant = true
platforms = ["macos"]

[[quality.assessment.deep_stages]]
name = "perf-suite"
command = ["just", "perf"]
tools = ["perf-suite"]
hard_invariant = true
expected_artifacts = ["perf-results.txt"]

[[quality.assessment.deep_stages]]
name = "benchmarks"
command = ["just", "perf", "bench", "build"]
tools = ["benchmarks"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "memory"
command = ["just", "perf", "memory"]
tools = ["memory"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "wasm-check"
command = ["just", "platform", "wasm", "check"]
tools = ["wasm-check"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "wasm-tests"
command = ["just", "test", "wasm"]
tools = ["wasm-tests"]
hard_invariant = true

[[quality.assessment.deep_stages]]
