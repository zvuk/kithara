# Real-time correctness is what this product is for: an allocation or a lock
# on the audio thread is a dropout, not a slow path. `deep-rtsan` is the full
# suite - including `rtsan-async`, which the three Linux lanes below do not
# cover - on the pinned nightly's instrumented sanitizer, on the platform that
# ships it. The Linux lanes run the same file/HLS/tripwire suites under the
