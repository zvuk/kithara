# A shader that stopped reading what Rust writes it looks identical from the
# outside until a frame is rendered and read back, so this is the one suite
# that needs an attached graphics device rather than a software rasterizer.
# Dispatched onto the ordinary fleet it would render on a software rasterizer
# and report green on a gate that never ran, so it stays name-only here, the
# same as `windows-x64`: `ui.yml` already schedules it onto
# `KITHARA_GPU_RUNNER_LABELS` and skips when that variable is empty, and the
# catalog has no field yet for naming a runner pool.
[ext.ci.lanes.deep-ui]
cache_group = "linux"
label = "Linux"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [{ args = ["test", "ui"], label = "UI suite and host parity" }]
role = "deep"
kinds = []
kinds_github = []
timeout_minutes = 120

# Miri cannot enter a C library, and every `unsafe` block that matters here is
# an FFI call into one, so the selection is the crates that hold atomics and
# forbid `unsafe` themselves. The interpreter runs a program hundreds of times
# slower than the machine does, so this stays weekly rather than nightly.
[ext.ci.lanes.deep-miri]
cache_group = "linux"
label = "Linux"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [{ args = ["test", "miri"], label = "Miri interpreter run" }]
role = "deep"
kinds = []
kinds_github = ["weekly"]
queue = "heavy-linux"
timeout_minutes = 240

# Mutation testing, scoped by `.config/mutation-suites.toml` rather than by the
# workspace: ten suites, each naming one package, the production files it may
# mutate, and the `test()` filters that must kill the mutants, run against
# `--lib` alone. A workspace-wide run was measured at three days and killed
# nothing - integration suites cover behaviour, not lines, so a mutant either
# survives every one of them or is caught by fifty at once.
#
# The four original suites are 88 mutants and took eight minutes. Six more,
# added over the decision-dense files that carry their own unit tests, are 535:
# `stream::coord` 132, `waveform::analyzer` 125, `size` 122, `worker::scheduler`
# 76, `track` 42, `media` 38. Seven times the work, and six package baselines
# instead of three, so this is an hour rather than a coffee. The timeout is
# still headroom for a hung mutant, but it is now roughly double the expected
# run rather than fifteen times it.
[ext.ci.lanes.deep-mutants]
cache_group = "linux"
label = "Linux"
os = "linux"
tools = ["cargo", "just"]
program = "just"
steps = [
  { args = [
    "test",
    "mutants",
    "run-all",
    "--jobs",
    "4",
  ], label = "unit mutation suites" },
]
role = "deep"
kinds = []
kinds_github = ["weekly"]
queue = "heavy-linux"
artifact = { name = "mutants", path = "target/mutants-ci" }
timeout_minutes = 120

# The scan reports where it found something, not merely how many: without the
# findings it announced "leaks found: 5" and stopped, which is a number nobody
# can act on. Values stay redacted, so neither the log nor the report repeats a
# secret while naming the rule, the file and the commit.
[ext.ci.lanes.linux-secrets]
cache_group = "linux"
label = "Linux"
os = "linux"
