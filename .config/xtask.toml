]
timeout_minutes = 60

# A CI checkout gives every source file a new mtime. Stable Cargo then rebuilds
# and relinks all test binaries even when their content is unchanged; sccache
# cannot cache those links. The pinned nightly Cargo's checksum freshness makes
# the persistent target content-addressed. Its target is isolated from stable
# lanes because Cargo fingerprint modes and compiler versions must not alternate
# in one profile tree.
#
# Every Linux test lane caps Cargo at two build jobs. The container has five
# CPUs and under eight gigabytes, so five compilations at once put the peak past
# the cgroup limit: the kernel logged `Killed process (rustc) anon-rss:1727320kB`
# twice in one second, and Cargo reported only "could not compile" with no
# diagnostic, because the compiler never reached one.
[ext.ci.lanes.linux-test-simulated-clock]
cache_group = "linux"
label = "Linux"
os = "linux"
tools = ["cargo", "just", "sccache"]
program = "just"
steps = [
  { args = [
    "test",
    "run",
    "--profile",
    "ci",
  ], label = "Linux tests", env = { CARGO_BUILD_JOBS = "2", CARGO_TARGET_DIR = "{target}/ci-tests", CARGO_UNSTABLE_CHECKSUM_FRESHNESS = "true", RUSTUP_TOOLCHAIN = "{pin.nightly_toolchain}" } },
]
role = "gate"
kinds = ["platforms", "main", "nightly"]
kinds_github = ["main", "branch"]
timeout_minutes = 60

[ext.ci.lanes.linux-doc]
cache_group = "linux"
label = "Linux"
os = "linux"
tools = ["cargo", "just", "sccache"]
program = "just"
steps = [
  { args = [
    "test",
    "run",
    "--lane=doc",
  ], label = "Linux doc lane", env = { CARGO_BUILD_JOBS = "2" } },
]
role = "deep"
kinds = ["weekly"]
kinds_github = ["nightly"]
timeout_minutes = 180

[ext.ci.lanes.linux-loom]
cache_group = "linux"
label = "Linux"
os = "linux"
tools = ["cargo", "just", "sccache"]
program = "just"
steps = [
