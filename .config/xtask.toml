# Project-specific identity and per-tool settings for the reusable xtask.
# The xtask code carries no project names; everything here is what a new
# project edits to adopt it.

[project]
name = "kithara"

[workspace-scan]
# Cargo build output can also live below an individual crate (for example the
# multi-target FFI builds). Generated bindings are not workspace source.
exclude = ["target/**", "**/target/**"]

[architecture.filters]
exclude_crates = [
  "kithara-devtools",
  "kithara-fuzz",
  "kithara-integration-tests",
  "kithara-test-*",
  "kithara-workspace-hack",
  "xtask",
]
exclude_modules = ["*::tests"]

[[architecture.runtime.scenarios]]
name = "queue-playback"
command = "test"
package = "kithara-integration-tests"
test = "suite_light"
filter = "kithara_queue::architecture_flow::queue_playback_architecture"
ignored = true
timeout_secs = 120

[audit_clippy]
lints = [
  "redundant_clone",
  "needless_collect",
  "iter_with_drain",
  "drain_collect",
  "iter_overeager_cloned",
  "collection_is_never_read",
  "assigning_clones",
  "unnecessary_to_owned",
  "inefficient_to_string",
  "implicit_clone",
  "format_push_string",
  "format_collect",
  "redundant_allocation",
  "box_collection",
  "rc_buffer",
  "large_enum_variant",
  "large_types_passed_by_value",
  "large_stack_arrays",
  "result_large_err",
  "stable_sort_primitive",
  "unnecessary_box_returns",
  "zero_sized_map_values",
  "map_entry",
  "await_holding_lock",
  "await_holding_refcell_ref",
  "significant_drop_in_scrutinee",
  "needless_pass_by_ref_mut",
  "readonly_write_lock",
  "mutex_integer",
  "mutex_atomic",
  "suboptimal_flops",
  "imprecise_flops",
  "naive_bytecount",
  "map_flatten",
  "string_lit_as_bytes",
  "unused_peekable",
  "unnecessary_struct_initialization",
  "path_buf_push_overwrite",
  "single_char_pattern",
  "manual_memcpy",
  "slow_vector_initialization",
  "useless_vec",
  "missing_const_for_fn",
]

[health]
# Crates excluded from `cargo hack --feature-powerset` (too many features).
feature_powerset_exclude = ["kithara-play", "kithara-app", "kithara-fuzz"]
# Crates excluded from whole-workspace stages (fuzz target needs cargo-fuzz).
workspace_exclude = ["kithara-fuzz"]

# Groups a crate refuses to be built without, and says so with compile_error!.
# A crate is matched by declaring `when_feature`, so these follow the workspace
# instead of naming crates twice. A crate carrying two of them gets both in one
# invocation: meeting one while leaving the other empty still builds nothing.

[[health.feature_invariants]]
when_feature = "client-reqwest"
at_least_one_of = [
  [
    "client-reqwest",
    "client-wreq",
  ],
  [
    "tls-rustls",
    "tls-native",
  ],
]

[[health.feature_invariants]]
when_feature = "stretch-signalsmith"
at_least_one_of = [["stretch-signalsmith", "stretch-bungee"]]

# `ffmpeg` names only kithara-encode. Without an encode backend the crate
# encodes nothing and says so with compile_error!, so the empty combination is
# not a build to check.
[[health.feature_invariants]]
when_feature = "ffmpeg"
at_least_one_of = [["ffmpeg", "fdk-aac"]]

# Forced rather than chosen: apple, android and webcodecs are gated on
# target_os as well as on their feature, so off those targets symphonia is the
# only backend whose variant survives and there is nothing to choose between.
# The platform lanes cover the hardware shapes.
[[health.feature_invariants]]
when_feature = "symphonia"
always = ["symphonia"]

# Same shape, one layer down: kithara-play refuses a non-wasm build without an
# output backend, and cpal is the only one off wasm — backend-web-audio is a
# browser API. Every crate that forwards the choice inherits the refusal.
[[health.feature_invariants]]
when_feature = "backend-cpal"
always = ["backend-cpal"]

[test]
default_lane = "workspace"
default_backend = "wreq"
feature_arg = "--features"
loom_lane = "loom"
# Base features applied to every test lane, including `--flash=off`.
features = []

[test.flash]
default = true
features = ["flash"]

[test.no_block]
default = false
features = ["no-block"]

[test.net_backends.wreq]
features = []

[test.net_backends.apple]
features = ["kithara-integration-tests/apple-net"]

[test.lanes.workspace]
program = "cargo"
default_features = ["kithara-ui/render"]
prefix_args = [
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "kithara-fuzz",
  "--cargo-profile",
  "test-release",
]

[test.lanes.cold]
program = "cargo"
default_features = ["kithara-ui/render"]
prefix_args = [
  "nextest",
  "run",
  "--profile",
  "cold",
  "--workspace",
  "--exclude",
  "kithara-fuzz",
  "--cargo-profile",
  "test-release",
]

[test.lanes.loom]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "--workspace",
  "--exclude",
  "kithara-fuzz",
  "--cargo-profile",
  "test-release",
]
default_features = ["kithara/loom"]
default_flash = false
suffix_args = ["-E", "test(/(^|::)loom_model_/)"]

[test.lanes.doc]
program = "cargo"
prefix_args = ["test", "--doc", "--workspace", "--exclude", "kithara-fuzz"]
default_flash = false

# Resampler-backend axis: each e2e lane pins one SRC shape. `e2e` is the
# desktop shape (Rubato adapter for both decoders), `e2e-fused` the production
# Apple shape (embedded AudioConverter SRC in the Apple codec; Symphonia stays
# on Rubato; inert off Apple), `e2e-glide` the Glide backend (no Rubato in the
# graph, otherwise the compile-time alias picks Rubato).
#
# All three run `suite_e2e`, which reaches nothing outside the runner. The tests
# that need the zvuk CDN or the corporate VPN live in `suite_network` behind the
# `network` feature, so no amount of `--run-ignored` can pull them in here.
[test.lanes.e2e]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_e2e",
]
default_features = ["e2e", "kithara/resample-rubato"]
default_flash = false

[test.lanes.e2e-fused]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_e2e",
]
default_features = ["e2e", "kithara/resample-rubato", "apple-fused-src"]
default_flash = false

[test.lanes.e2e-glide]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_e2e",
]
default_features = ["e2e", "kithara/resample-glide"]
default_flash = false

# The network tests a runner can reach: the public zvuk CDN and silvercomet.
# The CDN is auth-gated, so this lane only says something where
# `KITHARA_DRM_PROD_*` are in the build environment; without them it fails on
# the key request rather than on the code, which is why it is a lane of its own
# rather than a gate job.

[test.lanes.network]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_network",
]
default_features = ["network", "kithara/resample-rubato"]
default_flash = false

# The half of the network tests no runner can serve: `*.zvq.me`, which resolves
# only inside the corporate network, and the tests that open a real output
# device. No CI job runs this and none should — a runner that fails here reports
# the fence around itself, not the code. `just test run --lane=network-manual`.
[test.lanes.network-manual]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_network_manual",
]
default_features = ["network-manual", "kithara/resample-rubato"]
default_flash = false

# Integration regression tests are red by design and stay outside the main gate.
[test.lanes.integration-regressions]
program = "cargo"
prefix_args = [
  "nextest",
  "run",
  "-p",
  "kithara-integration-tests",
  "--cargo-profile",
  "test-release",
  "--test",
  "suite_integration_regressions",
]
default_features = ["integration-regressions"]
default_flash = true

[test.lanes.selenium]
program = "cargo"
prefix_args = [
  "+nightly",
  "test",
  "-p",
  "kithara-integration-tests",
  "--test",
  "suite_heavy",
]
default_features = ["selenium"]
suffix_args = ["selenium", "--", "--nocapture"]
passthrough = "after-suffix"
default_flash = false

[perf]
primary_lane = "flash-on-wreq"
nextest_profile = "perf"

[[perf.lanes]]
flash = true
backend = "wreq"

[[perf.lanes]]
flash = false
backend = "wreq"

[[perf.lanes]]
flash = true
backend = "apple"

[[perf.lanes]]
flash = false
backend = "apple"

[ext.xtask.cache]
extra_inputs = []
keep_generations = 2
generation_grace_secs = 3600

[ext.agent_hook]
destructive_git_override_env = "KITHARA_AGENT_ALLOW_DESTRUCTIVE_GIT"

[[ext.agent_hook.routes]]
event = "pre-tool-use"
tool_kind = "shell"
handler = "command-guard"

[[ext.agent_hook.routes]]
event = "post-tool-use"
tool_kind = "file-edit"
handler = "format-edited-paths"

[ext.ci]
pins = ".config/ci-pins.toml"

[ext.publish]
workspace_hack_crate = "kithara-workspace-hack"
delay_secs = 20
http_timeout_secs = 20
user_agent = "kithara-xtask-publish (zvuk_ai@prosoftware.io)"

[ext.release]
# Apple release flow (`just release artifacts|publish`).
manifest = "Package.swift"
title = "Kithara"
github_repo = "zvuk/kithara"
gitlab_host = "gitlab.zvq.me"
gitlab_project = "disrupt/kithara"
gitlab_package = "kithara"
# Rolling build channel: the nightly pipeline replaces this tag, its release,
# and its package files on every run, so a consumer pins the tag once.
nightly_tag = "nightly"
asset = "KitharaFFIInternal.xcframework.zip"
single_asset = "Kithara.xcframework.zip"
platform_assets = ["kithara.aar", "rust-tls.aar"]
http_timeout_secs = 60
upload_timeout_secs = 600
# Documentation channel: DocC archive (`just platform apple doc`) zipped + uploaded as a
# release asset.
docs_asset = "Kithara-docs.zip"
docs_archive = "docs-build/Kithara.doccarchive"
# WebAssembly channel: trunk dist (`just platform wasm build`) zipped + deployed
# to GitHub Pages classic on the gh-pages branch.
wasm_asset = "kithara-wasm-pages.zip"
wasm_dist = "crates/kithara-ffi/dist"
pages_branch = "gh-pages"

[orphans]
# Packages the sweep cannot say anything useful about: a generated crate, two
# test harnesses, the fuzz targets, and the build tool.
#
# Nothing else belongs here. This check exists to point at code that needs
# rewriting, so a name on this list is a place someone decided not to look, and
# the list only ever grew because dropping a whole package is the only lever
# the tool offers. A green sweep bought that way says exactly as much as a
# green run that executed nothing.
#
# A module the sweep reports but that is real — gated behind a non-default
# feature or another target — is a gap in how the sweep is invoked, not grounds
# for an entry here: it runs `--lib` with default features on the native target
# and passes neither `--features` nor `--target`. Widen the invocation.
exclude_packages = [
  "kithara-workspace-hack",
  "kithara-test-utils",
  "kithara-test-macros",
  "kithara-fuzz",
  "xtask",
]

[ext.android]
# Cargo package compiled into the Android JNI libraries.
ffi_crate = "kithara-ffi"
# AAR artifacts the Gradle export is expected to produce.
aars = ["kithara.aar", "rust-tls.aar"]
# Demo app launched by `just tooling xtask android run`.
default_avd = "Pixel_6"
demo_package = "com.kithara.example"
demo_activity = "com.kithara.example.MainActivity"
api_level = "26"
boot_wait_attempts = 120
boot_poll_interval_secs = 1

[ext.wasm]
# wasm-bindgen JS artifact patched by the trunk post-build hook.
js_artifact = "kithara-ffi.js"

[quality]
# Trait directory whose every `pub trait` must carry `#[unimock]`.
unimock_traits_dir = "crates/kithara-play/src/api"

[[quality.assessment.not_applicable_tools]]
tool = "cargo-mutants"
reason = "Workspace-wide mutation testing is prohibitively expensive and does not provide actionable signal."

[[quality.assessment.deep_stages]]
name = "extended-clippy"
command = ["just", "lint", "audit-clippy"]
tools = ["extended-clippy"]
hard_invariant = true

[[quality.assessment.deep_stages]]
name = "quality-lab"
