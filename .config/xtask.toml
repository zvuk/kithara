    ".",
    "--config",
    ".gitleaks.toml",
    "--log-opts=--all",
    "--no-banner",
    "--redact=100",
    "--verbose",
    "--report-format",
    "json",
    "--report-path",
    "gitleaks-report.json",
  ], label = "repository secret scan" },
]
role = "gate"
