# On-disk fixture cache (L2). ON BY DEFAULT: when KITHARA_FIXTURE_CACHE is unset
# (the default profile, `just test`, `cargo test`, `just test rtsan`, IDE), the test
# code falls back to a build-fingerprinted temp dir (see
# tests/src/fixture_cache.rs::resolve_cache_dir), so encode/mux output is reused
# across the per-test processes in a run. Without L2, nextest's process-per-test
# model re-encodes every AAC fixture from scratch — under CPU oversubscription a
# single test's ffmpeg encode can exhaust its whole time budget and time out.
#
# The opt-in `cold` profile below additionally runs a setup script that recreates
# a separate cold root and exports KITHARA_FIXTURE_CACHE. It never removes the
# persistent default cache.
experimental = ["setup-scripts"]

[scripts.setup.cold-fixture-cache]
command = 'cargo run -q -p kithara-integration-tests --bin cold-fixture-cache'

# Support tests — build tooling and the harness itself — are removed from the
# product suite here, in the two cases cargo cannot express. Whole support crates
# leave through `--exclude` in the `workspace` lane, and the harness meta-tests
# through `required-features` on `suite_harness`; what remains are targets that
# live inside product crates and cannot be dropped at cargo level without taking
# product tests with them.
#
# This belongs in `default-filter` and NOT in a lane's `suffix_args`: nextest
# UNIONS several `-E` expressions, so a lane-level `-E` would silently widen
# `just test run -E 'test(seek)'` back to nearly the whole suite. `default-filter`
# intersects with a command-line filter instead.
#
# The `=` matchers are exact on purpose — a substring match on
# `kithara-integration-tests` would also swallow `suite_e2e` and `suite_network`.
#
# Returning a target to the product suite is one edit: drop its term.
# `.config/xtask.toml` `[test.lanes.fixtures]` and `[test.lanes.harness]` run
# these under `profile.support`, which opts back in.
#
# The last two terms are the UI, which owns a graphics-backed pipeline of its
# own: `[test.lanes.ui]` opts out of this filter with `--ignore-default-filter`
# and runs exactly that set on the GPU runner.
[profile.default]
default-filter = """
not (
    binary_id(=kithara-platform::flash_attr)
    + binary_id(=kithara-platform::flash_spawn)
    + binary_id(=kithara-integration-tests)
    + package(kithara-ui)
    + (package(kithara-app) & test(/^gui::/))
)
"""
fail-fast = false
test-threads = "num-cpus"
# Wall-clock BACKSTOP only. The real per-test bound is the macro `timeout(...)`
# on each test — its abort watchdog kills a hung test at its own budget+3s, so
# this backstop only matters for tests with NO per-test timeout. It must sit
# above the slowest *actual* real runtime (NOT above the largest budget): the
# full-suite worst case under contention is ~57s (a flash(false) real-socket
# downswitch test). 120s = ~2x that — well clear of every legit run, while a
# real wedge fails in 120s instead of 300s. A flash deadlock is normally caught
# far sooner by the virtual hang-watchdog (~1s).
slow-timeout = { period = "120s", terminate-after = 1 }
# Default 100ms is too tight when 12 cores run 1800+ tests concurrently;
# munmap of a 46MB test binary + stdout flush can exceed it even for
# sync tests that spawn no threads. A real leak (live worker thread
# blocked on channel) would still exceed 2s and get caught.
leak-timeout = "2s"

[profile.ci]
fail-fast = false
test-threads = "num-cpus"
leak-timeout = "2s"
# The verdict reads a single failure as a regression, so one bad throw blocks
# whichever change is under it. One retry removes that class; a test that
# survives two attempts is a bug to look at, not a number to raise.
retries = 1

# `path` resolves against the profile's store directory
# (`target/nextest/ci/`), so it must stay relative: spelling it out from the
# repository root nests the file under itself and the report never reaches CI.
# Keep this table last — a `[profile.ci.junit]` header placed above the
# profile's own keys silently swallows them.
[profile.ci.junit]
path = "junit.xml"

# Fast-only profile: heavy tests are excluded via -E filter in justfile.
[profile.fast]
fail-fast = false
test-threads = "num-cpus"
leak-timeout = "2s"

# Stress-evidence profile: repeat the exact inventory selected by the caller.
# No thread limit — a real audio player shares the machine with many
# other processes. Tests must pass under CPU contention.
[profile.stress]
fail-fast = false
test-threads = "num-cpus"
# Selected tests declare macro budgets up to 600s. The pre-kill snapshot runs
# at 630s and this outer backstop reaches its SIGTERM threshold at 660s;
# nextest's termination grace follows. The test-owned watchdog should write its
# attempt-correlated dump first.
slow-timeout = { period = "60s", terminate-after = 11 }
leak-timeout = "2s"
# A run repeats thousands of tests tens of times, and printing the body of
# every failure turns its console into something no one reads. The bodies are
# not lost: `store-failure-output` keeps them in the JUnit below, which is what
# the evidence reporter parses for symptoms, backtraces and wait graphs — the
# console is not an input to anything. What stays on it is the progress counter
# and the name of each test that failed.
failure-output = "never"

[profile.stress.junit]
path = "junit.xml"
store-failure-output = true
# Divergence analysis diffs the runtime lines of failing attempts against
# passing attempts of the same test. Without stored green output the passing
# side is invisible and "greens never emit this line" is an unsupported guess;
# the reporter declares that gap instead of computing divergence. Volume stays
# bounded because only annotated tests emit runtime lines, at debug level.
store-success-output = true

# Opt-in cold fixture-cache profile: same settings as default, plus the setup
# script that recreates an isolated cold root and exports KITHARA_FIXTURE_CACHE.
# Use via `cargo nextest run --profile cold` / `just test run --lane=cold`.
[profile.cold]
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 1 }
leak-timeout = "2s"

[[profile.cold.scripts]]
filter = 'package(kithara-integration-tests)'
setup = ['cold-fixture-cache']

# `kithara-platform` has to be built whole to reach its two flash targets, which
# would drag its product tests into the harness lane. Naming them here rather
# than as an `-E` in the lane is the same rule as above: a lane-level `-E` unions
# with whatever the caller passes, so `just test run --lane=harness -E '...'`
# would widen the lane instead of narrowing it.
[profile.harness]
default-filter = """
binary_id(=kithara-platform::flash_attr)
+ binary_id(=kithara-platform::flash_spawn)
+ package(kithara-test-utils)
+ package(kithara-test-macros)
"""

# The support lanes (`tooling`, `harness`, `fixtures`) run under this profile.
# Its whole job is to undo the product suite's `default-filter`: a lane that
# exists to run the excluded targets must not inherit the exclusion that removed
# them. Everything else is inherited from `default`.
[profile.support]
default-filter = 'all()'

# Perf-measurement profile: behavior identical to default (profiles inherit
# it); adds JUnit so `just perf suite` gets exact per-test timings.
[profile.perf.junit]
path = "junit.xml"

# RealtimeSanitizer lanes. A violation aborts the process, so the point of
# running them here rather than under `cargo test` is nextest's process per
# test: the abort takes one test down and JUnit names it, instead of the whole
# suite dying with a bare exit code. No retries — a violation is a fact, not a
# flake, and re-running one only hides which attempt saw it. `default-filter`
# is opened because the lanes select integration suites the product filter
# excludes.
[profile.rtsan]
default-filter = 'all()'
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
leak-timeout = "2s"

[profile.rtsan.junit]
path = "junit.xml"
store-failure-output = true
