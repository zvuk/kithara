# The gate the merge decision hangs on. Everything else may be red — the suite
# is not green and waiting for it to be green blocks every change behind it —
# but nothing may be red here that the default branch has not already been
# failing.
#
# It runs on the Mac host because the journal has to outlive the job that
# writes it, so it lives in the host's cache directory. It takes the control
# registration rather than a build slot, which it used to wait minutes for
# behind builds it does not need. It carries no platform rule for the same
# reason a lint gate carries none.
verdict:
  extends:
    - .macos-control-job
    - .rules-verify-and-branch
  stage: verdict
  interruptible: true
  # Every lane it judges, and every one of them optional: platforms are opt-in,
  # so a pipeline that did not ask for Android has no Android job to wait for.
  needs:
    - job: apple:test
      artifacts: true
      optional: true
    - job: apple:net-units
      artifacts: true
      optional: true
    - job: apple:test-flash-off
      artifacts: true
      optional: true
    - job: apple:swift-test
      artifacts: true
      optional: true
    - job: apple:ios-test
      artifacts: true
      optional: true
    - job: android:test
      artifacts: true
      optional: true
  # A lane that failed is exactly the one whose report is needed, so this runs
  # after a failure rather than instead of one.
  when: always
  script:
    - '"$KITHARA_CI_HOST_BINARY" ci run verdict'
  artifacts:
    when: always
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/junit/
