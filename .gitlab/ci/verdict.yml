# The gate the merge decision hangs on. Everything else may be red — the suite
# is not green and waiting for it to be green blocks every change behind it —
# but nothing may be red here that the default branch has not already been
# failing.
#
# It runs on macOS because the journal has to outlive the job that writes it and
# that lane is the host itself, so its cache directory is the host's. It used to
# run on Linux for that reason, back when a macOS job meant a throwaway guest —
# and the Linux guest is no longer up between nightly runs. It carries no
# platform rule for the same reason a lint gate carries none.
verdict:
  extends:
    - .macos-job
    - .rules-verify-and-branch
  stage: verdict
  interruptible: true
  # Every lane it judges, and every one of them optional: platforms are opt-in,
  # so a pipeline that did not ask for Android has no Android job to wait for.
  needs:
    - job: apple:test
      artifacts: true
      optional: true
    - job: apple:test-flash-off
      artifacts: true
      optional: true
    - job: apple:swift-test
      artifacts: true
      optional: true
    - job: apple:ios-test
      artifacts: true
      optional: true
    - job: linux:test
      artifacts: true
      optional: true
    - job: android:test
      artifacts: true
      optional: true
    - job: web:chromium
      artifacts: true
      optional: true
    - job: web:firefox
      artifacts: true
      optional: true
  # A lane that failed is exactly the one whose report is needed, so this runs
  # after a failure rather than instead of one.
  when: always
  script:
    - just ci run verdict
  artifacts:
    when: always
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/junit/
