# A runner that keeps its checkouts builds beside each one, in a root of its
# own: every lane takes a directory there and Cargo is told the alias in front
# of it, so a compilation is keyed on one path whichever lane ran last and
# whichever runner slot holds the checkout. The runner cannot name a path per
# checkout, so these name it from the checkout GitLab gives the job, and give
# its compiler-cache server a socket no other checkout's job shares. The root
# is hidden: the host serves production/main's pipelines too until this layout
# merges, and main's room gate walks every builds directory that is not.
.builds-beside-checkout:
  variables:
    CARGO_TARGET_DIR: ${CI_PROJECT_DIR}/../.${CI_PROJECT_NAME}.target
    KITHARA_XTASK_TARGET: ${CI_PROJECT_DIR}/../.${CI_PROJECT_NAME}.target/xtask
    SCCACHE_SERVER_UDS: /tmp/kithara-sccache-${CI_RUNNER_SHORT_TOKEN}-${CI_CONCURRENT_PROJECT_ID}.sock

.macos-job:
  extends: .builds-beside-checkout
  tags:
    - kithara-macos

# Control jobs read and write the host's journal and call APIs; they build
# nothing. Their registration runs in a runner process of its own, one job at
# a time, so a control job never waits for a build slot. It runs the host's
# installed CI executable: there is no `just`, no Cargo build and no compiler
# cache behind this tag.
.macos-control-job:
  tags:
    - kithara-macos-control

.apple-device-job:
  extends: .builds-beside-checkout
  tags:
    - kithara-macos-2

.android-job:
  extends: .builds-beside-checkout
  tags:
    - kithara-android

.windows-job:
  extends: .builds-beside-checkout
  variables:
    # Beside the pins and the runner token, the way the macOS host keeps them.
    KITHARA_CI_HOST_CONFIG: C:/KitharaCI/services/mac-host.toml
  tags:
    - kithara-windows

.release-job:
  extends: .builds-beside-checkout
  tags:
    - kithara-release

# The native Linux pool: Docker workers whose own environment names the cache
# roots, the build directory and the compiler-cache socket, so a job here sets
# none of them and runs a lane with the command GitHub's `lane.yml` runs.
#
# The runner puts each worker's own token into the default checkout path.
# Compiled artifacts carry the source path they were built from, for example
# through `env!("CARGO_MANIFEST_DIR")`, and the compiler cache shares them
# across workers. So every worker checks out at one path: a hit that one worker
# built must name a directory that exists on the worker reusing it.
.linux-pool-job:
  image: kithara-ci:linux-latest
  tags:
    - kithara-cloud-linux
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_PATH

# Every Linux pool job's rules start here. Setting the project variable
# `KITHARA_LINUX_POOL` to `off` takes the pool out: its jobs are not created,
# rather than left pending for a worker that is not there. The profile
# `github-only` hands every Linux lane to GitHub, which then renders both
# providers' lists, so the pool steps aside the same way.
.linux-pool:
  rules:
    - if: $KITHARA_LINUX_POOL == "off" || $KITHARA_CI_PROFILE == "github-only"
      when: never

# A ready verification that follows its draft's passed run of the same merge
# tree carries `KITHARA_QUARANTINE_REUSED`. A job whose draft run was this very
# plan - both kinds, the same arguments, no suite the draft scope narrows, no
# artifacts a kept job reads - already answered on that tree, so it is not
# created again. A job with such a suite runs it less the draft's scope.
.reused-from-draft:
  rules:
    - if: $KITHARA_QUARANTINE_REUSED == "1"
      when: never

# A rejected verification the default branch moved under, reaching every job
# that failed, is repeated on the new base with `KITHARA_QUARANTINE_JOBS`, a
# pattern naming those jobs. No other job is created, except one whose
# artifacts a named job reads: it cannot run without them.
.repeated-jobs:
  rules:
    - if: $KITHARA_QUARANTINE_JOBS && $CI_JOB_NAME !~ $KITHARA_QUARANTINE_JOBS
      when: never

# Mac lanes run on the Mac host, the Linux lanes whose `kinds_gitlab` place
# them on GitLab run on the Linux pool, and the Linux lanes GitHub keeps run on
# its own fleet. Android and Windows are opted into through KITHARA_PLATFORMS.
# A lane the verdict judges does not gate on its own: it reports, and the
# verdict decides by comparing what failed here with what the default branch is
# already failing. Gating on each lane means gating on a suite that is not
# green, which holds every change behind accumulated red rather than behind its
# own. A failure here is still not free — it reaches the verdict as a report or,
# for a lane that can name no test, as a marker carrying the lane's name.
.judged:
  allow_failure: true

.platform-android:
  rules:
    - if: $KITHARA_PLATFORMS !~ /(^|,)\s*android\s*(,|$)/
      when: never

.platform-windows:
  rules:
    - if: $KITHARA_PLATFORMS !~ /(^|,)\s*windows\s*(,|$)/
      when: never

# Jobs declare only the dependencies they really have. Ordering on the shared
# host belongs to the runners — each takes a single build at a time — so a lane
# no longer queues behind an unrelated lane, and a lane whose runner is not
# registered cannot hold the rest of the pipeline hostage.
.rules-verify:
  interruptible: true
  rules:
    - !reference [.repeated-jobs, rules]
    - !reference [.verify-kinds, rules]

# The kinds that verify, for a job a repeat keeps whatever it names.
.verify-kinds:
  rules:
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
    - if: $KITHARA_PIPELINE_KIND == "platforms"
    - if: $KITHARA_PIPELINE_KIND == "main"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "nightly"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "release"
      interruptible: false

.rules-integration:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "platforms"
    - if: $KITHARA_PIPELINE_KIND == "main"
    - if: $KITHARA_PIPELINE_KIND == "nightly"

# Review checks can be superseded by another commit on the same branch.
# Child jobs declare cancellation themselves; the trigger cannot do it for them.
.rules-verify-and-branch:
  interruptible: true
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
    - !reference [.rules-verify, rules]

# Long lanes a review ref asks for on purpose. Keeping them off `main` leaves
# the merge queue as short as it is today; the nightly channel is where they
# guard the default branch.
.rules-review-or-nightly:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "nightly"

.rules-nightly:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "nightly"

.rules-weekly:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "weekly"

.rules-release:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "release"
    # The same artifacts feed the rolling nightly channel, so the build lanes
    # run there too. What differs is the checksum gate a version carries and
    # the tag the publish job writes, and the lanes read the kind for both.
    - if: $KITHARA_PIPELINE_KIND == "nightly"
    # The build lanes only produce artifacts, so whether they still work is a
    # question worth answering before a release rather than during one. Any
    # pipeline may ask by setting this — on a protected ref, because two of
    # these lanes are tagged for protected runners and a job no runner may take
    # holds the pipeline's resource group until it times out. `release:publish`
    # carries its own rule and stays out of reach: it is the only job that
    # leaves this machine.
    - if: $KITHARA_VERIFY_RELEASE_LANES == "1" && $CI_COMMIT_REF_PROTECTED == "true"

# Packaging a commit for someone to install by hand is a question a review
# asks, not a release. It stays off the release rule because opening that one
# to review refs would also expose the lanes tagged for protected runners, and
# a job no runner may take holds the pipeline's resource group until it times
# out.
.rules-package:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "branch"
    - if: $KITHARA_PIPELINE_KIND == "main"

# Dropping the serial chain let two runners work at once, which is the point —
# but a full suite, a browser run, and every perf measurement report on how
# loaded the host was, not only on the commit. Each takes a group named after
# its own job, so no measurement shares the host with another run of itself.
# Different measured jobs may overlap, and the load a report describes then
# includes theirs. One group for all of them queued every measured job behind
# every other: on 2026-11-04 `apple:test` waited a median of 82 minutes for an
# 11-minute run, and `apple:ios-test` 131.
.measured:
  resource_group: kithara-suite-$CI_JOB_NAME_SLUG
