# Cargo never collects a target directory: a lockfile, toolchain or source
# change leaves the previous artifacts behind, and this one passes a gigabyte
# per checkout. Reset it when the inputs that decide its contents change.
#
# `xtask` charges this directory and the Linux slot caches against the host
# budget and evicts from both, but it cannot evict a target directory whose
# lease a running job holds — the state a refused job finds. This runs before
# the lane takes that lease, which is the room it can still free.
#
# The stamp is what the directory is filled from, not the commit that happened
# to be checked out: `xtask`'s own sources, the workspace crate it links, the
# lockfile and toolchain that decide what it compiles against, and the
# configuration it parses. Keying on the commit instead threw a good build
# directory away on every push and spent a minute of every pipeline recompiling
# `proc-macro2` and `serde` to get the same bytes.
#
# The path is the checkout's own. Since #277 the Linux bootstrap builds into a
# slot directory shared across checkouts, and that one is left alone on purpose:
# resetting it whenever the next job's inputs differ from the last one's is the
# rebuild-per-checkout that sharing was introduced to end.
#
# Not applied to Windows, whose shell is not this one; that lane has no runner
# today.
.unix-job:
  before_script:
    - |
      stamp=target/xtask-self-cache/.inputs
      inputs=$(git ls-files -s xtask crates/kithara-devtools .config Cargo.toml Cargo.lock rust-toolchain.toml | git hash-object --stdin)
      if [ "$(cat "$stamp" 2>/dev/null)" != "$inputs" ]; then
        rm -rf target/xtask-self-cache
        mkdir -p target/xtask-self-cache
        printf '%s' "$inputs" > "$stamp"
      fi

.macos-job:
  extends: .unix-job
  tags:
    - kithara-macos

.linux-job:
  extends: .unix-job
  tags:
    - kithara-linux

.android-job:
  extends: .unix-job
  tags:
    - kithara-android

.windows-job:
  variables:
    # Beside the pins and the runner token, the way the macOS host keeps them.
    KITHARA_CI_HOST_CONFIG: C:/KitharaCI/services/mac-host.toml
  tags:
    - kithara-windows

.release-job:
  extends: .unix-job
  tags:
    - kithara-release

# One Mac mini serves every platform: a Linux container under colima, Windows
# under qemu, and the Android and Apple simulator lanes directly on the host.
# Carrying all of them on every push spends the machine on lanes the GitHub
# fork already covers, and buries the platform under focus — today iOS — among
# failures that belong elsewhere. So the others are opt-in: name them in
# `KITHARA_PLATFORMS`, comma-separated, on a run started for that purpose.
#
# These gate the lanes' own rule sets rather than the `include`, because an
# `include:rules` is resolved before the variables a run carries are visible —
# a child pipeline that plainly has `KITHARA_PLATFORMS=linux` still saw none of
# the Linux jobs. As the first entry in a job's `rules` a `when: never` match
# ends the evaluation, so the platform check comes before anything the lane's
# own kind rules would allow.
# A lane the verdict judges does not gate on its own: it reports, and the
# verdict decides by comparing what failed here with what the default branch is
# already failing. Gating on each lane means gating on a suite that is not
# green, which holds every change behind accumulated red rather than behind its
# own. A failure here is still not free — it reaches the verdict as a report or,
# for a lane that can name no test, as a marker carrying the lane's name.
.judged:
  allow_failure: true

.platform-linux:
  rules:
    - if: $KITHARA_PLATFORMS !~ /(^|,)\s*linux\s*(,|$)/
      when: never

.platform-web:
  rules:
    - if: $KITHARA_PLATFORMS !~ /(^|,)\s*web\s*(,|$)/
      when: never

.platform-android:
  rules:
    - if: $KITHARA_PLATFORMS !~ /(^|,)\s*android\s*(,|$)/
      when: never

.platform-windows:
  rules:
    - if: $KITHARA_PLATFORMS !~ /(^|,)\s*windows\s*(,|$)/
      when: never

# Jobs declare only the dependencies they really have. Ordering on the shared
# host belongs to the runners — each takes a single build at a time — so a lane
# no longer queues behind an unrelated lane, and a lane whose runner is not
# registered cannot hold the rest of the pipeline hostage.
.rules-verify:
  interruptible: true
  rules:
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
    - if: $KITHARA_PIPELINE_KIND == "platforms"
    - if: $KITHARA_PIPELINE_KIND == "main"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "nightly"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "release"
      interruptible: false

.rules-integration:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "platforms"
    - if: $KITHARA_PIPELINE_KIND == "main"
    - if: $KITHARA_PIPELINE_KIND == "nightly"

# A branch push runs the iOS-facing subset, not everything: the platform under
# focus, on the host that is that platform. The branch kind is therefore added
# to the jobs that subset names rather than to the shared sets above, which the
# Linux, Android and web lanes also extend. Cancellation comes from the parent
# `dispatch:branch`, which is interruptible and takes the child pipeline with
# it, so these keep the interruptibility their own kind asks for.
.rules-verify-and-branch:
  interruptible: true
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
    - !reference [.rules-verify, rules]

.rules-integration-and-review:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - !reference [.rules-integration, rules]

# Long lanes a review ref asks for on purpose. Keeping them off `main` leaves
# the merge queue as short as it is today; the nightly channel is where they
# guard the default branch.
.rules-review-or-nightly:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "nightly"

.rules-nightly:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "nightly"

.rules-weekly:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "weekly"

.rules-release:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "release"
    # The same artifacts feed the rolling nightly channel, so the build lanes
    # run there too. What differs is the checksum gate a version carries and
    # the tag the publish job writes, and the lanes read the kind for both.
    - if: $KITHARA_PIPELINE_KIND == "nightly"
    # The build lanes only produce artifacts, so whether they still work is a
    # question worth answering before a release rather than during one. Any
    # pipeline may ask by setting this — on a protected ref, because two of
    # these lanes are tagged for protected runners and a job no runner may take
    # holds the pipeline's resource group until it times out. `release:publish`
    # carries its own rule and stays out of reach: it is the only job that
    # leaves this machine.
    - if: $KITHARA_VERIFY_RELEASE_LANES == "1" && $CI_COMMIT_REF_PROTECTED == "true"

# Packaging a commit for someone to install by hand is a question a review
# asks, not a release. It stays off the release rule because opening that one
# to review refs would also expose the lanes tagged for protected runners, and
# a job no runner may take holds the pipeline's resource group until it times
# out.
.rules-package:
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "branch"
    - if: $KITHARA_PIPELINE_KIND == "main"

# Dropping the serial chain let two runners work at once, which is the point —
# but a full suite, a browser run, and every perf measurement report on how
# loaded the host was, not only on the commit. Those take this group, so one of
# them holds the machine at a time while lint, checks, and scans run alongside.
.measured:
  resource_group: kithara-suite
