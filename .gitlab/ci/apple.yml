.apple-job:
  extends:
    - .macos-job
    - .rules-verify
  stage: apple
  timeout: 60 minutes

apple:lint:
  extends:
    - .apple-job
    - .rules-verify-and-branch
  needs: []
  script:
    - just ci run apple-lint
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - target/quality-report.md
      - target/trait-mock-audit.md
      - target/rstest-audit.md

# The oldest toolchain the workspace claims to build on. That is a promise
# about the crate, not a question about a patch, and answering it costs a full
# workspace build under a second toolchain — one of the five this pipeline
# already pays for on a single host. The default branch and nightly keep it.
apple:msrv:
  extends:
    - .macos-job
    - .rules-integration
  stage: apple
  timeout: 60 minutes
  needs: []
  script:
    - just ci run apple-msrv

apple:test:
  extends:
    - .apple-job
    - .judged
    - .measured
    - .rules-verify-and-branch
  needs:
    - apple:lint
  script:
    - just ci run apple-test
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: .ci-artifacts/junit/apple-test.xml
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/junit/

# The same suite with the clock left real. It owns a second target directory,
# so it is another whole build of the workspace, and what it guards is the
# flash accounting rather than the change under review. The default branch and
# nightly carry it; a review is held to the flash-on gate.
apple:test-flash-off:
  extends:
    - .macos-job
    - .judged
    - .rules-integration
    - .measured
  stage: apple
  timeout: 60 minutes
  needs:
    - apple:lint
  script:
    - just ci run apple-test-flash-off
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: .ci-artifacts/junit/apple-test-flash-off.xml
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/junit/

apple:xcframework:
  extends:
    - .apple-job
    - .rules-verify-and-branch
  needs:
    - apple:lint
  script:
    - just ci run apple-xcframework
  # The simulator suite consumes this rather than building its own. The guest
  # that runs it may be a different one, and a job cleans the checkout of
  # everything the commit does not carry, so the framework has to travel.
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - apple/KitharaFFIInternal.xcframework
      - apple/Sources/KitharaFFI/KitharaFFI.swift

# The Swift package's own tests, which rebuild the framework in order to run.
# What a review needs from this layer is the simulator suite on
# `apple:ios-test`, and that one takes the framework from the job that already
# built it instead of building a third copy.
apple:swift-test:
  extends:
    - .apple-device-job
    - .rules-integration
    - .judged
  stage: apple
  timeout: 60 minutes
  needs:
    - apple:xcframework
  script:
    - just ci run apple-swift-test
  artifacts:
    when: always
    reports:
      junit: .ci-artifacts/junit/apple-swift-test.xml
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/junit/

apple:ios:
  extends:
    - .apple-job
    - .apple-device-job
  needs:
    - apple:xcframework
  script:
    - just ci run apple-ios

# The suite plays audio and asserts on what came back, so it takes the measured
# group: a simulator sharing the host with a full build reports on the load
# rather than on the commit.
#
# It blocks rather than reports, and it runs wherever a change is judged in
# full, quarantine included; a branch or a draft pull request is not. The
# simulator runs on one Mac mini and nowhere else, so no other lane and no
# other host can answer for the iOS surface: a red here that only reached the
# verdict as a report let a change reach the default branch with the surface
# it breaks never having run green.
apple:ios-test:
  extends:
    - .apple-device-job
    - .rules-verify
    - .measured
  stage: apple
  timeout: 60 minutes
  needs:
    - job: apple:xcframework
      artifacts: true
  script:
    - just ci run apple-ios-test
  artifacts:
    when: always
    reports:
      junit: .ci-artifacts/junit/apple-ios-test.xml
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/junit/

apple:safari:
  extends:
    - .macos-job
    - .rules-nightly
  stage: apple
  timeout: 60 minutes
  needs:
    - apple:lint
  script:
    - just ci run apple-safari
