# Catalog lanes on the Linux pool. Each job runs its lane the way GitHub's
# `lane.yml` does, so the two providers differ only in which of them a lane's
# kinds enable.
.linux-lane:
  extends: .linux-pool-job
  stage: linux
  interruptible: true
  needs: []
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.rules-verify-and-branch, rules]

linux:lint:
  extends: .linux-lane
  timeout: 60 minutes
  script:
    - just ci lane linux-lint --kind "$KITHARA_PIPELINE_KIND"

linux:tooling:
  extends: .linux-lane
  timeout: 180 minutes
  script:
    - just ci lane linux-tooling --kind "$KITHARA_PIPELINE_KIND"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - .ci-artifacts/hang/

# GitHub runs these lanes. Each keeps its job here, so the whole set can run
# on GitLab: `KITHARA_CI_PROFILE=gitlab-only` admits a lane for the kinds its
# GitHub membership names, and a `platforms` run is the manual full run.
# Placing a lane on GitLab for good is a change to its `kinds` instead.
.gitlab-only-main-nightly:
  rules:
    - !reference [.linux-pool, rules]
    - if: $KITHARA_CI_PROFILE == "gitlab-only" && $KITHARA_PIPELINE_KIND =~ /^(main|nightly|platforms)$/
      interruptible: false

.gitlab-only-branch-main-merge-request:
  rules:
    - !reference [.linux-pool, rules]
    - if: $KITHARA_CI_PROFILE == "gitlab-only" && $KITHARA_PIPELINE_KIND =~ /^(branch|merge-request|quarantine)$/
    - if: $KITHARA_CI_PROFILE == "gitlab-only" && $KITHARA_PIPELINE_KIND =~ /^(main|platforms)$/
      interruptible: false

.gitlab-only-nightly:
  rules:
    - !reference [.linux-pool, rules]
    - if: $KITHARA_CI_PROFILE == "gitlab-only" && $KITHARA_PIPELINE_KIND =~ /^(nightly|platforms)$/
      interruptible: false

.gitlab-only-branch-main-merge-request-nightly:
  rules:
    - !reference [.linux-pool, rules]
    - if: $KITHARA_CI_PROFILE == "gitlab-only" && $KITHARA_PIPELINE_KIND =~ /^(branch|merge-request|quarantine)$/
    - if: $KITHARA_CI_PROFILE == "gitlab-only" && $KITHARA_PIPELINE_KIND =~ /^(main|nightly|platforms)$/
      interruptible: false

.gitlab-only-weekly:
  rules:
