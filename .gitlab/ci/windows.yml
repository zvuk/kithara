.windows-lane:
  extends: .windows-job
  interruptible: false
  rules:
    - !reference [.platform-windows, rules]
    - !reference [.rules-nightly, rules]
  stage: windows
  timeout: 120 minutes
  needs: []

.windows-suite:
  extends: .windows-lane
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: target/nextest/ci/junit.xml
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - target/nextest/ci/junit.xml

windows:arm64:
  extends: .windows-suite
  script:
    - just ci run windows-arm64

# Off on this host, not gone. The guest is ARM64, so the suite ran under
# emulation and reported on it as much as on the commit; an x86 executor runs
# the same lane on hardware. Set the variable to bring it back here.
windows:x64:
  extends: .windows-suite
  rules:
    - if: $KITHARA_WINDOWS_X64_SUITE == "1"
  script:
    - just ci run windows-x64

# Compiles the workspace and everything it tests with, runs none of it. Whether
# the target still builds is a question this host answers cheaply: the native
# dependencies break per target rather than per instruction executed.
windows:x64-build:
  extends: .windows-lane
  script:
    - just ci run windows-x64-build
