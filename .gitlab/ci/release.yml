.release-build:
  extends:
    - .macos-job
    - .rules-release
  stage: release-build
  timeout: 180 minutes
  needs:
    - apple:test
    - job: deps:semver
      optional: true

release:xcframework:
  extends: .release-build
  script:
    - just ci run release-xcframework --package release
  artifacts:
    expire_in: never
    paths:
      - KitharaFFIInternal.xcframework.zip
      - KitharaFFIInternal.xcframework.zip.sha256
      - Kithara.xcframework.zip
      - Kithara.xcframework.zip.sha256

# The framework a reviewer installs to check a change by hand. It waits only on
# lint: the archive is wanted exactly when the suite is red for reasons outside
# the change under review, and a manual job that is never pressed must not
# block the merge request, which is what `allow_failure` buys under
# `only_allow_merge_if_pipeline_succeeds`.
release:framework-snapshot:
  extends:
    - .macos-job
    - .rules-package
  stage: release-build
  timeout: 90 minutes
  needs:
    - apple:lint
  when: manual
  allow_failure: true
  script:
    - just ci run release-xcframework --package snapshot
  artifacts:
    expire_in: 30 days
    paths:
      - Kithara.xcframework.zip
      - Kithara.xcframework.zip.sha256
      - provenance.json

release:docs:
  extends: .release-build
  timeout: 90 minutes
  script:
    - just ci run release-docs
  artifacts:
    expire_in: never
    paths:
      - Kithara-docs.zip
      - Kithara-docs.zip.sha256

release:wasm:
  extends: .release-build
  timeout: 90 minutes
  script:
    - just ci run release-wasm
  artifacts:
    expire_in: never
    paths:
      - kithara-wasm-pages.zip
      - kithara-wasm-pages.zip.sha256

release:android:
  extends:
    - .android-job
    - .rules-release
  stage: release-build
  timeout: 180 minutes
  needs:
    - apple:test
    - job: deps:semver
      optional: true
  script:
    - just ci run release-android
  artifacts:
    expire_in: never
    paths:
      - kithara.aar
      - kithara.aar.sha256
      - kithara-okhttp.aar
      - kithara-okhttp.aar.sha256
      - kithara-android-docs.zip
      - kithara-android-docs.zip.sha256

release:publish:
  extends:
    - .release-job
    - .rules-release
  stage: release-publish
  timeout: 90 minutes
  needs:
    - job: release:xcframework
      artifacts: true
    - job: release:docs
      artifacts: true
    - job: release:wasm
      artifacts: true
    - job: release:android
      artifacts: true
  environment:
    name: release
  script:
    # The pipeline kind names the channel, and both live in the config. A kind
    # that names none fails here rather than delivering the wrong thing.
    - just ci run release-publish --channel "$KITHARA_PIPELINE_KIND"
  rules:
    # A release is a decision, so someone presses the button. A nightly is not:
    # it replaces one rolling tag with what the branch builds into today, and
    # waiting for a person would leave that tag stale exactly when it matters.
    - if: $KITHARA_PIPELINE_KIND == "release"
      when: manual
    - if: $KITHARA_PIPELINE_KIND == "nightly"
  allow_failure: false
