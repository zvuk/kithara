# The same roll-out on the Mac mini, opted into by starting a pipeline on the
# default branch with `KITHARA_PROVISION` set to `1`, from "Run pipeline" or the
# API. That run is the `provision` kind and carries this job alone. It
# reinstalls services, rewrites the native runner configuration and reloads agents.
#
# The default branch only. Provisioning writes to the machine that serves every
# lane, and a merge-request or quarantine ref carries code no one has reviewed
# yet.
host:provision:
  extends: .macos-job
  stage: apple
  timeout: 180 minutes
  needs: []
  rules:
    - if: $KITHARA_PIPELINE_KIND == "provision"
  script:
    - just ci host provision

# The CI executable the control registration and the periodic agents run is
# the default branch's. A merge that changes what the executable is built from
# replaces it here, so the host runs the code that was merged instead of the
# code of the last provisioning pass; a merge that does not spends no Mac slot
# on it. The paths are xtask and every workspace crate it builds from.
host:replace-binary:
  extends: .macos-job
  stage: apple
  timeout: 30 minutes
  interruptible: false
  needs: []
  rules:
    - if: $KITHARA_PIPELINE_KIND == "main"
      changes:
        paths:
          - .cargo/**/*
          - Cargo.lock
          - Cargo.toml
          - crates/kithara-config/**/*
          - crates/kithara-derive/**/*
          - crates/kithara-devtools/**/*
          - crates/kithara-devtools-trace-format/**/*
          - crates/kithara-platform/**/*
          - crates/kithara-test-args/**/*
          - xtask/**/*
        compare_to: $KITHARA_MAIN_BEFORE_SHA
  script:
    - just ci host mac replace-binary
