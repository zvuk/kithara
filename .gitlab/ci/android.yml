android:build:
  extends: .android-job
  interruptible: false
  rules:
    - !reference [.platform-android, rules]
    - !reference [.rules-integration, rules]
  stage: android
  timeout: 45 minutes
  needs: []
  script:
    - just ci run android-build
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - android/lib/build/generated/jniLibs
      - android/lib/build/generated/uniffi/kotlin

android:test:
  extends:
    - .android-job
    - .judged
    - .measured
  interruptible: false
  rules:
    - !reference [.platform-android, rules]
    - !reference [.rules-integration, rules]
  stage: android
  timeout: 90 minutes
  needs: []
  script:
    - just ci run android-test
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit:
        - .ci-artifacts/junit/android-test.xml
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - target/android-test/
      - .ci-artifacts/junit/
    exclude:
      - target/android-test/**/native/*.tar
      - target/android-test/**/native/jniLibs/**/*
      - target/android-test/**/native/apk/**/*
