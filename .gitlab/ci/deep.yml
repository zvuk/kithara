.deep-job:
  extends:
    - .macos-job
    - .rules-nightly
    - .measured
  stage: deep
  needs: []

# The only sanitizer run that sees inside Accelerate. The nightly channel runs
# it against the default branch; a review ref is offered it by hand, so a
# change that reaches vDSP from the audio thread can be checked before it
# merges. In `rules:`, `manual` blocks the pipeline unless the rule allows the
# job to fail, and a quarantine child still waiting on a job reaches the bridge
# as a failure.
deep:rtsan:
  extends: .deep-job
  timeout: 120 minutes
  rules:
    - !reference [.repeated-jobs, rules]
    - if: $KITHARA_PIPELINE_KIND == "branch"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "nightly"
  script:
    - just ci run deep-rtsan

deep:perf:
  extends: .deep-job
  timeout: 90 minutes
  script:
    - just ci run deep-perf
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - perf-results.txt

deep:bench:
  extends: .deep-job
  timeout: 120 minutes
  interruptible: false
  rules:
    - !reference [.repeated-jobs, rules]
    - if: $KITHARA_PIPELINE_KIND == "branch"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "bench"
    - !reference [.rules-nightly, rules]
  script:
    - just ci run deep-bench
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - bench-results.txt
      - bench-results/

.deps-job:
  extends: .linux-pool-job
  stage: deep
  interruptible: false
  needs: []
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.rules-weekly, rules]

# The audits a review asks for. A weekly sweep runs them too.
.deps-review-job:
  extends: .deps-job
  interruptible: true
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.reused-from-draft, rules]
    - !reference [.rules-verify-and-branch, rules]
    - !reference [.rules-weekly, rules]

# Licence and source policy stays on every import path. Advisories have their
# own job so an unrelated review does not inherit a newly published advisory;
# the weekly sweep and the default branch always run it, and a review compares
# only dependency resolution inputs against the exact base the bridge verified.
deps:deny:
  extends: .deps-review-job
  timeout: 30 minutes
  script:
    - just ci lane deps-deny --kind "$KITHARA_PIPELINE_KIND"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/deps-deny/
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json

deps:advisories:
  extends: .deps-job
  timeout: 30 minutes
  interruptible: true
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.reused-from-draft, rules]
    - !reference [.repeated-jobs, rules]
    - if: $KITHARA_PIPELINE_KIND == "weekly"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "main"
      interruptible: false
    # A branch pushed straight to GitLab has no verified base to compare with.
    - if: $KITHARA_QUARANTINE_BASE_SHA == null
      when: never
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
      changes: &advisory-inputs
        paths:
          - Cargo.lock
          - "**/Cargo.toml"
          - deny.toml
          - .cargo/config.toml
        compare_to: $KITHARA_QUARANTINE_BASE_SHA
    - if: $KITHARA_PIPELINE_KIND == "branch"
      changes: *advisory-inputs
  script:
    - just ci lane deps-advisories --kind "$KITHARA_PIPELINE_KIND"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/deps-deny/
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json

deps:unused:
  extends: .deps-review-job
  timeout: 30 minutes
  script:
    - just ci lane deps-unused --kind "$KITHARA_PIPELINE_KIND"

deps:publish:
  extends: .deps-job
  # GitHub runs it on the other kinds; a GitLab-only profile takes those too.
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.rules-weekly, rules]
    - !reference [.gitlab-only-branch-main-merge-request-nightly, rules]
  timeout: 60 minutes
  script:
    - just ci lane crates-publish --kind "$KITHARA_PIPELINE_KIND"

deps:shear:
  extends: .deps-job
  # GitHub runs it on the other kinds; a GitLab-only profile takes those too.
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.rules-weekly, rules]
    - !reference [.gitlab-only-nightly, rules]
  timeout: 30 minutes
  script:
    - just ci lane deps-shear --kind "$KITHARA_PIPELINE_KIND"

deps:features:
  extends: .deps-job
  timeout: 3 hours
  script:
    - just ci lane deps-features-full --kind "$KITHARA_PIPELINE_KIND"

deps:semver:
  extends: .deps-job
  timeout: 60 minutes
  rules:
    - !reference [.linux-pool, rules]
    - !reference [.rules-weekly, rules]
    - if: $KITHARA_PIPELINE_KIND == "release"
  script:
    - just ci lane deps-semver --kind "$KITHARA_PIPELINE_KIND"
