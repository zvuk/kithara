.deep-job:
  extends:
    - .macos-job
    - .rules-nightly
    - .measured
  stage: deep
  needs: []

deep:rtsan:
  extends: .deep-job
  timeout: 120 minutes
  script:
    - just ci run deep-rtsan

deep:perf:
  extends: .deep-job
  timeout: 90 minutes
  script:
    - just ci run deep-perf
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - perf-results.txt

deep:bench:
  extends: .deep-job
  timeout: 120 minutes
  script:
    - just ci run deep-bench
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - bench-results.txt
      - target/criterion/

.deps-job:
  extends:
    - .linux-job
    - .rules-weekly
  stage: deep
  needs: []

# Advisories and licence bans are the only dependency check on the import path.
# The bridge no longer refuses a merged pull request for moving a manifest, so
# this runs on quarantine as well as on the weekly sweep.
deps:deny:
  extends: .deps-job
  timeout: 30 minutes
  rules:
    - if: $KITHARA_PIPELINE_KIND == "weekly"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
  script:
    - just ci run deps-deny

deps:unused:
  extends: .deps-job
  timeout: 30 minutes
  script:
    - just ci run deps-unused

deps:shear:
  extends: .deps-job
  timeout: 30 minutes
  script:
    - just ci run deps-shear

deps:features:
  extends: .deps-job
  timeout: 3 hours
  script:
    - just ci run deps-features

deps:semver:
  extends: .deps-job
  timeout: 60 minutes
  rules:
    - !reference [.rules-weekly, rules]
    - if: $KITHARA_PIPELINE_KIND == "release"
  script:
    - just ci run deps-semver

# Warp is a required gate on every push and merge request, so it carries no
# platform opt-in: its remaining red contract stays visible until the change is
# green.
deep:warp:
  extends: .linux-job
  stage: deep
  needs: []
  interruptible: false
  timeout: 180 minutes
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "main"
  script:
    - just ci run deep-warp
