.deep-job:
  extends:
    - .macos-job
    - .rules-nightly
    - .measured
  stage: deep
  needs: []

# The only sanitizer run that sees inside Accelerate. The nightly channel runs
# it against the default branch; a review ref is offered it by hand, so a
# change that reaches vDSP from the audio thread can be checked before it
# merges. In `rules:`, `manual` blocks the pipeline unless the rule allows the
# job to fail, and a quarantine child still waiting on a job reaches the bridge
# as a failure.
deep:rtsan:
  extends: .deep-job
  timeout: 120 minutes
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "nightly"
  script:
    - just ci run deep-rtsan

deep:perf:
  extends: .deep-job
  timeout: 90 minutes
  script:
    - just ci run deep-perf
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - perf-results.txt

deep:bench:
  extends: .deep-job
  timeout: 120 minutes
  interruptible: false
  rules:
    - if: $KITHARA_PIPELINE_KIND == "branch"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
      when: manual
      allow_failure: true
      interruptible: true
    - if: $KITHARA_PIPELINE_KIND == "bench"
    - !reference [.rules-nightly, rules]
  script:
    - just ci run deep-bench
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json
      - bench-results.txt
      - bench-results/

.deps-job:
  extends:
    - .macos-job
    - .rules-weekly
  stage: deep
  needs: []

# Licence and source policy stays on every import path. Advisories have their
# own job so an unrelated review does not inherit a newly published advisory;
# the weekly sweep always runs it, and quarantine compares only dependency
# resolution inputs against the exact base the bridge verified.
deps:deny:
  extends: .deps-job
  timeout: 30 minutes
  rules:
    - if: $KITHARA_PIPELINE_KIND == "weekly"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
  script:
    - just ci run deps-deny
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/deps-deny/
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json

deps:advisories:
  extends: .deps-job
  timeout: 30 minutes
  rules:
    - if: $KITHARA_PIPELINE_KIND == "weekly"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
      changes:
        paths:
          - Cargo.lock
          - "**/Cargo.toml"
          - deny.toml
          - .cargo/config.toml
        compare_to: $KITHARA_QUARANTINE_BASE_SHA
  script:
    - just ci run deps-advisories
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .ci-artifacts/deps-deny/
      - .ci-artifacts/cache/gitlab-$CI_JOB_ID-*.json

deps:unused:
  extends: .deps-job
  timeout: 30 minutes
  script:
    - just ci run deps-unused

deps:publish:
  extends: .deps-job
  timeout: 60 minutes
  rules:
    - if: $KITHARA_PIPELINE_KIND == "weekly"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
  script:
    - just ci run crates-publish

deps:shear:
  extends: .deps-job
  timeout: 30 minutes
  script:
    - just ci run deps-shear

deps:features:
  extends: .deps-job
  timeout: 3 hours
  script:
    - just ci run deps-features-full

deps:semver:
  extends: .deps-job
  timeout: 60 minutes
  rules:
    - !reference [.rules-weekly, rules]
    - if: $KITHARA_PIPELINE_KIND == "release"
  script:
    - just ci run deps-semver
