.lane-job:
  extends: .linux-job
  interruptible: false
  rules:
    - !reference [.platform-linux, rules]
    - !reference [.rules-weekly, rules]
  stage: lanes
  timeout: 180 minutes
  needs: []

lanes:doc:
  extends: .lane-job
  script:
    - just ci run linux-doc

lanes:loom:
  extends: .lane-job
  script:
    - just ci run linux-loom

# Live HLS packaging. It reports rather than judges: `allow_failure`, and out of
# `verdict`'s `needs`, because the feature ships to nobody yet.
#
# It takes the weekly kind without `.platform-linux`: no schedule sets
# `KITHARA_PLATFORMS`, which is why no lane beside it has ever run.
lanes:broadcast:
  extends: .lane-job
  allow_failure: true
  rules:
    - !reference [.rules-weekly, rules]
  script:
    - just ci run linux-broadcast

lanes:integration-regressions:
  extends: .lane-job
  script:
    - just ci run linux-integration-regressions

# Linux CI runs in containers with no output device, so `apple:e2e` serves the
# hardware-dependent e2e lanes.

lanes:selenium-firefox:
  extends: .lane-job
  script:
    - just ci run linux-selenium-firefox
