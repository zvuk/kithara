include:
  - local: .gitlab/ci/common.yml
  - local: .gitlab/ci/apple.yml
  - local: .gitlab/ci/host.yml
  - local: .gitlab/ci/linux.yml
  - local: .gitlab/ci/android.yml
  - local: .gitlab/ci/web.yml
  - local: .gitlab/ci/windows.yml
  - local: .gitlab/ci/verdict.yml
  - local: .gitlab/ci/deep.yml
  - local: .gitlab/ci/lanes.yml
  - local: .gitlab/ci/release.yml

stages:
  - apple
  - linux
  - android
  - web
  - windows
  - verdict
  - deep
  - lanes
  - release-build
  - release-publish

# The compiler cache is configured by the lane, not here. Naming it here needs
# the executor's cache root, and only some executors can supply one: a runner
# configuration contributes variables that take part in expansion, while the
# macOS lane is served by `run-single` with a process environment, which does
# not. There the root expanded to nothing and sccache tried to write to the
# root of the filesystem. The bootstrap build it was meant to cover is covered
# instead by keeping the build directory between jobs.
variables:
  CARGO_INCREMENTAL: "0"
  # `GIT_CONFIG_COUNT` below is the git binary's protocol, which libgit2
  # does not read: Cargo's own fetch stayed on the stalling version and
  # spent twenty-five minutes listing the `boringssl` submodule's refs
  # before `deps:deny` ran out its timeout. Fetching through the binary
  # leaves one HTTP version for both.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # GitHub's HTTP/2 ref listing stalls in the Linux runner.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  GIT_DEPTH: "0"
  # Cleaning the tree between jobs deleted the build directory with it, so
  # every job relinked the whole workspace and the compiler cache could only
  # hide part of it. Keep the two build directories; everything else is still
  # removed, so a job never sees a file the commit does not carry.
  GIT_CLEAN_FLAGS: -ffdx -e target -e target-flash-off
  KITHARA_CI_HOST_CONFIG: /etc/kithara-ci/mac-host.toml
  RUST_BACKTRACE: "1"
  SCCACHE_CACHE_SIZE: 50G

default:
  cache: []
