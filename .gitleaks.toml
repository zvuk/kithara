title = "Kithara secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Ignored compiler output is not repository content."
paths = ['''^target(?:/|$)''']

# The scan reads history, so a rule has to describe every commit rather than
# the working tree: a path is whatever it was in the commit being read, and the
# stream helper has since moved out of `kithara-test-utils`.
#
# Scoped by rule and by exact path, with no line condition. A line condition
# was there before and matched nothing — `condition = "AND"` then voided the
# whole entry, and four packaged playlists plus a fixed test key were reported
# as leaks for as long as the lane went unrun.
[[allowlists]]
description = "Packaged HLS fixtures carry public AES material, not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''^assets/drm/index-(shq|slossless|slq|smq)-a1\.m3u8$''',
  '''^(?:tests/src/native|crates/kithara-test-utils/src)/hls_stream\.rs$''',
]
