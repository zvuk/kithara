title = "Kithara secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Ignored compiler output is not repository content."
paths = ['''^target(?:/|$)''']

# The scan reads history, so a rule has to describe every commit rather than
# the working tree: a path is whatever it was in the commit being read, and the
# stream helper has since moved out of `kithara-test-utils`.
#
# Scoped by rule and by exact path, with no line condition. A line condition
# was there before and matched nothing — `condition = "AND"` then voided the
# whole entry, and four packaged playlists plus a fixed test key were reported
# as leaks for as long as the lane went unrun.
[[allowlists]]
description = "Packaged HLS fixtures and test servers carry public AES material, not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''^assets/drm/index-(shq|slossless|slq|smq)-a1\.m3u8$''',
  '''^(?:tests/src/native|crates/kithara-test-utils/src)/hls_stream\.rs$''',
  '''^tests/src/test_server/modeled\.rs$''',
  '''^android/lib/src/androidTest/kotlin/com/kithara/HermeticFixtures\.kt$''',
]

[[allowlists]]
description = "Public content-addressed HLS mux control identity."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/kithara-fixture-gen/src/defs/hls\.rs$''']
regexTarget = "line"
regexes = [
  '''^\s*assert_eq!\(control_key, [\"]1b741cc8a23d0d4dd45952f455f1f65c[\"]\);\s*$''',
]

[[allowlists]]
description = "Public content-addressed fMP4 mux control identity."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/kithara-fixture-media/src/fmp4/mux\.rs$''']
regexTarget = "line"
regexes = ['''^\s*key, [\"]dd9caf25e476d62211f9f042d662e4a5[\"],\s*$''']
