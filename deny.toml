# cargo-deny configuration for kithara
#
# This file is intentionally conservative and focused on:
# - license allow/deny
# - duplicate dependencies visibility
# - basic advisories
#
# Run examples:
#   cargo deny check
#   cargo deny check licenses
#   cargo deny check advisories

[graph]
all-features = true
targets = []

[advisories]
maximum-db-staleness = "P1D"
ignore = [
  # paste is unmaintained but only a transitive dev-dep (unimock -> higher-kinded-types -> paste)
  "RUSTSEC-2024-0436",
  # 2026-08-07. ttf-parser is unmaintained. It arrives under iced's text
  # renderer — fontdb <- cosmic-text <- cryoglyph <- iced_wgpu — and no feature
  # switches that path off, so nothing short of leaving iced removes it. Not a
  # vulnerability. Drop this entry when iced's text stack moves off ttf-parser.
  "RUSTSEC-2026-0192",
  # 2026-08-07. rustybuzz is unmaintained. It arrives under iced's `svg`
  # feature — usvg <- resvg <- iced_tiny_skia — which crates/kithara-ui uses for
  # two icons (play-reverse, zvuk). Removable by rasterising those two and
  # dropping the feature; that file is being rewritten in parallel, so the entry
  # holds until that work lands. Not a vulnerability.
  "RUSTSEC-2026-0206",
]

[licenses]
# kithara is MIT OR Apache-2.0, so allow common permissive licenses.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "OpenSSL",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "BSD-1-Clause",
  "BSL-1.0",
  "NCSA",
  "WTFPL",
]
# In cargo-deny v2, any license NOT in the allow list is implicitly denied.
# Copyleft licenses (GPL, AGPL, LGPL) are rejected automatically.
confidence-threshold = 0.93

# Allow exceptions by crate if needed (keep this list small).
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # symphonia-core partial-read fix used by pending FLAC packet reads
  "https://github.com/gerasim13/Symphonia",
  # bevy_seedling fork carrying firewheel-web-audio: a worklet thread stack size
  # and the firewheel 0.14 port, neither of which is released upstream
  "https://github.com/gerasim13/bevy_seedling",
  # wasm_safe_thread fork serialising the browser worker bootstrap import,
  # which Firefox otherwise loses when two workers start at once
  "https://github.com/gerasim13/wasm_safe_thread",
]
