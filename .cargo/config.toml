[alias]
xtask = "run --package xtask --"

[env]
RUST_TEST_THREADS = "4"

[target.wasm32-unknown-unknown]
runner = [
  "cargo",
  "run",
  "--bin",
  "wasm_test_runner",
  "-p",
  "kithara-integration-tests",
  "--",
]
rustflags = [
  "--cfg=web_sys_unstable_apis",
  "-C",
  "target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128",
  "-C",
  "link-arg=--shared-memory",
  "-C",
  "link-arg=--import-memory",
  # There is deliberately no `--initial-memory` here. A 256 MiB reservation used
  # to stand in this place so dlmalloc would never call `memory.grow`, on the
  # reading that a concurrent grow leaves other instances with a stale memory
  # bound. The heap-donation opt-out in `crates/kithara-ffi/src/web/bindings.rs`
  # makes dlmalloc take every chunk from `memory.grow`, so the reservation can no
  # longer prevent a grow and would only pin 256 MiB that nothing allocates from.
  # The generated shim refreshes its cached views whenever
  # `cachedUint8ArrayMemory0.buffer !== wasm.memory.buffer`, which is what a grow
  # changes.
  "-C",
  "link-arg=--max-memory=1610612736",
  "-C",
  "link-arg=--export=__wasm_init_tls",
  "-C",
  "link-arg=--export=__tls_size",
  "-C",
  "link-arg=--export=__tls_align",
  "-C",
  "link-arg=--export=__tls_base",
  # `wasm-bindgen`'s threading transform reads `__heap_base` to place each
  # thread's id, and reports its absence as "failed to prepare module for
  # threading". The linker defines it but exports nothing by default with
  # imported shared memory, the same reason the TLS symbols are named above.
  "-C",
  "link-arg=--export=__heap_base",
  # panic=abort (NOT immediate-abort) so a panic still reaches whichever hook
  # the binary installed, instead of lowering to a trap that reports nothing.
  "-C",
  "panic=abort",
]

# Rebuilding the standard library belongs to the one target that needs it, and
# is asked for by the command that builds for it. Declared here it would reach
# every nightly invocation from this directory, including the ones that build a
# standard library of their own — Miri builds its interpreter's sysroot and
# then finds two of every crate in it.

# Cargo also applies these pins when a tool builds an external manifest from
# this workspace, including the temporary consumer used by semver-checks.
[patch.crates-io]
# Worklet and worker imports share the same origin-wide bootstrap admission,
# held until the worklet processor has started its wasm thread.
firewheel-web-audio = { git = "https://github.com/gerasim13/bevy_seedling", rev = "75633a05ae4656e95fc2ece238a8ca72adc9fe7e" }
# The renderer's bump-allocated buffers are hand-picked constants sized for
# vello's own 8K test scenes, so a window pays 165 MiB on its first frame
# whatever it draws. The encoding fork derives them from the frame. Upstream at
# linebender/vello; drop this once it lands.
vello_encoding = { git = "https://github.com/gerasim13/vello", rev = "b963c3b2cb9d4f540d7a1f98b5a74caa78dc0431" }
# Firefox loses a module request when two browser workers load the same
# module graph at once, so a thread spawned next to another never starts. The
# fork holds a Web Lock across the worker bootstrap import and wasm thread
# start, whose contended stack allocation waits on shared memory and traps in
# an AudioWorklet; drop this once upstream drewcrawford/wasm_safe_thread
# serialises the bootstrap itself.
wasm_safe_thread = { git = "https://github.com/gerasim13/wasm_safe_thread", rev = "ad74273f8915326c24ca949b72abb0fdd6942cf7" }

# Askama 0.14 config parsing uses the maintained toml parser; remove this
# patch when UniFFI's Askama dependency drops basic-toml upstream.
askama_derive = { git = "https://github.com/gerasim13/askama", rev = "8031efd8e5089b654bd9e750cb367a594d6edf7e" }
