[alias]
xtask = "run --package xtask --"

[env]
RUST_TEST_THREADS = "4"

[target.wasm32-unknown-unknown]
runner = [
  "cargo",
  "run",
  "--bin",
  "wasm_test_runner",
  "-p",
  "kithara-integration-tests",
  "--",
]
rustflags = [
  "--cfg=web_sys_unstable_apis",
  "-C",
  "target-feature=+atomics,+bulk-memory,+mutable-globals",
  "-C",
  "link-arg=--shared-memory",
  "-C",
  "link-arg=--import-memory",
  # There is deliberately no `--initial-memory` here. A 256 MiB reservation used
  # to stand in this place so dlmalloc would never call `memory.grow`, on the
  # reading that a concurrent grow leaves other instances with a stale memory
  # bound. The heap-donation opt-out in `crates/kithara-ffi/src/web/bindings.rs`
  # makes dlmalloc take every chunk from `memory.grow`, so the reservation can no
  # longer prevent a grow and would only pin 256 MiB that nothing allocates from.
  # The generated shim refreshes its cached views whenever
  # `cachedUint8ArrayMemory0.buffer !== wasm.memory.buffer`, which is what a grow
  # changes.
  "-C",
  "link-arg=--max-memory=1610612736",
  "-C",
  "link-arg=--export=__wasm_init_tls",
  "-C",
  "link-arg=--export=__tls_size",
  "-C",
  "link-arg=--export=__tls_align",
  "-C",
  "link-arg=--export=__tls_base",
  # `wasm-bindgen`'s threading transform reads `__heap_base` to place each
  # thread's id, and reports its absence as "failed to prepare module for
  # threading". The linker defines it but exports nothing by default with
  # imported shared memory, the same reason the TLS symbols are named above.
  "-C",
  "link-arg=--export=__heap_base",
  # panic=abort (NOT immediate-abort) so a panic still reaches whichever hook
  # the binary installed, instead of lowering to a trap that reports nothing.
  "-C",
  "panic=abort",
]

# Rebuilding the standard library belongs to the one target that needs it, and
# is asked for by the command that builds for it. Declared here it would reach
# every nightly invocation from this directory, including the ones that build a
# standard library of their own — Miri builds its interpreter's sysroot and
# then finds two of every crate in it.
