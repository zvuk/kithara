[package]
name = "external-ui-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
render = ["dep:kithara-ui", "kithara-ui/render"]
vello = ["render", "kithara-ui/vello", "dep:vello"]
masonry = ["vello", "kithara-ui/masonry", "dep:masonry"]

[dependencies]
kithara-platform = { path = "../../../crates/kithara-platform", default-features = false }
kithara-ui = { path = "../../../crates/kithara-ui", default-features = false, optional = true }
kithara-ui-draw = { path = "../../../crates/kithara-ui-draw" }
kithara-ui-shaping = { path = "../../../crates/kithara-ui-shaping" }
skrifa = "0.37"
masonry = { version = "0.4", optional = true }
vello = { version = "0.6", default-features = false, optional = true }

[[bin]]
name = "consumer"
path = "src/consumer.rs"

[[bin]]
name = "closure"
path = "src/closure.rs"

[[bin]]
name = "host"
path = "src/host.rs"
required-features = ["masonry"]
