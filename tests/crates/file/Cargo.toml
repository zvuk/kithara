[package]
name = "kithara-file-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils", "serial_test"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]

[dependencies]
kithara = { workspace = true, features = ["full", "probe", "symphonia", "resample-rubato"] }
kithara-app = { workspace = true, features = ["analysis-waveform", "beat-nn-small", "lib-only"] }
kithara-integration-tests = { workspace = true }
kithara-test-fixtures = { workspace = true }

kithara-test-utils = { workspace = true, features = ["hang", "mock", "probe"] }

axum = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serial_test = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[lints]
workspace = true

[[test]]
name = "file"
path = "tests/light.rs"

[[test]]
name = "file_heavy"
path = "tests/heavy.rs"
