[package]
name = "kithara-play-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils", "reqwest", "serial_test"]

[features]
default = ["client-reqwest", "tls-rustls", "usdt"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
usdt = ["kithara/usdt", "kithara-integration-tests/usdt"]
apple-fused-src = ["kithara/apple-fused-src"]
network = []
network-manual = []

[dependencies]
kithara = { workspace = true, features = ["usdt", "backend-cpal", "download", "mock", "offline", "queue", "resample-rubato", "signal", "stretch-signalsmith", "tokio-net", "tokio-rt-multi-thread"] }
kithara-dsp = { workspace = true }
kithara-integration-tests = { workspace = true, features = ["all"] }
kithara-test-dylib = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false, features = ["encoded", "library", "packaged", "rhythm", "signal"] }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock"] }

cochlea-features = { workspace = true }
derive_more = { workspace = true }
firewheel = { workspace = true }
num-traits = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
ringbuf = { workspace = true }
serde = { workspace = true }
serial_test = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["download", "apple", "client-wreq"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = ["full", "symphonia", "fdk-aac"] }
kithara-app = { workspace = true, features = ["analysis-waveform", "beat-nn-small", "lib-only"] }

[lints]
workspace = true

[[test]]
name = "play"
path = "tests/suite.rs"

[[test]]
name = "play_heavy"
path = "tests/heavy.rs"

[[test]]
name = "play_stress"
path = "tests/stress.rs"

[[test]]
name = "network"
path = "tests/network.rs"
required-features = ["network"]

[[test]]
name = "network_manual"
path = "tests/network_manual.rs"
required-features = ["network-manual"]
