[package]
name = "kithara-effects-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
# `kithara-test-utils` is named only by the `#[kithara::test]` expansion.
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls", "usdt"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
usdt = ["kithara/usdt", "kithara-integration-tests/usdt"]

[dependencies]
kithara = { workspace = true, features = ["usdt", "backend-cpal", "download", "effects", "mock", "offline", "queue", "resample-rubato", "signal", "stretch-signalsmith", "tokio-net", "tokio-rt-multi-thread"] }
kithara-integration-tests = { workspace = true, features = ["all"] }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["download", "apple", "client-wreq"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = ["full", "symphonia", "fdk-aac"] }

[lints]
workspace = true

[[test]]
name = "effects"
path = "tests/suite.rs"
