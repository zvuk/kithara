[package]
name = "kithara-host-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
apple-fused-src = ["kithara/apple-fused-src"]

[dependencies]
kithara = { workspace = true, features = ["usdt", "mock", "offline", "resample-rubato", "signal"] }
kithara-integration-tests = { workspace = true, features = ["all"] }
kithara-test-dylib = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false, features = ["signal"] }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock"] }

serde = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = ["full", "symphonia"] }

[lints]
workspace = true

[[test]]
name = "host"
path = "tests/suite.rs"
