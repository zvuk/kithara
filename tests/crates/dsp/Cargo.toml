[package]
name = "kithara-dsp-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
# `kithara-test-utils` is named only by the `#[kithara::test]` expansion.
ignored = ["kithara-test-utils"]

[dependencies]
kithara = { workspace = true, features = ["test", "dsp", "host", "play", "signal", "symphonia", "stretch-identity", "client-reqwest", "tls-rustls"] }
kithara-test-utils = { features = ["test"], workspace = true }

[lints]
workspace = true

[[test]]
name = "dsp"
path = "tests/suite.rs"
