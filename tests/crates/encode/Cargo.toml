[package]
name = "kithara-encode-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]

[dependencies]
kithara = { workspace = true, features = [
    "test-utils",
    "bufpool",
    "decode",
    "encode",
    "fdk-aac",
    "ffmpeg",
    "platform",
    "resample-rubato",
    "resampler",
    "signal",
    "stream",
] }
kithara-integration-tests = { workspace = true, features = ["all"] }
kithara-test-fixtures = { workspace = true, default-features = false }

kithara-test-utils = { workspace = true, features = ["hang", "mock"] }

[lints]
workspace = true

[[test]]
name = "encode"
path = "tests/suite.rs"
