[package]
name = "kithara-decode-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
load = ["kithara-integration-tests/load"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
apple-fused-src = ["kithara/apple-fused-src", "kithara-integration-tests/apple-fused-src"]

[dependencies]
kithara = { workspace = true, features = ["test", "usdt", "mock", "offline", "resample-rubato", "signal", "tokio-net", "tokio-rt-multi-thread"] }
kithara-integration-tests = { workspace = true, features = ["all"] }
kithara-test-dylib = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false, features = ["encoded", "packaged", "signal", "wav"] }
kithara-test-utils = { workspace = true, features = ["test", "usdt", "hang", "mock", "temp-dir"] }

derive_more = { workspace = true }
futures = { workspace = true }
num-traits = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
tempfile = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["test", "apple", "client-wreq"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = ["test", "full", "symphonia", "fdk-aac"] }

[lints]
workspace = true

[[test]]
name = "decode"
path = "tests/light.rs"

[[test]]
name = "decode_heavy"
path = "tests/heavy.rs"
