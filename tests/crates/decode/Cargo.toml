[package]
name = "kithara-decode-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils", "serial_test"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
apple-fused-src = ["kithara/apple-fused-src"]

[dependencies]
kithara = { workspace = true, features = ["full", "probe", "symphonia", "fdk-aac", "resample-rubato"] }
kithara-integration-tests = { workspace = true }
kithara-test-fixtures = { workspace = true }
kithara-test-utils = { workspace = true, features = ["hang", "mock", "probe"] }

futures = { workspace = true }
num-traits = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["apple", "client-wreq"] }

[lints]
workspace = true

[[test]]
name = "decode"
path = "tests/light.rs"

[[test]]
name = "decode_heavy"
path = "tests/heavy.rs"
