[package]
name = "kithara-test-dylib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
crate-type = ["lib", "dylib"]

[dependencies]
kithara = { workspace = true, features = ["usdt", "mock", "offline", "signal", "tokio-net", "tokio-rt-multi-thread"] }
# The workspace entry pins `default-features = false`, so a dependency that
# names no closure gets a crate whose ungated modules still reach for
# `kithara::assets`, `kithara::bufpool` and the rest: it does not compile.
# `audio` is the smallest closure that does, and it is a floor rather than a
# choice — a binary that needs `all` asks for it itself, and Cargo unifies.
kithara-integration-tests = { workspace = true, features = ["audio"] }
kithara-test-fixtures = { workspace = true }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = [
    "usdt",
    "analysis",
    "backend-cpal",
    "encode",
    "fdk-aac",
    "ffmpeg",
    "full",
    "mock",
    "queue",
    "resample-rubato",
    "stretch-signalsmith",
    "symphonia",
    "tokio-net",
    "tokio-rt-multi-thread",
] }

[lints]
workspace = true
