[package]
name = "kithara-ffi-web-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
selenium = []

[dependencies]
kithara = { workspace = true, features = ["usdt", "full", "symphonia", "resample-rubato"] }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock", "subscriber"] }

fieldwork = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-integration-tests = { workspace = true, default-features = false, features = ["all"] }
thirtyfour = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
kithara-integration-tests = { workspace = true, default-features = false, features = ["wasm"] }

gloo-timers = { workspace = true }
js-sys = { workspace = true }
tracing-wasm = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true }

[lints]
workspace = true

[[test]]
name = "ffi_web"
path = "tests/suite.rs"
