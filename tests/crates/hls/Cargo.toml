[package]
name = "kithara-hls-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils", "serial_test"]

[features]
default = ["client-reqwest", "tls-rustls", "usdt"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]
usdt = ["kithara/usdt", "kithara-integration-tests/usdt"]
apple-fused-src = ["kithara/apple-fused-src"]

[dependencies]
kithara = { workspace = true, features = ["usdt", "download", "mock", "offline", "queue", "resample-rubato", "signal", "stretch-signalsmith", "tokio-net", "tokio-rt-multi-thread"] }
kithara-integration-tests = { workspace = true, features = ["all"] }
kithara-test-dylib = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false, features = ["hls-inputs"] }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock", "temp-dir"] }

bytes = { workspace = true }
num-traits = { workspace = true }
serial_test = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["download", "apple", "client-wreq"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = ["full", "symphonia", "fdk-aac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { workspace = true }

[lints]
workspace = true

[[test]]
name = "hls"
path = "tests/light.rs"

[[test]]
name = "hls_heavy"
path = "tests/heavy.rs"

[[test]]
name = "hls_stress"
path = "tests/stress.rs"
