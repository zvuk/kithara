[package]
name = "kithara-analysis-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
# `kithara-test-utils` is reached only through the `#[kithara::test]` and
# `#[kithara::rtsan_forbid_blocking]` expansions, which name
# `::kithara_test_utils`; no source line in this crate spells the crate out.
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]

[dependencies]
kithara = { workspace = true, features = [
    "usdt",
    "analysis",
    "audio",
    "bufpool",
    "platform",
    "resample-rubato",
    "resampler",
    "signal",
] }
kithara-integration-tests = { workspace = true, features = ["all", "analysis"] }
kithara-test-dylib = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false, features = ["native-fixtures"] }
kithara-test-utils = { workspace = true, features = ["usdt"] }

url = { workspace = true }

[lints]
workspace = true

[[test]]
name = "analysis"
path = "tests/suite.rs"
