[package]
name = "kithara-warp-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["playback", "stretch-signalsmith", "usdt"]
mock = []
client-wreq = ["kithara/client-wreq", "kithara-integration-tests?/client-wreq"]
playback = [
    "mock",
    "kithara/decode",
    "kithara/offline",
    "kithara/queue",
    "kithara/resampler",
    "kithara/tokio-rt-multi-thread",
    "dep:kithara-derive",
    "dep:kithara-integration-tests",
    "dep:serde",
    "dep:serde_json",
]
stretch-signalsmith = ["kithara/stretch-signalsmith"]
stretch-glide = ["kithara/stretch-glide"]
flash = ["kithara/flash", "kithara-test-utils/flash", "kithara-integration-tests?/flash"]
load = ["kithara-test-utils/load", "kithara-integration-tests?/load"]
no-block = ["kithara/no-block", "kithara-test-utils/no-block", "kithara-integration-tests?/no-block"]
usdt = ["kithara/usdt", "kithara-test-utils/usdt", "kithara-integration-tests?/usdt"]

[dependencies]
kithara = { workspace = true, features = ["beat", "mock", "platform", "signal", "stretch-glide", "warp"] }
kithara-derive = { workspace = true, optional = true }
kithara-integration-tests = { workspace = true, optional = true, features = ["all", "analysis"] }
kithara-test-utils = { workspace = true, features = ["temp-dir"] }
num-traits = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(all(target_os = "windows", target_env = "msvc"))))'.dependencies]
kithara = { workspace = true, features = ["stretch-bungee"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-test-fixtures = { workspace = true, default-features = false, features = ["library", "native-fixtures"] }

[lints]
workspace = true

[[test]]
name = "warp"
path = "tests/suite.rs"
required-features = ["stretch-signalsmith"]

[[test]]
name = "warp_playback"
path = "tests/playback.rs"
required-features = ["playback", "stretch-signalsmith"]
