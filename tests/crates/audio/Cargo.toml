[package]
name = "kithara-audio-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils", "serial_test"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]

[dependencies]
kithara = { workspace = true, default-features = false, features = ["assets", "audio", "bufpool", "decode", "file", "platform", "play", "record", "resample-rubato", "resampler", "signal", "stream", "stretch-bungee", "stretch-signalsmith", "symphonia", "test-utils", "warp"] }
kithara-integration-tests = { workspace = true, default-features = false, features = ["audio"] }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["hang", "mock"] }

assert_no_alloc = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["test-utils", "apple", "client-wreq"] }

[lints]
workspace = true

[[test]]
name = "audio"
path = "tests/suite.rs"

[[test]]
name = "audio_heavy"
path = "tests/heavy.rs"
