[package]
name = "kithara-audio-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils", "serial_test"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]

[dependencies]
kithara = { workspace = true, default-features = false, features = ["assets", "audio", "bufpool", "decode", "file", "platform", "play", "probe", "resample-rubato", "resampler", "signal", "stream", "stretch-signalsmith", "test-utils", "warp"] }
kithara-integration-tests = { workspace = true, default-features = false, features = ["audio"] }
kithara-test-dylib = { workspace = true }
kithara-test-fixtures = { workspace = true, default-features = false }
kithara-test-utils = { workspace = true, features = ["hang", "mock", "probe"] }

assert_no_alloc = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

# `bungee-sys` fails through `cmake`/MSVC and its build script refuses Android
# by target triple. Android stretches through Signalsmith, the backend
# `kithara-ffi`'s `android` feature selects.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(all(target_os = "windows", target_env = "msvc"))))'.dependencies]
kithara = { workspace = true, default-features = false, features = ["stretch-bungee"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["apple", "client-wreq"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = ["record", "symphonia"] }

[lints]
workspace = true

[[test]]
name = "audio"
path = "tests/suite.rs"

[[test]]
name = "audio_heavy"
path = "tests/heavy.rs"
