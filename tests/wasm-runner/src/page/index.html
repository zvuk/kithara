<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
  </head>
  <body>
    <pre id="output" style="__STYLE__">Loading scripts...</pre>
    <pre id="console_output" style="__STYLE__"></pre>
    <script>
     const nocapture = __NOCAPTURE__;
     const append = id => (...args) => {
         const logs = document.getElementById(id);
         for (const msg of args) {
             logs.appendChild(document.createTextNode(String(msg) + "\n"));
         }
     };
     for (const method of ["debug", "log", "info", "warn", "error"]) {
         const on_method = `on_console_${method}`;
         console[method] = function (...args) {
             append(nocapture ? "output" : "console_output").apply(this, args);
             if (window[on_method]) {
                 window[on_method](args);
             }
         };
     }
     window.__wbg_test_invoke = f => f();
    </script>
    <script src="run.js" type="module"></script>
  </body>
</html>
