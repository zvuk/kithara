[package]
name = "kithara-wasm-runner-fixture"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true

# One pass, one failure and one ignored test per mode the runner supports. The
# browser lane runs them through `kithara-wasm-test-runner`'s protocol test.
[[test]]
name = "browser"
path = "tests/browser.rs"
test = false

[[test]]
name = "worker"
path = "tests/worker.rs"
test = false
